        '<div class="dash-detail-summary">' +
          (agg.produzioneTarget ? '<span>Produzione <strong>' + formatEuroClient(agg.produzione) + ' / ' + formatEuroClient(agg.produzioneTarget) + '</strong></span>' : '') +
          '<span>Percorso <strong>' + agg.km + ' km</strong></span>' +
        '</div>' +
        '<div class="dash-detail-actions">' +
          (agg.multiGiorno ? '' : '<button class="btn-secondary" data-action="riempi-buchi" data-giorno="' + giornoUnico + '">🧩 Riempi buchi</button>') +
          '<button class="btn-secondary" data-action="seleziona-elenco" data-giorno="' + giornoUnico + '">📋 Seleziona da elenco</button>' +
          '<button class="btn-secondary" data-action="aggiungi-intervento" data-giorno="' + giornoUnico + '">+ Aggiungi intervento</button>' +
        '</div>' +
      '</div>' + corpo;
  }

  function dashRimuoviTappa_(id, row) {
    if (!window.confirm('Rimuovere questo intervento dal percorso? Tornerà "Da pianificare" e non sarà più riproposto automaticamente per questa data (resta comunque selezionabile a mano).')) return;
    callServer('ripianificaIntervento', id, row).then(function () {
      toast('Intervento rimosso: torna "Da pianificare".', 'success');
      caricaDashboard();
    }).catch(function (err) { toast('Errore nella rimozione: ' + (err.message || err), 'error'); });
  }

  function dashCompletaTappa_(id, row) {
    callServer('segnaCompletato', id, row).then(function () {
      toast('Intervento segnato come completato.', 'success');
      caricaDashboard();
    }).catch(function (err) { toast('Errore: ' + (err.message || err), 'error'); });
  }

  function dashInviaMailTappa_(id, row, cliente, giaInviataIl) {
    var messaggio = giaInviataIl
      ? 'Mail già inviata per "' + cliente + '" il ' + giaInviataIl + '. Inviarla di nuovo?'
      : 'Confermi l\'invio della mail di pianificazione per "' + cliente + '"?';
    if (!window.confirm(messaggio)) return;
    callServer('inviaMailPianificazione', id, row).then(function (esito) {
      toast('Mail inviata a: ' + esito.to + (esito.cc ? ' (Cc: ' + esito.cc + ')' : ''), 'success');
      caricaDashboard();
    }).catch(function (err) { toast('Errore nell\'invio della mail: ' + (err.message || err), 'error'); });
  }

  /**
   * Ripianifica squadra/giorno usando i pianificati rimasti + il pool disponibile, per riempire il
   * buco lasciato da una deselezione (o semplicemente per massimizzare l'utilizzo del turno).
   * Prima chiede in anteprima (senza scrivere nulla) se il riempimento sposterebbe l'orario di
   * qualche intervento già pianificato: se sì, chiede all'utente se accettare lo spostamento o
   * mantenere gli orari già fissati (riempiendo di conseguenza, magari con meno tappe aggiunte).
   */
  function riempiBucoGiornoClick(squadraId, giornoStr) {
    mostraCaricamento('dash-detail');
    return callServer('anteprimaRiempiBucoGiorno', squadraId, giornoStr).then(function (esito) {
      var consentiSpostamento = true;
      if (esito.spostamenti.length) {
        var elenco = esito.spostamenti.map(function (s) {
          return '- ' + s.cliente + ': ' + s.oraOriginale + ' → ' + s.oraNuova;
        }).join('\n');
        var messaggio = 'Riempiendo il buco, l\'orario di ' + (esito.spostamenti.length === 1 ? 'un intervento già pianificato cambierebbe' : esito.spostamenti.length + ' interventi già pianificati cambierebbe') + ':\n\n' + elenco +
          '\n\nPremi OK per accettare lo spostamento, oppure Annulla per mantenere gli orari già fissati (il riempimento si limiterà ad aggiungere tappe dopo l\'ultima già pianificata).';
        consentiSpostamento = window.confirm(messaggio);
      }
      return callServer('riempiBucoGiorno', squadraId, giornoStr, consentiSpostamento);
    }).then(function (anteprima) {
      var msg = anteprima.tappe.length
        ? 'Buco riempito: ' + anteprima.tappe.length + ' tappe pianificate per ' + anteprima.squadraNome + ' il ' + giornoStr + '.'
        : 'Nessun intervento disponibile da inserire per ' + anteprima.squadraNome + ' il ' + giornoStr + '.';
      toast(msg, 'success');
      return caricaDashboard();
    }).catch(function (err) { toast('Errore nel riempimento: ' + (err.message || err), 'error'); }).finally(function () {
      nascondiCaricamento('dash-detail');
    });
  }

  // ---------- dialog: aggiungi intervento con orario fisso ----------
  var aggiungiState = { squadraId: null, giorno: null };

  function apriAggiungiIntervento(squadraId, giornoStr) {
    var squadra = state.squadre.filter(function (s) { return s.id === squadraId; })[0];
    aggiungiState.squadraId = squadraId;
    aggiungiState.giorno = giornoStr;
    document.getElementById('dlg-aggiungi-titolo').textContent = 'Aggiungi intervento — ' + (squadra ? squadra.nome : squadraId) + ' — ' + giornoStr;
    document.getElementById('form-aggiungi-intervento').reset();
    document.getElementById('agg-priorita').value = 'Normale';
    document.getElementById('agg-durata').value = 60;
    document.getElementById('agg-ricavo').value = 0;
    document.getElementById('agg-tipo-attivita').value = '';
    document.getElementById('dlg-aggiungi').classList.remove('hidden');
  }

  function salvaAggiungiIntervento() {
    var cliente = document.getElementById('agg-cliente').value.trim();
    var indirizzo = document.getElementById('agg-indirizzo').value.trim();
    var ora = document.getElementById('agg-ora').value;
    if (!cliente || !indirizzo) { toast('Cliente e indirizzo sono obbligatori.', 'error'); return; }
    if (!ora) { toast('Indica l\'ora.', 'error'); return; }
    var intervento = {
      cliente: cliente,
      indirizzo: indirizzo,
      tipoAttivita: document.getElementById('agg-tipo-attivita').value,
      priorita: document.getElementById('agg-priorita').value,
      durataMinuti: parseFloat(document.getElementById('agg-durata').value) || 60,
      telefono: document.getElementById('agg-telefono').value.trim(),
      ricavo: parseFloat(document.getElementById('agg-ricavo').value) || 0
    };
    var btn = document.getElementById('btn-salva-aggiungi-intervento');
    btn.disabled = true; btn.textContent = 'Salvataggio…';
    callServer('creaEPianificaIntervento', intervento, aggiungiState.squadraId, aggiungiState.giorno, ora).then(function () {
      toast('Intervento creato e pianificato.', 'success');
      document.getElementById('dlg-aggiungi').classList.add('hidden');
      caricaDashboard();
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () {
      btn.disabled = false; btn.textContent = 'Salva e pianifica';
    });
  }

  function setupDashboardTab() {
    var oggi = new Date();
    var elDal = document.getElementById('dash-dal');
    var elAl = document.getElementById('dash-al');
    if (elDal) elDal.value = toInputDate(oggi);
    if (elAl) elAl.value = toInputDate(oggi);
    on('dash-dal', 'change', caricaDashboard);
    on('dash-al', 'change', caricaDashboard);

    document.querySelectorAll('.map-mode-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { setMapMode(btn.dataset.mapMode); });
    });

    onQuery('#dash-team-list', 'click', function (e) {
      var card = e.target.closest('[data-squadra]');
      if (!card) return;
      dashState.selezionata = card.dataset.squadra;
      renderDashTeamList();
      renderDashMap();
      renderDashDetail();
    });

    onQuery('#dash-detail', 'click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var giornoInput = btn.dataset.giorno;
      var giornoStr = giornoInput ? fromInputDate(giornoInput) : null;
      var action = btn.dataset.action;
      var squadra = state.squadre.filter(function (s) { return s.id === dashState.selezionata; })[0];
      if (action === 'rimuovi-tappa') {
        dashRimuoviTappa_(btn.dataset.id, btn.dataset.row);
      } else if (action === 'completa-tappa') {
        dashCompletaTappa_(btn.dataset.id, btn.dataset.row);
      } else if (action === 'nota-tappa') {
        apriNotaIntervento({ id: btn.dataset.id, _row: parseInt(btn.dataset.row, 10), cliente: btn.dataset.cliente });
      } else if (action === 'invia-mail-tappa') {
        dashInviaMailTappa_(btn.dataset.id, btn.dataset.row, btn.dataset.cliente, btn.dataset.inviata);
      } else if (action === 'modifica-orario') {
        apriModificaOrarioTappa_({ id: btn.dataset.id, row: parseInt(btn.dataset.row, 10), cliente: btn.dataset.cliente, ora: btn.dataset.ora, durata: parseInt(btn.dataset.durata, 10) });
      } else if (action === 'riempi-buchi') {
        if (!window.confirm('Ripianificare "' + (squadra ? squadra.nome : dashState.selezionata) + '" per il ' + giornoStr + ' includendo eventuali interventi disponibili per riempire le ore libere?')) return;
        riempiBucoGiornoClick(dashState.selezionata, giornoStr);
      } else if (action === 'seleziona-elenco') {
        apriSelezioneDaElenco(dashState.selezionata, giornoStr);
      } else if (action === 'aggiungi-intervento') {
        apriAggiungiIntervento(dashState.selezionata, giornoStr);
      }
    });

    on('btn-apri-pianifica-intervallo', 'click', function () { document.getElementById('dlg-intervallo').classList.remove('hidden'); });
    on('btn-salva-aggiungi-intervento', 'click', salvaAggiungiIntervento);
    document.querySelectorAll('[data-close-dlg]').forEach(function (btn) {
      btn.addEventListener('click', function () { document.getElementById(btn.dataset.closeDlg).classList.add('hidden'); });
    });

    setupDialogIntervalloESelezione();
  }

  // ---------- Analysis (solo Admin) ----------
  function setupAnalysisTab() {
    var oggi = new Date();
    var primoDelMese = new Date(oggi.getFullYear(), oggi.getMonth(), 1);
    document.getElementById('an-dal').value = toInputDate(primoDelMese);
    document.getElementById('an-al').value = toInputDate(oggi);

    populaSelectAnalysisSquadra_();

    on('btn-an-aggiorna', 'click', caricaAnalysis);

    document.querySelectorAll('[data-an-preset]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var lunedi, fine;
        var now = new Date();
        if (btn.dataset.anPreset === 'settimana') {
          var giornoSett = (now.getDay() + 6) % 7; // 0 = lunedì
          lunedi = new Date(now.getFullYear(), now.getMonth(), now.getDate() - giornoSett);
          fine = now;
        } else {
          lunedi = new Date(now.getFullYear(), now.getMonth(), 1);
          fine = now;
        }
        document.getElementById('an-dal').value = toInputDate(lunedi);
        document.getElementById('an-al').value = toInputDate(fine);
        caricaAnalysis();
      });
    });

    document.querySelectorAll('[data-an-toggle]').forEach(function (gruppo) {
      gruppo.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          gruppo.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
          var toggle = gruppo.dataset.anToggle;
          if (toggle === 'ricavo-vista') { analysisState.ricavoVista = btn.dataset.val; renderRicavo_(); }
          if (toggle === 'tempi-vista') { analysisState.tempiVista = btn.dataset.val; renderTempi_(); }
          if (toggle === 'nuovi-vista') { analysisState.nuoviVista = btn.dataset.val; renderNuovi_(); }
        });
      });
    });

    on('an-soglia-backlog', 'change', caricaAnalysis);
    on('an-includi-aperti', 'change', caricaAnalysis);
    on('an-squadra', 'change', caricaAnalysis);
  }

  function populaSelectAnalysisSquadra_() {
    var sel = document.getElementById('an-squadra');
    if (!sel) return;
    var valorePrecedente = sel.value;
    sel.innerHTML = '<option value="">Tutti</option>' +
      state.squadre.map(function (s) { return '<option value="' + s.id + '">' + escapeHtml(s.nome) + '</option>'; }).join('');
    sel.value = valorePrecedente;
  }

  function caricaAnalysis() {
    var dal = document.getElementById('an-dal').value, al = document.getElementById('an-al').value;
    if (!dal || !al) { toast('Seleziona un intervallo Dal/Al.', 'error'); return Promise.resolve(); }
    mostraCaricamento('an-grid');
    var filtri = {
      dal: fromInputDate(dal), al: fromInputDate(al),
      squadraId: document.getElementById('an-squadra').value,
      includiAperti: document.getElementById('an-includi-aperti').checked,
      sogliaBacklogGiorni: parseInt(document.getElementById('an-soglia-backlog').value, 10) || 0
    };
    return callServer('getAnalisiDashboard', filtri).then(function (dati) {
      analysisState.caricato = true;
      analysisState.dati = dati;
      renderAnalysis();
    }).catch(function (err) {
      toast(err.message || String(err), 'error');
    }).then(function () { nascondiCaricamento('an-grid'); });
  }

  function renderAnalysis() {
    if (!analysisState.dati) return;
    renderRicavo_();
    renderTempi_();
    renderNuovi_();
    renderTassi_();
    renderSospensioni_();
    renderBacklog_();
    renderSla_();
    renderRicavoAttivita_();
    renderKm_();
    renderComune_();
  }

  /** Righe [{etichetta, valore, colore}] come barre orizzontali, larghezza proporzionale al massimo. */
  function renderBarre_(containerId, righe, formattaValore) {
    var el = document.getElementById(containerId);
    if (!el) return;
    if (!righe.length) { el.innerHTML = '<div class="empty-hint">Nessun dato nel periodo selezionato.</div>'; return; }
    var max = Math.max.apply(null, righe.map(function (r) { return r.valore; }).concat([0.0001]));
    el.innerHTML = righe.map(function (r) {
      var pct = Math.max(2, Math.round((r.valore / max) * 100));
      return '<div class="an-bar-riga">' +
        '<span class="an-bar-etichetta">' + escapeHtml(r.etichetta) + '</span>' +
        '<span class="an-bar-traccia"><span class="an-bar-riempimento" style="width:' + pct + '%;' + (r.colore ? 'background:' + r.colore + ';' : '') + '"></span></span>' +
        '<span class="an-bar-valore">' + (formattaValore ? formattaValore(r.valore) : r.valore) + '</span>' +
      '</div>';
    }).join('');
  }

  function renderListaValori_(containerId, righe, formattaValore) {
    var el = document.getElementById(containerId);
    if (!el) return;
    if (!righe.length) { el.innerHTML = '<div class="empty-hint">Nessun dato.</div>'; return; }
    el.innerHTML = righe.map(function (r) {
      return '<div class="an-lista-riga"><span class="an-lista-nome">' +
        (r.colore ? '<span class="dot" style="background:' + r.colore + '"></span>' : '') +
        escapeHtml(r.nome) + '</span><span class="an-lista-valore">' + (formattaValore ? formattaValore(r.valore) : r.valore) + '</span></div>';
    }).join('');
  }

  function renderRicavo_() {
    var d = analysisState.dati.ricavo;
    document.getElementById('an-ricavo-totale').textContent = formatEuroClient(d.totale);
    var serie = analysisState.ricavoVista === 'mensile' ? d.serieMensile : d.serieSettimanale;
    renderBarre_('an-ricavo-serie', serie.map(function (s) { return { etichetta: s.etichetta, valore: s.totale }; }), formatEuroClient);
    renderListaValori_('an-ricavo-per-squadra', d.perSquadra.map(function (s) { return { nome: s.squadraNome, valore: s.totale, colore: s.colore }; }), formatEuroClient);
  }

  function etichettaMetricaTempo_(chiave) {
    return { primaLavorazione: 'Tempo di prima lavorazione', lavorazione: 'Tempo di lavorazione medio', completamento: 'Tempo di completamento' }[chiave];
  }

  function renderTempi_() {
    var t = analysisState.dati.tempi;
    var chiavi = ['primaLavorazione', 'lavorazione', 'completamento'];
    var html = '';
    if (analysisState.tempiVista === 'cumulativo') {
      html += chiavi.map(function (k) {
        var m = t[k].cumulativo;
        return '<div class="an-stat-riga"><span>' + etichettaMetricaTempo_(k) + '</span>' +
          '<strong>' + (m.media !== null ? m.media + ' gg' : '—') + '</strong></div>' +
          '<div class="sub" style="margin:-2px 0 8px;">su ' + m.n + ' interventi</div>';
      }).join('');
    } else {
      var tuttiTipi = {};
      chiavi.forEach(function (k) { t[k].perAttivita.forEach(function (r) { tuttiTipi[r.tipoAttivita] = true; }); });
      var tipi = Object.keys(tuttiTipi).sort();
      if (!tipi.length) {
        html = '<div class="empty-hint">Nessun dato nel periodo selezionato.</div>';
      } else {
        html += '<table class="an-tabella"><thead><tr><th>Tipo attività</th>' +
          chiavi.map(function (k) { return '<th>' + etichettaMetricaTempo_(k) + '</th>'; }).join('') + '</tr></thead><tbody>';
        html += tipi.map(function (tipo) {
          return '<tr><td>' + escapeHtml(tipo) + '</td>' + chiavi.map(function (k) {
            var r = t[k].perAttivita.filter(function (x) { return x.tipoAttivita === tipo; })[0];
            return '<td>' + (r && r.media !== null ? r.media + ' gg (n=' + r.n + ')' : '—') + '</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
      }
    }
    document.getElementById('an-tempi-corpo').innerHTML = html;
  }

  function renderNuovi_() {
    var d = analysisState.dati.nuoviInterventi;
    document.getElementById('an-nuovi-totale').textContent = d.totale + ' interventi';
    if (analysisState.nuoviVista === 'cumulativo') {
      renderBarre_('an-nuovi-serie', d.serieMensile.map(function (s) { return { etichetta: s.etichetta, valore: s.totale }; }));
    } else {
      var el = document.getElementById('an-nuovi-serie');
      if (!d.serieMensile.length) { el.innerHTML = '<div class="empty-hint">Nessun dato nel periodo selezionato.</div>'; return; }
      var tuttiTipi = {};
      d.serieMensile.forEach(function (s) { Object.keys(s.perGruppo).forEach(function (t) { tuttiTipi[t] = true; }); });
      var tipi = Object.keys(tuttiTipi).sort();
      el.innerHTML = '<table class="an-tabella"><thead><tr><th>Mese</th>' +
        tipi.map(function (t) { return '<th>' + escapeHtml(t) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        d.serieMensile.map(function (s) {
          return '<tr><td>' + escapeHtml(s.etichetta) + '</td>' + tipi.map(function (t) { return '<td>' + (s.perGruppo[t] || 0) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
    }
  }

  function renderTassi_() {
    var t = analysisState.dati.tassi;
    var html = '<div class="an-stat-riga"><span>Totale dispacciati nel periodo</span><strong>' + t.totaleDispacciati + '</strong></div>' +
      '<div class="an-stat-riga"><span>Completati</span><strong>' + t.completati + (t.percCompletati !== null ? ' (' + t.percCompletati + '%)' : '') + '</strong></div>' +
      '<div class="an-stat-riga"><span>Annullati</span><strong>' + t.annullati + (t.percAnnullati !== null ? ' (' + t.percAnnullati + '%)' : '') + '</strong></div>' +
      '<div class="an-stat-riga"><span>Sospesi (attualmente)</span><strong>' + t.sospesi + (t.percSospesi !== null ? ' (' + t.percSospesi + '%)' : '') + '</strong></div>';
    if (t.perAttivita.length) {
      html += '<table class="an-tabella" style="margin-top:10px;"><thead><tr><th>Tipo attività</th><th>Tot.</th><th>Compl.</th><th>Ann.</th><th>Sosp.</th></tr></thead><tbody>' +
        t.perAttivita.map(function (r) {
          return '<tr><td>' + escapeHtml(r.tipoAttivita) + '</td><td>' + r.totale + '</td><td>' + r.completati + '</td><td>' + r.annullati + '</td><td>' + r.sospesi + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    document.getElementById('an-tassi-corpo').innerHTML = html;
  }

  function renderSospensioni_() {
    var s = analysisState.dati.sospensioni;
    document.getElementById('an-sospensioni-corpo').innerHTML =
      '<div class="an-stat-riga"><span>Sospensioni registrate</span><strong>' + s.numeroSospensioni + '</strong></div>' +
      '<div class="an-stat-riga"><span>Interventi sospesi almeno una volta</span><strong>' + s.interventiConAlmenoUnaSospensione + '</strong></div>' +
      '<div class="an-stat-riga"><span>Durata media di una sospensione</span><strong>' + (s.tempoMedioGiorni !== null ? s.tempoMedioGiorni + ' gg' : '—') + '</strong></div>' +
      '<div class="an-stat-riga"><span>Sospensioni medie per intervento</span><strong>' + (s.numeroMedioPerIntervento !== null ? s.numeroMedioPerIntervento : '—') + '</strong></div>';
  }

  function renderBacklog_() {
    var b = analysisState.dati.backlogAging;
    var html = '<div class="an-stat-riga"><span>Interventi "Da pianificare" da più di ' + b.sogliaGiorni + ' gg lavorativi</span><strong>' + b.numero + '</strong></div>';
    if (b.elenco.length) {
      html += '<table class="an-tabella" style="margin-top:8px;"><thead><tr><th>Cliente</th><th>Dispacciato il</th><th>Giorni</th></tr></thead><tbody>' +
        b.elenco.map(function (r) { return '<tr><td>' + escapeHtml(r.cliente) + '</td><td>' + r.dataDispacciamento + '</td><td>' + r.giorniTrascorsi + '</td></tr>'; }).join('') +
        '</tbody></table>';
    }
    document.getElementById('an-backlog-corpo').innerHTML = html;
  }

  function renderSla_() {
    var s = analysisState.dati.slaScadenza;
    document.getElementById('an-sla-corpo').innerHTML =
      '<div class="an-stat-riga"><span>Completati con scadenza impostata</span><strong>' + s.totaleConScadenza + '</strong></div>' +
      '<div class="an-stat-riga"><span>Completati oltre la scadenza</span><strong>' + s.oltreScadenza + (s.percentuale !== null ? ' (' + s.percentuale + '%)' : '') + '</strong></div>';
  }

  function renderRicavoAttivita_() {
    renderListaValori_('an-ricavo-attivita-corpo', analysisState.dati.ricavoMedioPerAttivita.map(function (r) {
      return { nome: r.tipoAttivita + ' (n=' + r.n + ')', valore: r.media };
    }), formatEuroClient);
  }

  function renderKm_() {
    renderListaValori_('an-km-corpo', analysisState.dati.kmPerTecnico.map(function (r) {
      return { nome: r.squadraNome, valore: r.km, colore: r.colore };
    }), function (v) { return v + ' km'; });
  }

  function renderComune_() {
    renderListaValori_('an-comune-corpo', analysisState.dati.distribuzioneComune.map(function (r) {
      return { nome: r.comune, valore: r.numero };
    }));
  }

  // ---------- "La mia squadra" (solo account Squadra) ----------
  function setupSquadraTab() {
    var oggi = new Date();
    document.getElementById('ms-dal').value = toInputDate(oggi);
    document.getElementById('ms-al').value = toInputDate(oggi);

    document.querySelectorAll('.ms-subtab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {

    on('btn-ms-oggi', 'click', function () {

      document.getElementById('ms-dal').value = toInputDate(o);

      caricaMiaSquadra();

    on('btn-ms-aggiorna', 'click', caricaMiaSquadra);

    wireMsAzioni_('#ms-agenda-corpo');

    on('btn-rapporto-aggiungi-articolo', 'click', aggiungiRigaArticoloRapporto_);

  /** Delega i click su Nota/Vedi note/Completa: riusa gli stessi dialog/azioni già usati nel tab Interventi. */

    onQuery(selettore, 'click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var row = parseInt(btn.dataset.row, 10);
      var obj = ((msState.dati && msState.dati.interventi) || []).filter(function (i) { return i._row === row; })[0];
      if (!obj) return;
      var action = btn.dataset.action;
      if (action === 'nota') { apriNotaIntervento(obj); return; }
      if (action === 'vedi-note') { apriListaNote(obj); return; }
      if (action === 'documenti') { apriDocumentiIntervento(obj); return; }
      if (action === 'rapporto') { apriRapportoIntervento_(obj); return; }
      if (action === 'completa') { completaInterventoSquadra_(obj); return; }
    });
  }

    callServer('segnaCompletatoSquadraPropria', obj.id, obj._row).then(function () {
      toast('Intervento segnato come completato.', 'success');

    document.getElementById('rapporto-ora-inizio').value = obj.rapportoOraInizio || obj.oraPianificata || '';
    document.getElementById('rapporto-ora-fine').value = obj.rapportoOraFine || '';

    caricaFirmaSuCanvas_(document.getElementById('rapporto-firma-cliente-canvas'), obj.rapportoFirmaCliente || '');

    el.innerHTML = rapportoInterventoState.articoli.map(function (a, idx) {
      return '<div class="rapporto-articolo-riga">' +

        '<input type="text" data-campo="qta" data-idx="' + idx + '" value="' + escapeHtml(a.qta || '') + '" placeholder="Q.tà">' +
        '<label class="rapporto-check"><input type="checkbox" data-campo="consegnato"' + (a.consegnato ? ' checked' : '') + '> Consegnato</label>' +
        '<label class="rapporto-check"><input type="checkbox" data-campo="ritirato"' + (a.ritirato ? ' checked' : '') + '> Ritirato</label>' +
        '<input type="text" data-campo="descrizione" data-idx="' + idx + '" value="' + escapeHtml(a.descrizione || '') + '" placeholder="Descrizione articolo">' +
        '<button type="button" class="btn-icon danger" data-action="rimuovi-articolo" data-idx="' + idx + '" title="Rimuovi riga">' + ICONA_CESTINO_ + '</button>' +
      '</div>';
    }).join('');
  }

  /** Legge lo stato attuale della tabella articoli direttamente dal DOM (prima di aggiungere/rimuovere una riga, per non perdere quanto già digitato). */
  function raccogliArticoliRapportoDalDom_() {
    var righe = document.querySelectorAll('#rapporto-articoli-corpo .rapporto-articolo-riga');
    return Array.prototype.map.call(righe, function (riga) {
      return {
        codice: riga.querySelector('[data-campo=codice]').value,
        qta: riga.querySelector('[data-campo=qta]').value,
        consegnato: riga.querySelector('[data-campo=consegnato]').checked,
        ritirato: riga.querySelector('[data-campo=ritirato]').checked,
        descrizione: riga.querySelector('[data-campo=descrizione]').value
      };
    });
  }

  function aggiungiRigaArticoloRapporto_() {
    rapportoInterventoState.articoli = raccogliArticoliRapportoDalDom_();
    rapportoInterventoState.articoli.push(Object.assign({}, ARTICOLO_VUOTO_RAPPORTO_));
    renderRapportoArticoli_();
  }

  function rimuoviRigaArticoloRapporto_(idx) {
    var articoli = raccogliArticoliRapportoDalDom_();
    articoli.splice(idx, 1);
    if (!articoli.length) articoli.push(Object.assign({}, ARTICOLO_VUOTO_RAPPORTO_));
    rapportoInterventoState.articoli = articoli;
    renderRapportoArticoli_();
  }

  function salvaRapportoIntervento_() {
    var btn = document.getElementById('btn-salva-rapporto');
    var canvasTecnico = document.getElementById('rapporto-firma-tecnico-canvas');
    var canvasCliente = document.getElementById('rapporto-firma-cliente-canvas');
    var dati = {
      oraInizio: document.getElementById('rapporto-ora-inizio').value,
      oraFine: document.getElementById('rapporto-ora-fine').value,
      articoli: raccogliArticoliRapportoDalDom_(),
      note: document.getElementById('rapporto-note').value,
      concluso: document.getElementById('rapporto-concluso').value,
      oraChiusura: document.getElementById('rapporto-ora-chiusura').value,
      firmaTecnico: firmaCanvasVuota_(canvasTecnico) ? '' : canvasTecnico.toDataURL('image/png'),
      firmaCliente: firmaCanvasVuota_(canvasCliente) ? '' : canvasCliente.toDataURL('image/png')
    };
    btn.disabled = true;
    callServer('salvaRapportoIntervento', rapportoInterventoState.id, rapportoInterventoState.row, dati).then(function () {
      toast('Rapporto di intervento salvato.', 'success');
      document.getElementById('dlg-rapporto').classList.add('hidden');
      caricaMiaSquadra();
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () { btn.disabled = false; });
  }

  /**
   * Firma olografa: pad di disegno su <canvas> (mouse/dito/pennino via Pointer Events, unificati).
   * Sfondo sempre bianco (superficie "carta"), inchiostro nero, indipendente dal tema chiaro/scuro
   * dell'app. Inizializzato UNA SOLA VOLTA per canvas (setupSquadraTab): riaprire il dialog non deve
   * ri-agganciare gli event listener, altrimenti ogni tratto verrebbe disegnato più volte.
   */
  function inizializzaFirmaPad_(canvas) {
    var ctx = canvas.getContext('2d');
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111';
    var disegnando = false;
    var ultimo = null;

    function posizione(e) {
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    }
    function inizio(e) {
      disegnando = true;
      ultimo = posizione(e);
      if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
    function muovi(e) {
      if (!disegnando) return;
      var p = posizione(e);
      ctx.beginPath();
      ctx.moveTo(ultimo.x, ultimo.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ultimo = p;
      canvas.dataset.firmata = '1';
      e.preventDefault();
    }
    function fine() { disegnando = false; ultimo = null; }

    canvas.addEventListener('pointerdown', inizio);
    canvas.addEventListener('pointermove', muovi);
    canvas.addEventListener('pointerup', fine);
    canvas.addEventListener('pointercancel', fine);
    canvas.addEventListener('pointerleave', fine);
  }

  function pulisciFirmaCanvas_(canvas) {
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    canvas.dataset.firmata = '';
  }

  /** Ridisegna una firma già salvata (data URL PNG) sul canvas, per revisionarla/correggerla. */
  function caricaFirmaSuCanvas_(canvas, dataUrl) {
    pulisciFirmaCanvas_(canvas);
    if (!dataUrl) return;
    var ctx = canvas.getContext('2d');
    var img = new Image();
    img.onload = function () { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
    img.src = dataUrl;
    canvas.dataset.firmata = '1';
  }

  function firmaCanvasVuota_(canvas) { return !canvas.dataset.firmata; }

  function caricaMiaSquadra() {
    var dal = document.getElementById('ms-dal').value, al = document.getElementById('ms-al').value;
    if (!dal || !al) { toast('Seleziona un intervallo Dal/Al.', 'error'); return Promise.resolve(); }
    mostraCaricamento('ms-agenda-corpo');
    return callServer('getProgrammazioneSquadraPropria', fromInputDate(dal), fromInputDate(al)).then(function (dati) {
      msState.dati = dati;
      renderMiaSquadra();
    }).catch(function (err) {
      toast(err.message || String(err), 'error');
    }).then(function () { nascondiCaricamento('ms-agenda-corpo'); });
  }

  function renderMiaSquadra() {
    if (!msState.dati) return;
    document.getElementById('ms-squadra-nome').textContent = msState.dati.squadra.nome;
    var dot = document.getElementById('ms-squadra-dot');
    if (dot) dot.style.background = msState.dati.squadra.colore || '#999';
    renderMsAgenda_();
    if (msState.vista === 'mappa') renderMsMappa_();
  }

  /** Riga usata dalla vista Agenda: stato, storico note (icona cliccabile) e azioni Nota/Completa. */
  function msRigaIntervento_(t) {
    var storia = [];
    try { storia = JSON.parse(t.storiaSospensioni || '[]'); } catch (e) { storia = []; }
    if (!Array.isArray(storia)) storia = [];
    var storiaHtml = storia.length
      ? '<button class="btn-icon" data-action="vedi-note" data-row="' + t._row + '" title="Vedi tutte le note">' + ICONA_STORIA_ + '</button>'
      : '';
    var completato = t.stato === 'Completato';
    var azioni = '<button class="btn-icon" data-action="nota" data-row="' + t._row + '" title="Aggiungi nota">' + ICONA_NOTA_ + '</button>' + storiaHtml +
      '<button class="btn-icon" data-action="documenti" data-row="' + t._row + '" title="Documenti">' + ICONA_DOCUMENTO_ + '</button>' +
      '<button class="btn-icon' + (t.rapportoCompilatoIl ? ' sent' : '') + '" data-action="rapporto" data-row="' + t._row + '" title="' +
        (t.rapportoCompilatoIl ? 'Rapporto di Intervento (già compilato il ' + escapeHtml(t.rapportoCompilatoIl) + ')' : 'Compila Rapporto di Intervento') +
      '">' + ICONA_RAPPORTO_ + '</button>';
    if (!completato) {
      azioni += '<button class="btn-icon good" data-action="completa" data-row="' + t._row + '" title="Segna come completato">' + ICONA_CHECK_ + '</button>';
    }
    return '<div class="ms-riga' + (completato ? ' is-completato' : '') + '">' +
      '<span class="ms-riga-ora">' + escapeHtml(t.oraPianificata || '') + '</span>' +
      '<span class="ms-riga-cliente">' + escapeHtml(t.cliente) + '</span>' +
      '<span class="ms-riga-indirizzo">' + escapeHtml(t.indirizzo || '') + '</span>' +
      '<span class="ms-riga-durata">' + (t.durataMinuti || 0) + ' min</span>' +
      '<span class="ms-riga-telefono">' + (t.telefono ? '<a href="tel:' + escapeHtml(t.telefono) + '">' + escapeHtml(t.telefono) + '</a>' : '—') + '</span>' +
      '<span class="ms-riga-stato"><span class="badge ' + (CLASSE_BADGE_STATO_[t.stato] || 'badge-stato-dapianificare') + '">' + escapeHtml(t.stato || '') + '</span></span>' +
      '<span class="row-actions">' + azioni + '</span>' +
    '</div>';
  }

  function renderMsAgenda_() {
    var el = document.getElementById('ms-agenda-corpo');
    var lista = msState.dati.interventi || [];
    if (!lista.length) { el.innerHTML = '<div class="empty-hint">Nessun intervento nel periodo selezionato.</div>'; return; }
    var perGiorno = {};
    var ordineGiorni = [];
    lista.forEach(function (t) {
      var g = t.dataPianificata || '(senza data)';
      if (!perGiorno[g]) { perGiorno[g] = []; ordineGiorni.push(g); }
      perGiorno[g].push(t);
    });
    el.innerHTML = ordineGiorni.map(function (g) {
      return '<div class="ms-day-group">' +
        '<div class="ms-day-group-head">' + escapeHtml(g) + ' — ' + perGiorno[g].length + ' interventi</div>' +
        perGiorno[g].map(msRigaIntervento_).join('') +
      '</div>';
    }).join('');
  }

  function renderMsMappa_() {
    return caricaLeaflet_().then(function () {
      if (!msMapInstance) {
        msMapInstance = L.map('ms-mappa').setView([45.46, 9.19], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(msMapInstance);
        msLayerGroup = L.layerGroup().addTo(msMapInstance);
      }
      msLayerGroup.clearLayers();
      var punti = [];
      ((msState.dati && msState.dati.interventi) || []).forEach(function (t) {
        if (!isNumClient(t.lat) || !isNumClient(t.lng)) return;
        var completato = t.stato === 'Completato';
        var colore = completato ? '#1B6B7C' : '#3D6FB4';
        var icon = L.divIcon({
          className: '',
          html: '<div style="background:' + colore + ';width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);"></div>',
          iconSize: [16, 16], iconAnchor: [8, 8]
        });
        var navUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + t.lat + ',' + t.lng;
        var popup = '<b>' + escapeHtml(t.cliente) + '</b><br>' + escapeHtml(t.indirizzo || '') + '<br>' +
          escapeHtml(t.dataPianificata || '') + (t.oraPianificata ? ' · ' + escapeHtml(t.oraPianificata) : '') + '<br>' +
          'Stato: ' + escapeHtml(t.stato || '') +
          '<br><a href="' + navUrl + '" target="_blank" rel="noopener" class="btn small" style="display:inline-block;margin-top:6px;">🧭 Naviga</a>';
        L.marker([t.lat, t.lng], { icon: icon }).addTo(msLayerGroup).bindPopup(popup);
        punti.push([t.lat, t.lng]);
      });
      if (punti.length) msMapInstance.fitBounds(punti, { padding: [30, 30] });
      setTimeout(function () { if (msMapInstance) msMapInstance.invalidateSize(); }, 60);
    }).catch(function (err) {
      toast('Impossibile caricare la mappa (verifica la connessione a internet o la rete/proxy in uso).', 'error');
    });
  }

  // ---------- bootstrap ----------
  // Ogni setup viene isolato: se una parte fallisce (es. un elemento mancante perché
  // un file HTML non è stato aggiornato/copiato insieme agli altri) non deve impedire
  // alle altre schede di funzionare — altrimenti un solo errore blocca tutti i pulsanti.
  function safeRun_(nome, fn) {
    try {
      fn();
    } catch (e) {
      console.error('Errore inizializzazione "' + nome + '":', e);
      toast('Errore di inizializzazione (' + nome + '). Apri la console del browser (F12) per i dettagli; verifica che tutti i file gas/ siano aggiornati e ripubblicati.', 'error');
    }
  }

  function init() {
    safeRun_('tabs', setupTabs);
    safeRun_('modal', setupModal);
    safeRun_('dashboard', setupDashboardTab);
    safeRun_('interventi', setupInterventiTab);
    safeRun_('squadre', setupSquadreTab);
    safeRun_('listino', setupListinoTab);
    safeRun_('regole', setupRegoleTab);
    safeRun_('analysis', setupAnalysisTab);
    safeRun_('squadra-view', setupSquadraTab);

    mostraCaricamento('dash-team-list', 'dash-detail');
    callServer('getBootstrapData').then(function (data) {
      state.schema = data.schema;
      state.squadre = data.squadre;
      state.utente = data.utente;
      state.ruolo = data.ruolo || 'Admin';
      state.squadraId = data.squadraId || '';
      state.legendaTipoAttivita = data.legendaTipoAttivita || {};
      state.giorniLavorativi = data.giorniLavorativi || 'Lun,Mar,Mer,Gio,Ven';
      document.getElementById('utente-corrente').textContent = data.utente;
      applicaRuolo_(state.ruolo);
      safeRun_('notifiche', setupNotifiche);
      if (state.ruolo === 'Cliente') {
        popolaSelectFiltri();
        populaSelectSquadra();
        nascondiCaricamento('dash-team-list', 'dash-detail');
        mostraTab('interventi');
      } else if (state.ruolo === 'Squadra') {
        nascondiCaricamento('dash-team-list', 'dash-detail');
        mostraTab('miasquadra');
      } else {
        popolaSelectFiltri();
        populaSelectSquadra();
        renderSquadre();
        caricaDashboard();
      }
    }).catch(function (err) {
      // Il toast sparisce dopo pochi secondi: l'errore completo resta anche nella console del
      // browser (F12 → Console) per poterlo leggere/copiare con calma, utile per il supporto.
      console.error('Errore di inizializzazione (getBootstrapData):', err);
      toast('Errore di inizializzazione: ' + (err.message || err), 'error');
      nascondiCaricamento('dash-team-list', 'dash-detail');
    });
  }

  // ---------- campanella notifiche (Admin/Cliente) ----------

  function renderNotificheBadge_(nonLette) {
    var badge = document.getElementById('notifiche-badge');
    if (!badge) return;
    badge.textContent = nonLette > 99 ? '99+' : String(nonLette);
    badge.classList.toggle('hidden', !nonLette);
  }

  function renderNotificheLista_(notifiche) {
    var lista = document.getElementById('notifiche-lista');
    if (!lista) return;
    if (!notifiche.length) {
      lista.innerHTML = '<div class="notifiche-vuoto">Nessuna notifica.</div>';
      return;
    }
    lista.innerHTML = notifiche.map(function (n) {
      return '<button type="button" class="notifica-riga' + (n.letto ? '' : ' non-letta') + '" data-row="' + n.interventoRow + '" data-id="' + escapeHtml(n.interventoId || '') + '">' +
        '<div class="notifica-riga-head"><span>' + escapeHtml(n.cliente || '(cliente sconosciuto)') + '</span>' +
        '<span class="notifica-riga-ods">' + escapeHtml(n.codiceEsterno || 'senza ODS') + '</span></div>' +
        '<div class="notifica-riga-evento">' + escapeHtml(n.evento) + '</div>' +
        '<div class="notifica-riga-ora">' + escapeHtml(n.timestamp || '') + '</div>' +
      '</button>';
    }).join('');
  }

  /** Ricarica badge (e lista, se il pannello è aperto) dal server: chiamata all'avvio e in polling periodico. */
  function caricaNotifiche() {
    if (state.ruolo !== 'Admin' && state.ruolo !== 'Cliente') return Promise.resolve();
    return callServer('getNotifiche').then(function (esito) {
      renderNotificheBadge_(esito.nonLette);
      if (notificheState.aperto) renderNotificheLista_(esito.notifiche);
    }).catch(function (err) { console.warn('Errore caricamento notifiche:', err); });
  }

  function apriPannelloNotifiche_() {
    var pannello = document.getElementById('notifiche-pannello');
    if (!pannello) return;
    notificheState.aperto = true;
    pannello.classList.remove('hidden');
    callServer('getNotifiche').then(function (esito) {
      renderNotificheLista_(esito.notifiche);
      return callServer('segnaNotificheLette');
    }).then(function () {
      renderNotificheBadge_(0);
    }).catch(function (err) { toast('Errore nel caricamento delle notifiche: ' + (err.message || err), 'error'); });
  }

  function chiudiPannelloNotifiche_() {
    var pannello = document.getElementById('notifiche-pannello');
    if (!pannello) return;
    notificheState.aperto = false;
    pannello.classList.add('hidden');
  }

  /**
   * Passa al tab Interventi, ricarica l'elenco fresco dal server (per essere sicuri che
   * l'intervento della notifica ci sia davvero) e applica il filtro "un solo intervento"
   * (impostaFiltroSingoloIntervento_): la lista mostra SOLO quella riga, invece di scorrere in
   * mezzo a tutte le altre.
   */
  function vaiAIntervento_(row, id) {
    chiudiPannelloNotifiche_();
    mostraTab('interventi');
    loadInterventi().then(function () {
      // Preferisce l'id (stabile) al numero di riga fisica: quest'ultimo può essersi spostato nel
      // frattempo se un'altra riga sopra è stata eliminata dopo che questa notifica è stata creata.
      var intervento = id ? state.interventi.filter(function (i) { return i.id === id; })[0] : null;
      if (!intervento && row) intervento = state.interventi.filter(function (i) { return i._row === row; })[0];
      if (!intervento) { toast('Intervento non trovato (potrebbe essere stato eliminato).', 'error'); return; }
      var label = (intervento.cliente || '(cliente sconosciuto)') + ' — ' + (intervento.codiceEsterno || 'senza ODS');
      impostaFiltroSingoloIntervento_(intervento.id, label);
    });
  }

  function setupNotifiche() {
    if (state.ruolo !== 'Admin' && state.ruolo !== 'Cliente') return;
    on('btn-notifiche', 'click', function (e) {
      e.stopPropagation();
      if (notificheState.aperto) chiudiPannelloNotifiche_(); else apriPannelloNotifiche_();
    });
    onQuery('#notifiche-lista', 'click', function (e) {
      var btn = e.target.closest('.notifica-riga');
      if (!btn) return;
      vaiAIntervento_(btn.dataset.row ? parseInt(btn.dataset.row, 10) : null, btn.dataset.id);
    });
    document.addEventListener('click', function (e) {
      var wrap = document.querySelector('.notifiche-wrap');
      if (notificheState.aperto && wrap && !wrap.contains(e.target)) chiudiPannelloNotifiche_();
    });
    caricaNotifiche();
    notificheState.pollTimer = setInterval(caricaNotifiche, 25000);
  }

  /** Nasconde tab/pulsanti riservati all'Admin quando l'account attivo è Cliente (vedi Auth.gs: le
   *  stesse operazioni restano comunque bloccate anche lato server, questo è solo per l'interfaccia). */
  function applicaRuolo_(ruolo) {
    document.body.classList.toggle('role-cliente', ruolo === 'Cliente');
    document.body.classList.toggle('role-squadra', ruolo === 'Squadra');
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
