<script>
(function () {
  'use strict';

  var state = { schema: {}, squadre: [], utente: '', ruolo: 'Admin', squadraId: '', legendaTipoAttivita: {} };
  var modalState = { schemaKey: null, editObj: null };
  var pianState = { squadraId: null, giorno: null, disponibili: [], pianificati: [], pianificatiAltrove: [], ordineCorrente: [], anteprima: null, ignoraTettoViaggio: false };
  var analysisState = { caricato: false, dati: null, ricavoVista: 'settimanale', tempiVista: 'cumulativo', nuoviVista: 'cumulativo' };
  var msState = { vista: 'agenda', dati: null };
  var msMapInstance = null, msLayerGroup = null;
  var notificheState = { aperto: false, pollTimer: null };

  var SAVE_FN = { SQUADRE: 'salvaSquadra', INTERVENTI: 'salvaIntervento', LISTINO: 'salvaVoceListino' };
  var DELETE_FN = { SQUADRE: 'eliminaSquadra', INTERVENTI: 'eliminaIntervento', LISTINO: 'eliminaVoceListino' };

  // ---------- utilità ----------
  /** Collega un listener solo se l'elemento esiste: un ID mancante (file HTML disallineato) non blocca il resto. */
  function on(id, event, handler) {
    var el = document.getElementById(id);
    if (el) { el.addEventListener(event, handler); return true; }
    console.warn('Elemento mancante nel DOM: #' + id + ' (controlla che Index.html sia aggiornato)');
    return false;
  }

  /** Come on(), ma per selettori CSS generici (es. 'tbody' dentro una tabella). */
  function onQuery(selector, event, handler) {
    var el = document.querySelector(selector);
    if (el) { el.addEventListener(event, handler); return true; }
    console.warn('Elemento mancante nel DOM: ' + selector + ' (controlla che Index.html sia aggiornato)');
    return false;
  }

  function escapeHtml(str) {
    return String(str === null || str === undefined ? '' : str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function splitListClient(str) {
    return String(str || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function isNumClient(v) {
    return typeof v === 'number' && !isNaN(v);
  }

  function formatEuroClient(v) {
    return (Math.round((v || 0) * 100) / 100).toLocaleString('it-IT') + '€';
  }

  /** Riepilogo "Produzione: X€ / target Y€" — omesso del tutto se la squadra non ha un target impostato. */
  function formattaProduzioneClient(totale, target) {
    if (!target) return '';
    var raggiunto = (totale || 0) >= target;
    return '<div class="produzione-indicatore' + (raggiunto ? ' ok' : '') + '">Produzione: ' +
      formatEuroClient(totale) + ' / ' + formatEuroClient(target) + '</div>';
  }

  // ---------- anteprima mappa (verifica visiva della geocodifica di un indirizzo) ----------
  function mapEmbedUrlPerQuery(query) {
    return 'https://www.google.com/maps?q=' + encodeURIComponent(query) + '&output=embed';
  }
  function mapEmbedUrlPerCoord(lat, lng) {
    return 'https://www.google.com/maps?q=' + lat + ',' + lng + '&output=embed';
  }

  /** Aggiunge, sotto un campo indirizzo del form, un toggle "Mostra mappa" con anteprima espandibile
   *  (ridimensionabile trascinando l'angolo in basso a destra). Se il record ha già coordinate salvate
   *  le mostra come posizione precisa; altrimenti avvisa che l'indirizzo non è ancora geocodificato e
   *  mostra comunque un'anteprima di ricerca basata sul testo digitato, utile per individuare refusi. */
  function aggiungiAnteprimaMappa(wrap, field, input, existingObj) {
    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'map-preview-toggle';
    toggle.textContent = '🗺️ Mostra mappa';

    var status = document.createElement('div');
    status.className = 'map-preview-status hidden';

    var mapWrap = document.createElement('div');
    mapWrap.className = 'map-preview-wrap hidden';
    var iframe = document.createElement('iframe');
    iframe.setAttribute('loading', 'lazy');
    iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    mapWrap.appendChild(iframe);

    var coordFields = field.mapCoordFields || [];
    var latSalvata = existingObj && coordFields[0] ? existingObj[coordFields[0]] : null;
    var lngSalvata = existingObj && coordFields[1] ? existingObj[coordFields[1]] : null;
    var haCoordSalvate = isNumClient(latSalvata) && isNumClient(lngSalvata);

    function aggiorna(usaCoordSalvate) {
      if (usaCoordSalvate) {
        status.className = 'map-preview-status ok';
        status.textContent = '📍 Posizione salvata: ' + latSalvata.toFixed(5) + ', ' + lngSalvata.toFixed(5) + ' — verrà ricalcolata se modifichi l\'indirizzo e salvi di nuovo.';
        iframe.src = mapEmbedUrlPerCoord(latSalvata, lngSalvata);
      } else if (input.value) {
        status.className = 'map-preview-status warn';
        status.textContent = '⚠ Nessuna coordinata salvata per questo indirizzo: questa è solo un\'anteprima di ricerca. Salva per geocodificarlo davvero.';
        iframe.src = mapEmbedUrlPerQuery(input.value);
      } else {
        status.className = 'map-preview-status warn';
        status.textContent = '⚠ Inserisci un indirizzo per vedere l\'anteprima.';
        iframe.removeAttribute('src');
      }
    }

    toggle.addEventListener('click', function () {
      var isHidden = mapWrap.classList.contains('hidden');
      if (isHidden) {
        mapWrap.classList.remove('hidden');
        status.classList.remove('hidden');
        toggle.textContent = '🗺️ Nascondi mappa';
        aggiorna(haCoordSalvate);
      } else {
        mapWrap.classList.add('hidden');
        status.classList.add('hidden');
        toggle.textContent = '🗺️ Mostra mappa';
      }
    });

    var mapDebounce;
    input.addEventListener('input', function () {
      if (mapWrap.classList.contains('hidden')) return;
      clearTimeout(mapDebounce);
      mapDebounce = setTimeout(function () { aggiorna(false); }, 700);
    });

    wrap.appendChild(toggle);
    wrap.appendChild(status);
    wrap.appendChild(mapWrap);
  }

  function callServer(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); });
      runner[fnName].apply(runner, args);
    });
  }

  function toast(msg, type) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = type || '';
    el.classList.remove('hidden');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 3800);
  }

  /** Mostra/nasconde uno spinner sopra un container mentre attende una risposta dal server (le
   *  chiamate ad Apps Script/Sheets possono richiedere qualche secondo). Accetta uno o più ID. */
  function mostraCaricamento() {
    Array.prototype.forEach.call(arguments, function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('is-loading');
    });
  }
  function nascondiCaricamento() {
    Array.prototype.forEach.call(arguments, function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.remove('is-loading');
    });
  }

  function toInputDate(date) {
    var y = date.getFullYear(), m = ('0' + (date.getMonth() + 1)).slice(-2), d = ('0' + date.getDate()).slice(-2);
    return y + '-' + m + '-' + d;
  }
  function fromInputDate(str) {
    var p = str.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function parseDateStrClient(str) {
    if (!str) return null;
    var p = String(str).split(/[\/\-]/);
    if (p.length !== 3) return null;
    if (p[0].length === 4) return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    return new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
  }
  function timeToMinutesClient(hhmm) {
    var p = String(hhmm || '0:0').split(':');
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
  }
  function minutesToTimeClient(mins) {
    var total = ((Math.round(mins) % 1440) + 1440) % 1440;
    var h = Math.floor(total / 60), m = total % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  // ---------- tabs ----------
  function mostraTab(view) {
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.view === view); });
    document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + view); });
    onShowView(view);
  }

  function setupTabs() {
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { mostraTab(btn.dataset.view); });
    });
  }

  function onShowView(view) {
    if (view === 'dashboard') caricaDashboard();
    if (view === 'interventi') loadInterventi();
    if (view === 'squadre') loadSquadre();
    if (view === 'listino') loadListino();
    if (view === 'impostazioni') { loadRegole(); loadLog(); }
    if (view === 'analysis' && !analysisState.caricato) caricaAnalysis();
    if (view === 'miasquadra') caricaMiaSquadra();
  }

  // ---------- modale generico basato su schema ----------
  function etichettaTipoAttivita_(codice) {
    if (!codice) return codice;
    var significato = state.legendaTipoAttivita[codice];
    return significato ? (codice + ' - ' + significato) : codice;
  }

  /** Rispecchia tipoAttivitaGenerico_ (RouteEngine.gs): vuoto, "Intervento a vuoto" o "Altro" non
   *  sono vincolati dalle Competenze di una squadra, sono sempre assegnabili a qualsiasi squadra. */
  function tipoAttivitaGenericoClient_(tipoAttivita) {
    var t = String(tipoAttivita || '').trim();
    return !t || t === 'Intervento a vuoto' || t === 'Altro';
  }

  function getOptionsForField(field) {
    var opts = [];
    if (field.options) {
      opts = field.options.map(function (o) { return { value: o, label: field.key === 'tipoAttivita' ? etichettaTipoAttivita_(o) : o }; });
    } else if (field.optionsFrom === 'SQUADRE') opts = state.squadre.map(function (s) { return { value: s.id, label: s.nome }; });
    if (field.allowEmptyOption) opts = [{ value: '', label: '— Non specificato —' }].concat(opts);
    return opts;
  }

  function mostraLegendaTipoAttivita_() {
    var corpo = document.getElementById('dlg-legenda-tipo-attivita-corpo');
    var codici = Object.keys(state.legendaTipoAttivita);
    corpo.innerHTML = codici.length
      ? codici.map(function (cod) {
          return '<div class="legenda-tipo-riga"><b>' + escapeHtml(cod) + '</b> — ' + escapeHtml(state.legendaTipoAttivita[cod]) + '</div>';
        }).join('') +
        '<div class="legenda-tipo-riga"><b>Intervento a vuoto</b> — visita effettuata ma senza lavorazione (es. cliente assente)</div>' +
        '<div class="legenda-tipo-riga"><b>Altro</b> — codice non tra quelli noti (SM01-SM05)</div>'
      : '<div class="empty-hint">Legenda non disponibile.</div>';
    document.getElementById('dlg-legenda-tipo-attivita').classList.remove('hidden');
  }

  function openModal(schemaKey, existingObj) {
    modalState.schemaKey = schemaKey;
    modalState.editObj = existingObj || null;
    var def = state.schema[schemaKey];
    var NOME_SINGOLARE_SCHEMA_ = { SQUADRE: 'squadra', INTERVENTI: 'intervento' };
    var nomeSingolare = NOME_SINGOLARE_SCHEMA_[schemaKey] || def.label.toLowerCase();
    document.getElementById('modal-title').textContent = existingObj ? ('Modifica ' + nomeSingolare) : ('Nuov' + (nomeSingolare.slice(-1) === 'a' ? 'a' : 'o') + ' ' + nomeSingolare);
    var form = document.getElementById('modal-form');
    form.innerHTML = '';
    def.fields.forEach(function (field) {
      if (field.readonly && field.mostraInForm && existingObj && existingObj[field.key] !== undefined && existingObj[field.key] !== null && existingObj[field.key] !== '') {
        var wrapSoloLettura = document.createElement('div');
        wrapSoloLettura.className = 'field field-readonly';
        var labelSoloLettura = document.createElement('label');
        labelSoloLettura.textContent = field.label;
        var valoreSoloLettura = document.createElement('div');
        valoreSoloLettura.className = 'field-readonly-value';
        valoreSoloLettura.textContent = field.type === 'number' ? formatEuroClient(existingObj[field.key]) : String(existingObj[field.key]);
        wrapSoloLettura.appendChild(labelSoloLettura);
        wrapSoloLettura.appendChild(valoreSoloLettura);
        if (field.help) {
          var helpSoloLettura = document.createElement('div');
          helpSoloLettura.className = 'field-help';
          helpSoloLettura.textContent = field.help;
          wrapSoloLettura.appendChild(helpSoloLettura);
        }
        form.appendChild(wrapSoloLettura);
        return;
      }
      if (field.readonly) return;
      var wrap = document.createElement('div');
      wrap.className = 'field';
      var label = document.createElement('label');
      label.textContent = field.label + (field.required ? ' *' : '');
      wrap.appendChild(label);
      if (field.key === 'tipoAttivita') {
        var btnLegenda = document.createElement('button');
        btnLegenda.type = 'button';
        btnLegenda.className = 'btn-legenda-inline';
        btnLegenda.textContent = 'ℹ Legenda';
        btnLegenda.addEventListener('click', mostraLegendaTipoAttivita_);
        wrap.appendChild(btnLegenda);
      }

      if (field.type === 'tipiAttivita') {
        var selezionatiTipi = splitListClient(existingObj && existingObj[field.key] !== undefined ? existingObj[field.key] : (field.default || ''));
        var tipiDiv = document.createElement('div');
        tipiDiv.className = 'checklist-squadre';
        tipiDiv.dataset.keyTipiAttivita = field.key;
        (field.options || []).forEach(function (t) {
          var lbl = document.createElement('label');
          var cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = t;
          cb.checked = selezionatiTipi.indexOf(t) !== -1;
          lbl.appendChild(cb); lbl.appendChild(document.createTextNode(etichettaTipoAttivita_(t)));
          tipiDiv.appendChild(lbl);
        });
        wrap.appendChild(tipiDiv);
        if (field.help) {
          var helpTipi = document.createElement('div');
          helpTipi.className = 'field-help';
          helpTipi.textContent = field.help;
          wrap.appendChild(helpTipi);
        }
        form.appendChild(wrap);
        return;
      }

      if (field.type === 'giorni') {
        var selezionatiGiorni = splitListClient(existingObj && existingObj[field.key] !== undefined ? existingObj[field.key] : (field.default || ''));
        var giorniDiv = document.createElement('div');
        giorniDiv.className = 'checklist-squadre';
        giorniDiv.dataset.keyGiorni = field.key;
        GIORNI_ORDINE.forEach(function (g) {
          var lbl = document.createElement('label');
          var cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = g;
          cb.checked = selezionatiGiorni.indexOf(g) !== -1;
          lbl.appendChild(cb); lbl.appendChild(document.createTextNode(g));
          giorniDiv.appendChild(lbl);
        });
        wrap.appendChild(giorniDiv);
        if (field.help) {
          var helpGiorni = document.createElement('div');
          helpGiorni.className = 'field-help';
          helpGiorni.textContent = field.help;
          wrap.appendChild(helpGiorni);
        }
        form.appendChild(wrap);
        return;
      }

      if (field.type === 'color') {
        var paletteColori = ['#1B6B7C', '#2E7D5B', '#B4740E', '#7B4B94', '#C24C6B', '#3D6FB4', '#4E8B3F', '#8C5A2B'];
        var valoreColoreEsistente = existingObj && existingObj[field.key] ? existingObj[field.key] : (field.default || paletteColori[0]);
        var hiddenColore = document.createElement('input');
        hiddenColore.type = 'hidden'; hiddenColore.dataset.key = field.key; hiddenColore.value = valoreColoreEsistente;
        var swatchesWrap = document.createElement('div');
        swatchesWrap.className = 'color-swatches';
        var disegnaSwatches = function () {
          swatchesWrap.innerHTML = '';
          paletteColori.forEach(function (colore) {
            var sw = document.createElement('span');
            var selezionato = colore.toLowerCase() === (hiddenColore.value || '').toLowerCase();
            sw.className = 'swatch' + (selezionato ? ' selected' : '');
            sw.style.background = colore;
            if (selezionato) {
              sw.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M20 6 9 17l-5-5"></path></svg>';
            }
            sw.addEventListener('click', function () { hiddenColore.value = colore; disegnaSwatches(); });
            swatchesWrap.appendChild(sw);
          });
        };
        disegnaSwatches();
        wrap.appendChild(hiddenColore);
        wrap.appendChild(swatchesWrap);
        if (field.help) {
          var helpColore = document.createElement('div');
          helpColore.className = 'field-help';
          helpColore.textContent = field.help;
          wrap.appendChild(helpColore);
        }
        form.appendChild(wrap);
        return;
      }

      // "Il rientro è allo stesso indirizzo della partenza": vuoto = uguale alla partenza (vedi
      // help del campo in Config.gs); qui lo esprimiamo come scelta esplicita invece di lasciare
      // che l'operatore debba capire da solo che un campo vuoto ha quel significato.
      if (schemaKey === 'SQUADRE' && field.key === 'indirizzoRientro') {
        var valoreRientroEsistente = existingObj ? (existingObj.indirizzoRientro || '') : '';
        var ugualeAllaPartenza = !valoreRientroEsistente;
        var checkWrap = document.createElement('label');
        checkWrap.className = 'check-inline';
        var checkUguale = document.createElement('input');
        checkUguale.type = 'checkbox';
        checkUguale.checked = ugualeAllaPartenza;
        checkWrap.appendChild(checkUguale);
        checkWrap.appendChild(document.createTextNode(' Il rientro è allo stesso indirizzo della partenza'));
        form.appendChild(checkWrap);

        var wrapRientro = document.createElement('div');
        wrapRientro.className = 'field';
        wrapRientro.style.display = ugualeAllaPartenza ? 'none' : 'flex';
        var labelRientro = document.createElement('label');
        labelRientro.textContent = field.label;
        var inputRientro = document.createElement('input');
        inputRientro.type = 'text';
        inputRientro.dataset.key = 'indirizzoRientro';
        inputRientro.value = valoreRientroEsistente;
        wrapRientro.appendChild(labelRientro);
        wrapRientro.appendChild(inputRientro);
        if (field.mapPreview) aggiungiAnteprimaMappa(wrapRientro, field, inputRientro, existingObj);
        form.appendChild(wrapRientro);

        checkUguale.addEventListener('change', function () {
          wrapRientro.style.display = checkUguale.checked ? 'none' : 'flex';
          if (checkUguale.checked) inputRientro.value = '';
        });
        return;
      }

      if (field.type === 'ferie') {
        var periodiDiv = document.createElement('div');
        periodiDiv.className = 'ferie-list';
        periodiDiv.dataset.keyFerie = field.key;
        var periodiEsistenti = [];
        try { periodiEsistenti = JSON.parse((existingObj && existingObj[field.key]) || '[]'); } catch (e) { periodiEsistenti = []; }
        if (!Array.isArray(periodiEsistenti)) periodiEsistenti = [];

        function aggiungiRigaFerie(dal, al) {
          var riga = document.createElement('div');
          riga.className = 'ferie-riga';
          var inputDal = document.createElement('input');
          inputDal.type = 'date'; inputDal.className = 'ferie-dal';
          if (dal) { var dDal = parseDateStrClient(dal); if (dDal) inputDal.value = toInputDate(dDal); }
          var inputAl = document.createElement('input');
          inputAl.type = 'date'; inputAl.className = 'ferie-al';
          if (al) { var dAl = parseDateStrClient(al); if (dAl) inputAl.value = toInputDate(dAl); }
          var btnRimuovi = document.createElement('button');
          btnRimuovi.type = 'button'; btnRimuovi.className = 'ferie-rimuovi'; btnRimuovi.textContent = '✕';
          btnRimuovi.addEventListener('click', function () { riga.remove(); });
          riga.appendChild(inputDal);
          riga.appendChild(document.createTextNode(' → '));
          riga.appendChild(inputAl);
          riga.appendChild(btnRimuovi);
          periodiDiv.appendChild(riga);
        }
        periodiEsistenti.forEach(function (p) { aggiungiRigaFerie(p.dal, p.al); });

        var btnAggiungiFerie = document.createElement('button');
        btnAggiungiFerie.type = 'button';
        btnAggiungiFerie.className = 'btn secondary small';
        btnAggiungiFerie.textContent = '+ Aggiungi periodo';
        btnAggiungiFerie.addEventListener('click', function () { aggiungiRigaFerie(); });

        wrap.appendChild(periodiDiv);
        wrap.appendChild(btnAggiungiFerie);
        if (field.help) {
          var helpFerie = document.createElement('div');
          helpFerie.className = 'field-help';
          helpFerie.textContent = field.help;
          wrap.appendChild(helpFerie);
        }
        form.appendChild(wrap);
        return;
      }

      var input;
      if (field.type === 'select') {
        input = document.createElement('select');
        getOptionsForField(field).forEach(function (o) {
          var opt = document.createElement('option');
          opt.value = o.value; opt.textContent = o.label;
          input.appendChild(opt);
        });
      } else if (field.type === 'checkbox') {
        input = document.createElement('input'); input.type = 'checkbox';
      } else if (field.type === 'date') {
        input = document.createElement('input'); input.type = 'text'; input.placeholder = 'gg/mm/aaaa';
      } else if (field.type === 'number') {
        input = document.createElement('input'); input.type = 'number';
      } else {
        input = document.createElement('input'); input.type = 'text';
      }
      input.dataset.key = field.key;
      var value = existingObj && existingObj[field.key] !== undefined && existingObj[field.key] !== null
        ? existingObj[field.key]
        : (field.default !== undefined ? field.default : '');
      if (field.type === 'checkbox') input.checked = !!value; else input.value = value;
      wrap.appendChild(input);
      if (field.help) {
        var help = document.createElement('div');
        help.className = 'field-help';
        help.textContent = field.help;
        wrap.appendChild(help);
      }
      if (field.mapPreview) {
        aggiungiAnteprimaMappa(wrap, field, input, existingObj);
      }
      form.appendChild(wrap);
    });
    document.getElementById('modal-overlay').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  function setupModal() {
    on('modal-cancel', 'click', closeModal);
    on('modal-save', 'click', function () {
      var def = state.schema[modalState.schemaKey];
      var obj = modalState.editObj ? Object.assign({}, modalState.editObj) : {};
      var form = document.getElementById('modal-form');
      var mancante = null;
      form.querySelectorAll('[data-key]').forEach(function (input) {
        var key = input.dataset.key;
        var fieldDef = def.fields.filter(function (f) { return f.key === key; })[0];
        if (input.type === 'checkbox') obj[key] = input.checked;
        else if (input.type === 'number') obj[key] = input.value === '' ? null : parseFloat(input.value);
        else obj[key] = input.value;
        if (fieldDef && fieldDef.required && !obj[key]) mancante = fieldDef.label;
      });
      form.querySelectorAll('[data-key-giorni]').forEach(function (container) {
        var key = container.dataset.keyGiorni;
        obj[key] = Array.prototype.slice.call(container.querySelectorAll('input:checked')).map(function (cb) { return cb.value; }).join(',');
      });
      form.querySelectorAll('[data-key-tipi-attivita]').forEach(function (container) {
        var key = container.dataset.keyTipiAttivita;
        obj[key] = Array.prototype.slice.call(container.querySelectorAll('input:checked')).map(function (cb) { return cb.value; }).join(',');
      });
      form.querySelectorAll('[data-key-ferie]').forEach(function (container) {
        var key = container.dataset.keyFerie;
        var periodi = Array.prototype.slice.call(container.querySelectorAll('.ferie-riga')).map(function (riga) {
          var dal = riga.querySelector('.ferie-dal').value, al = riga.querySelector('.ferie-al').value;
          if (!dal || !al) return null;
          return { dal: fromInputDate(dal), al: fromInputDate(al) };
        }).filter(Boolean);
        obj[key] = JSON.stringify(periodi);
      });
      if (mancante) { toast('Campo obbligatorio mancante: ' + mancante, 'error'); return; }
      var fnName = SAVE_FN[modalState.schemaKey];
      var saveBtn = document.getElementById('modal-save');
      saveBtn.disabled = true;
      callServer(fnName, obj).then(function () {
        toast('Salvato con successo.', 'success');
        closeModal();
        reloadAfterSave(modalState.schemaKey);
      }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () { saveBtn.disabled = false; });
    });
  }

    tbody.innerHTML = list.map(function (v) {
      var qtyEsistente = componiRicavoState.quantitaEsistenti[v.voce];

      var qtyVal = checked ? qtyEsistente : 1;
      return '<tr data-voce="' + escapeHtml(v.voce) + '">' +
        '<td><input type="checkbox" class="cr-check" ' + (checked ? 'checked' : '') + '></td>' +

  function aggiornaTotaleComponiRicavo_() {
    var totale = 0;
    document.querySelectorAll('#componi-ricavo-rows tr').forEach(function (tr) {
      var check = tr.querySelector('.cr-check');
      var qtyInput = tr.querySelector('.cr-qty');
      var subtotEl = tr.querySelector('.cr-subtot');
      var voceObj = listinoState.voci.filter(function (v) { return v.voce === tr.dataset.voce; })[0];
      if (check.checked) {
        var qty = parseFloat(qtyInput.value) || 0;
        var subtot = (voceObj ? voceObj.prezzo : 0) * qty;
        subtotEl.textContent = formatEuroClient(subtot);
        totale += subtot;
      } else {
        subtotEl.textContent = formatEuroClient(0);
      }
    });
    document.getElementById('componi-ricavo-totale').textContent = 'Totale: ' + formatEuroClient(totale);
  }

  function raccogliSelezioneComponiRicavo_() {
    var voci = [];
    document.querySelectorAll('#componi-ricavo-rows tr').forEach(function (tr) {
      var check = tr.querySelector('.cr-check');
      if (!check.checked) return;
      var qty = parseFloat(tr.querySelector('.cr-qty').value);
      if (!qty || qty <= 0) return;
      voci.push({ voce: tr.dataset.voce, quantita: qty });
    });
    return voci;
  }

    // Filtro Data Pianificata (Dal/Al): un intervento senza Data Pianificata (es. ancora "Da
    // pianificare") non ha nulla da confrontare e viene sempre escluso non appena uno dei due
    // estremi è impostato — coerente col fatto che si sta filtrando "cosa è previsto in questo
    // periodo". parseDateStrClient normalizza sia l'input nativo (yyyy-mm-dd) sia il valore
    // salvato (gg/mm/aaaa) in oggetti Date direttamente confrontabili.
    var dataDalStr = document.getElementById('filtro-data-dal').value;
    var dataAlStr = document.getElementById('filtro-data-al').value;
    var dataDal = dataDalStr ? parseDateStrClient(dataDalStr) : null;
    var dataAl = dataAlStr ? parseDateStrClient(dataAlStr) : null;
    return state.interventi.filter(function (i) {
      if (stato && i.stato !== stato) return false;
      if (squadraId && i.squadraId !== squadraId) return false;
      if (tipoAttivita && i.tipoAttivita !== tipoAttivita) return false;
      if (q && (i.cliente || '').toLowerCase().indexOf(q) === -1 && (i.indirizzo || '').toLowerCase().indexOf(q) === -1 && (i.codiceEsterno || '').toLowerCase().indexOf(q) === -1) return false;
      if (dataDal || dataAl) {
        var dataPian = parseDateStrClient(i.dataPianificata);
        if (!dataPian) return false;
        if (dataDal && dataPian < dataDal) return false;
        if (dataAl && dataPian > dataAl) return false;
      }
      return true;
    });
  }

  /** Inline edit: cliccando sulla cella Squadra (anche già valorizzata) la sostituisce con un <select>. */
  function avviaEditSquadraInline_(cella, obj) {
    if (cella.classList.contains('editing')) return;
    cella.classList.add('editing');
    var select = document.createElement('select');
    var optVuoto = document.createElement('option');
    optVuoto.value = ''; optVuoto.textContent = '— Nessuna —';
    select.appendChild(optVuoto);
    state.squadre.forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.nome;
      if (s.id === obj.squadraId) opt.selected = true;
      select.appendChild(opt);
    });
    cella.innerHTML = '';
    cella.appendChild(select);
    select.focus();
    var concluso = false;
    function salva() {
      if (concluso) return;
      concluso = true;
      var nuovoId = select.value;
      if (nuovoId === (obj.squadraId || '')) { renderInterventi(); return; }
      select.disabled = true;
      callServer('salvaIntervento', Object.assign({}, obj, { squadraId: nuovoId })).then(function () {
        toast('Squadra aggiornata.', 'success');
        loadInterventi();
        caricaDashboard();
      }).catch(function (err) { toast(err.message || String(err), 'error'); renderInterventi(); });
    }
    select.addEventListener('change', salva);
    select.addEventListener('blur', function () { setTimeout(function () { if (!concluso) renderInterventi(); }, 150); });
  }

  /** Inline edit: cliccando sulla cella Data/ora (anche già valorizzata) la sostituisce con input data+ora e conferma/annulla. */

      }

  /** Ripete importaGoogleSheetVeneto finché non finisce (gestisce il guardrail di tempo lato server, uno o più batch), aggregando i totali e mostrando l'avanzamento. */
  function eseguiImportVeneto_() {
    var risultato = { creati: 0, aggiornati: 0, falliti: 0, scartatiPerStato: 0, dettagliFalliti: [] };
    function passo(indice) {
      return callServer('importaGoogleSheetVeneto', indice).then(function (r) {
        risultato.creati += r.creati;
        risultato.aggiornati += r.aggiornati;
        risultato.falliti += r.falliti;
        risultato.scartatiPerStato += r.scartatiPerStato;
        risultato.dettagliFalliti = risultato.dettagliFalliti.concat(r.dettagliFalliti || []);
        if (r.totaleRighe) {
          toast('Import Veneto: ' + Math.min(r.prossimoIndice, r.totaleRighe) + '/' + r.totaleRighe + ' righe elaborate…', 'success');
        }
        if (r.tempoScaduto) return passo(r.prossimoIndice);
        return risultato;
      });
    }
    return passo(0);
  }

    onQuery('#int-rows', 'click', function (e) {

      if (!btn) { chiudiTuttiMenuAzioni_(); return; }
      var row = parseInt(btn.dataset.row, 10);
      var action = btn.dataset.action;
      if (action === 'apri-menu-azioni') { toggleMenuAzioni_(row); return; }
      chiudiTuttiMenuAzioni_();
      // Identifica la riga per numero di riga fisica (sempre univoco), non per id:
      // un intervento inserito a mano direttamente sul foglio potrebbe non avere ancora un ID.
      var obj = state.interventi.filter(function (i) { return i._row === row; })[0];
      if (!obj) return;
      if (action === 'modifica') { openModal('INTERVENTI', obj); return; }
      if (action === 'elimina') {
        if (!window.confirm('Eliminare definitivamente l\'intervento per "' + obj.cliente + '"?')) return;
        callServer('eliminaIntervento', obj.id, obj._row).then(function () { toast('Intervento eliminato.', 'success'); loadInterventi(); caricaDashboard(); })
          .catch(function (err) { toast(err.message || String(err), 'error'); });
        return;
      }
      if (action === 'completa') {
        callServer('segnaCompletato', obj.id, obj._row).then(function () { toast('Intervento segnato come completato.', 'success'); loadInterventi(); caricaDashboard(); })
          .catch(function (err) { toast(err.message || String(err), 'error'); });
        return;
      }
      if (action === 'nota') { apriNotaIntervento(obj); return; }
      if (action === 'vedi-note') { apriListaNote(obj); return; }
      if (action === 'documenti') { apriDocumentiIntervento(obj); return; }
      if (action === 'componi-ricavo') { apriComponiRicavo(obj); return; }
      if (action === 'sospendi') { apriSospendiIntervento(obj); return; }
      if (action === 'annulla') { apriAnnullaIntervento(obj); return; }
      if (action === 'fine-sospensione') {
        if (!window.confirm('Terminare la sospensione dell\'intervento per "' + obj.cliente + '"? Tornerà "Da pianificare".')) return;
        callServer('terminaSospensione', obj.id, obj._row).then(function () { toast('Sospensione terminata: torna "Da pianificare".', 'success'); loadInterventi(); caricaDashboard(); })
          .catch(function (err) { toast(err.message || String(err), 'error'); });
      }
    });
    onQuery('#int-rows', 'click', function (e) {
      if (state.ruolo === 'Cliente') return; // sola visualizzazione, nessun inline edit
      if (e.target.closest('button[data-action]')) return; // gestito dal listener sopra
      var cellaSquadra = e.target.closest('.int-squadra-cell');
      if (cellaSquadra) {
        var rowSq = parseInt(cellaSquadra.dataset.row, 10);
        var objSq = state.interventi.filter(function (i) { return i._row === rowSq; })[0];
        if (objSq) avviaEditSquadraInline_(cellaSquadra, objSq);
        return;
      }
      var cellaDataOra = e.target.closest('.int-dataora-cell');
      if (cellaDataOra) {
        var rowDo = parseInt(cellaDataOra.dataset.row, 10);
        var objDo = state.interventi.filter(function (i) { return i._row === rowDo; })[0];
        if (objDo) avviaEditDataOraInline_(cellaDataOra, objDo);
        return;
      }
      var cellaPriorita = e.target.closest('.int-priorita-cell');
      if (cellaPriorita) {
        var rowPr = parseInt(cellaPriorita.dataset.row, 10);
        var objPr = state.interventi.filter(function (i) { return i._row === rowPr; })[0];
        if (objPr) avviaEditPrioritaInline_(cellaPriorita, objPr);
      }
    });
    on('btn-salva-sospendi', 'click', salvaSospendiIntervento);
    on('btn-salva-nota-intervento', 'click', salvaNotaIntervento);
    on('btn-salva-modifica-orario', 'click', salvaModificaOrarioTappa_);
    on('btn-salva-annulla', 'click', salvaAnnullaIntervento);
    on('btn-carica-documento', 'click', salvaDocumentoUpload_);
    on('componi-ricavo-search', 'input', renderComponiRicavoTabella_);
    on('btn-salva-componi-ricavo', 'click', salvaComponiRicavo);
    onQuery('#componi-ricavo-rows', 'change', function (e) {
      if (e.target.classList.contains('cr-check')) {

    onQuery('#dlg-documenti-lista', 'click', function (e) {
      var btn = e.target.closest('button[data-action="elimina-doc"]');

  /** Legge un file scelto dall'utente e lo invia al server, restituendo l'elenco documenti aggiornato. */
  function leggiEInviaDocumento_(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var base64 = String(reader.result).split(',')[1] || '';
        callServer('caricaDocumentoIntervento', documentiState.id, documentiState.row, file.name, file.type || 'application/octet-stream', base64)
          .then(resolve).catch(reject);
      };
      reader.onerror = function () { reject(new Error('Errore nella lettura del file "' + file.name + '".')); };
      reader.readAsDataURL(file);
    });
  }

  /** Carica in sequenza tutti i file selezionati (anche più di uno): un errore su un file non blocca gli altri. */
  function salvaDocumentoUpload_() {
    var input = document.getElementById('documenti-file-input');
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) { toast('Seleziona almeno un file.', 'error'); return; }
    var btn = document.getElementById('btn-carica-documento');
    var testoOriginale = btn.textContent;
    btn.disabled = true;
    var errori = [];
    var indice = 0;

    function caricaProssimo() {
      if (indice >= files.length) {
        btn.disabled = false;
        btn.textContent = testoOriginale;
        input.value = '';
        if (errori.length) toast(errori.length + ' di ' + files.length + ' file non caricati: ' + errori.join('; '), 'error');
        else toast(files.length > 1 ? 'Tutti i file caricati.' : 'Documento caricato.', 'success');
        return;
      }
      var f = files[indice];
      if (files.length > 1) btn.textContent = 'Carica (' + (indice + 1) + '/' + files.length + ')…';
      leggiEInviaDocumento_(f).then(function (lista) {
        renderListaDocumenti_(lista);
      }).catch(function (err) {
        errori.push(f.name);
      }).then(function () {
        indice++;
        caricaProssimo();
      });
    }
    caricaProssimo();
  }

  /**
   * Chiede prima un'anteprima al server (anteprimaSpostaOrarioTappa): se il nuovo orario si
   * sovrappone ad altre tappe, chiede conferma su come procedere (stesso pattern di
   * riempiBucoGiornoClick) prima di scrivere davvero (spostaOrarioTappa).
   */
  function salvaModificaOrarioTappa_() {
    var nuovaOra = document.getElementById('modifica-orario-input').value;
    if (!nuovaOra) { toast('Indica il nuovo orario di inizio.', 'error'); return; }
    var btn = document.getElementById('btn-salva-modifica-orario');
    btn.disabled = true;
    callServer('anteprimaSpostaOrarioTappa', modificaOrarioState.id, modificaOrarioState.row, nuovaOra).then(function (esito) {
      var risolviAccavallamento = true;
      if (esito.spostamenti.length || esito.accavallamentiNonRisolvibili.length) {
        var messaggio = 'Impostando l\'inizio alle ' + nuovaOra + ', questo intervento si sovrapporrebbe ad altre tappe già pianificate.';
        if (esito.spostamenti.length) {
          var righe = esito.spostamenti.map(function (s) { return '- ' + s.cliente + ': ' + s.oraOriginale + ' → ' + s.oraNuova; });
          messaggio += '\n\nPremi OK per risolvere spostando in avanti le tappe successive:\n' + righe.join('\n') +
            '\n\noppure Annulla per lasciare la sovrapposizione (nessuna tappa verrà spostata).';
        } else {
          messaggio += '\n\nNessuna tappa successiva da spostare per risolverla (il conflitto è con una tappa precedente, vedi sotto): premi OK o Annulla, il risultato non cambia.';
        }
        if (esito.accavallamentiNonRisolvibili.length) {
          messaggio += '\n\n⚠ Si sovrappone anche a intervento/i PRECEDENTI (' +
            esito.accavallamentiNonRisolvibili.map(function (a) { return a.cliente + ' ' + a.oraInizio + '-' + a.oraFine; }).join(', ') +
            '): questa sovrapposizione non si risolve spostando le tappe successive, va corretta a mano se necessario.';
        }
        risolviAccavallamento = window.confirm(messaggio);
      }
      return callServer('spostaOrarioTappa', modificaOrarioState.id, modificaOrarioState.row, nuovaOra, risolviAccavallamento);
    }).then(function () {
      toast('Orario aggiornato.', 'success');
      document.getElementById('dlg-modifica-orario').classList.add('hidden');
      loadInterventi();
      caricaDashboard();
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () { btn.disabled = false; });
  }

  // ---------- Regole ----------

  var GIORNI_ORDINE = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];

  function renderRegole(list) {
    var tbody = document.querySelector('#tabella-regole tbody');
    var categoriaPrecedente = null;
    tbody.innerHTML = list.map(function (r) {
      var rigaSezione = '';
      if (r.categoria && r.categoria !== categoriaPrecedente) {
        rigaSezione = '<tr class="regole-sezione"><td colspan="4">' + escapeHtml(r.categoria) + '</td></tr>';
        categoriaPrecedente = r.categoria;
      }
      var controllo;
      if (r.tipo === 'giorni') {
        var selezionati = splitListClient(r.valore);
        controllo = '<div class="checklist-squadre" data-chiave-giorni="' + escapeHtml(r.chiave) + '">' +
          GIORNI_ORDINE.map(function (g) {
            var checked = selezionati.indexOf(g) !== -1 ? 'checked' : '';
            return '<label><input type="checkbox" value="' + g + '" ' + checked + '>' + g + '</label>';
          }).join('') +
        '</div>';
      } else if (r.tipo === 'percentuale') {
        controllo = '<input type="number" step="1" min="0" max="100" data-chiave="' + escapeHtml(r.chiave) + '" value="' + escapeHtml(r.valore) + '" style="width:70px"> <span style="color:#666;">%</span>';
      } else if (r.tipo === 'testo') {
        controllo = '<input type="text" data-chiave="' + escapeHtml(r.chiave) + '" value="' + escapeHtml(r.valore) + '" style="width:280px">';
      } else if (r.tipo === 'testoLungo') {
        controllo = '<textarea data-chiave="' + escapeHtml(r.chiave) + '" rows="3" style="width:280px;font-family:inherit;">' + escapeHtml(r.valore) + '</textarea>';
      } else {
        controllo = '<input type="number" step="any" data-chiave="' + escapeHtml(r.chiave) + '" value="' + escapeHtml(r.valore) + '" style="width:100px">';
      }
      return rigaSezione + '<tr>' +
        '<td>' + escapeHtml(r.chiave) + '</td>' +
        '<td>' + controllo + '</td>' +
        '<td style="max-width:420px;color:#666;font-size:12.5px;">' + escapeHtml(r.descrizione || '') + '</td>' +
        '<td><button class="btn small secondary" data-action="salva-regola" data-chiave="' + escapeHtml(r.chiave) + '" data-tipo="' + r.tipo + '">Salva</button></td>' +
      '</tr>';
    }).join('');
  }

  // ---------- dialog: pianifica automaticamente un intervallo (multi-squadra) ----------
  function populaSelectSquadra() {
    var sel = document.getElementById('pian-squadra');
    var valorePrecedente = sel.value;
    sel.innerHTML = '';
    state.squadre.filter(function (s) { return s.attiva; }).forEach(function (s) {
      var opt = document.createElement('option'); opt.value = s.id; opt.textContent = s.nome; sel.appendChild(opt);
    });
    if (valorePrecedente && state.squadre.some(function (s) { return s.id === valorePrecedente; })) sel.value = valorePrecedente;

    var checklist = document.getElementById('pian-intervallo-squadre');
    if (checklist) {
      var checkedPrima = idsSquadreIntervalloSelezionate();
      checklist.innerHTML = '';
      state.squadre.filter(function (s) { return s.attiva; }).forEach(function (s) {
        var label = document.createElement('label');
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = s.id;
        cb.checked = checkedPrima.length ? checkedPrima.indexOf(s.id) !== -1 : true;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(s.nome));
        checklist.appendChild(label);
      });
    }
  }

  function idsSquadreIntervalloSelezionate() {
    return Array.prototype.slice.call(document.querySelectorAll('#pian-intervallo-squadre input:checked')).map(function (cb) { return cb.value; });
  }

  function idsSelezionatiCorrenti() {
    return Array.prototype.slice.call(document.querySelectorAll('#tabella-selezione-interventi input[type=checkbox]:checked'))
      .map(function (cb) { return cb.dataset.id; });

  function aggiornaContatoreSelezione() {

  }

  function renderSelezioneInterventi() {
    var tbody = document.querySelector('#tabella-selezione-interventi tbody');
    var tutti = pianState.disponibili.concat(pianState.pianificati).concat(pianState.pianificatiAltrove || []);
    if (!tutti.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-hint">Nessun intervento "Da pianificare" disponibile.</div></td></tr>';
      document.getElementById('pian-selezione-count').textContent = '';
      return;
    }
    var squadra = state.squadre.filter(function (s) { return s.id === pianState.squadraId; })[0];
    var competenzeSquadra = squadra ? splitListClient(squadra.competenze).map(function (c) { return c.toLowerCase(); }) : [];
    var pianificatiIds = pianState.pianificati.map(function (i) { return i.id; });
    tbody.innerHTML = tutti.map(function (i) {
      var giaPianificato = pianificatiIds.indexOf(i.id) !== -1;
      var checked = giaPianificato ? 'checked' : '';
      var tipoInterventoLower = String(i.tipoAttivita || '').trim().toLowerCase();
      var incompatibile = !!(competenzeSquadra.length && !tipoAttivitaGenericoClient_(i.tipoAttivita) && competenzeSquadra.indexOf(tipoInterventoLower) === -1);
      // Un Tipo Attività incompatibile blocca la nuova selezione (rispecchia il vincolo rigido
      // lato server), ma se l'intervento è già pianificato per questa squadra (es. competenze
      // cambiate dopo l'assegnazione) resta comunque deselezionabile.
      var disabled = (incompatibile && !giaPianificato) ? 'disabled' : '';
      var warn = incompatibile
        ? ' <span class="warn-icon" title="Tipo Attività non tra le competenze della squadra">⚠</span>' : '';
      // Selezionare un intervento già pianificato per un'altra squadra/giorno equivale a
      // spostarlo qui: la conferma successiva sovrascrive la sua assegnazione precedente.
      var altrove = i.squadraNomeAttuale
        ? '<span class="badge-altrove" title="Attualmente pianificato altrove">' + escapeHtml(i.squadraNomeAttuale) + ' · ' + escapeHtml(i.dataPianificata) + '</span>'
        : '';
      return '<tr' + (disabled ? ' class="row-disabled"' : '') + '>' +
        '<td><input type="checkbox" data-id="' + i.id + '" ' + checked + ' ' + disabled + '></td>' +
        '<td>' + escapeHtml(i.cliente) + '</td>' +
        '<td>' + escapeHtml(i.indirizzo || '') + '</td>' +
        '<td>' + escapeHtml(i.tipoAttivita ? etichettaTipoAttivita_(i.tipoAttivita) : '-') + warn + '</td>' +
        '<td><span class="badge ' + i.priorita + '">' + i.priorita + '</span></td>' +
        '<td>' + (i.durataMinuti || '') + ' min</td>' +
        '<td>' + (i.finestraInizio || '') + ' - ' + (i.finestraFine || '') + '</td>' +
        '<td>' + altrove + '</td>' +
      '</tr>';
    }).join('');
    aggiornaContatoreSelezione();
    aggiornaMarkerMappaSelezione_();
  }

  // ---------- mappa di selezione interventi (dialog "Seleziona da elenco", giorno singolo) ----------
  var mappaSelezioneInstance = null;
  var mappaSelezioneMarkers = [];

  function toggleMappaSelezione() {
    var wrap = document.getElementById('pian-selezione-mappa-wrap');
    var btn = document.getElementById('btn-toggle-mappa-selezione');
    var apri = wrap.classList.contains('hidden');
    if (!apri) {
      wrap.classList.add('hidden');
      btn.textContent = '🗺️ Mostra mappa';
      return;
    }
    btn.disabled = true; btn.textContent = 'Caricamento mappa…';
    caricaLeaflet_().then(function () {
      wrap.classList.remove('hidden');
      btn.disabled = false; btn.textContent = '🗺️ Nascondi mappa';
      if (!mappaSelezioneInstance) {
        mappaSelezioneInstance = L.map('pian-selezione-mappa');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(mappaSelezioneInstance);
        // Il contenuto del popup viene rigenerato ad ogni ridisegno dei marker: l'handler del
        // bottone "Inserisci/Rimuovi" si aggancia una volta sola qui, all'apertura del popup,
        // invece che sul marker (che viene ricreato ad ogni sincronizzazione).
        mappaSelezioneInstance.on('popupopen', function (e) {
          var el = e.popup.getElement();
          var btnToggle = el && el.querySelector('[data-toggle-id]');
          if (!btnToggle) return;
          btnToggle.addEventListener('click', function () {
            var id = btnToggle.dataset.toggleId;
            var cb = document.querySelector('#tabella-selezione-interventi input[data-id="' + CSS.escape(id) + '"]');
            if (!cb || cb.disabled) { toast('Questo intervento non è selezionabile per questa squadra.', 'error'); return; }
            cb.checked = !cb.checked;
            cb.dispatchEvent(new Event('change', { bubbles: true }));
            mappaSelezioneInstance.closePopup();
          });
        });
      }
      aggiornaMarkerMappaSelezione_();
      setTimeout(function () { if (mappaSelezioneInstance) mappaSelezioneInstance.invalidateSize(); }, 60);
    }).catch(function () {
      btn.disabled = false; btn.textContent = '🗺️ Mostra mappa';
      toast('Impossibile caricare la mappa (verifica la connessione a internet o la rete/proxy in uso).', 'error');
    });
  }

  /** Ridisegna i marker della mappa di selezione in base allo stato corrente (selezionato/disponibile/incompatibile/pianificato altrove): chiamata ogni volta che la selezione o l'elenco cambiano, così mappa e tabella restano sempre sincronizzate. Non fa nulla se la mappa non è ancora stata aperta. */
  function aggiornaMarkerMappaSelezione_() {
    if (!mappaSelezioneInstance) return;
    mappaSelezioneMarkers.forEach(function (m) { mappaSelezioneInstance.removeLayer(m); });
    mappaSelezioneMarkers = [];

    // Include anche gli interventi già pianificati per un'altra squadra/giorno: selezionarli
    // dalla mappa equivale a spostarli qui (la conferma successiva sovrascrive l'assegnazione
    // precedente), utile per rimediare a testa a testa/errori di pianificazione manualmente.
    var tutti = pianState.disponibili.concat(pianState.pianificati).concat(pianState.pianificatiAltrove || []);
    var puntiValidi = tutti.filter(function (i) { return isNumClient(i.lat) && isNumClient(i.lng); });
    if (!puntiValidi.length) return;

    var squadra = state.squadre.filter(function (s) { return s.id === pianState.squadraId; })[0];
    var competenzeSquadra = squadra ? splitListClient(squadra.competenze).map(function (c) { return c.toLowerCase(); }) : [];
    var selezionatiIds = idsSelezionatiCorrenti();

    puntiValidi.forEach(function (i) {
      var tipoInterventoLower = String(i.tipoAttivita || '').trim().toLowerCase();
      var incompatibile = !!(competenzeSquadra.length && !tipoAttivitaGenericoClient_(i.tipoAttivita) && competenzeSquadra.indexOf(tipoInterventoLower) === -1);
      var selezionato = selezionatiIds.indexOf(i.id) !== -1;
      var altrove = !!i.squadraNomeAttuale;
      var classe = incompatibile ? 'incompatibile' : (selezionato ? 'selezionato' : (altrove ? 'altrove' : 'disponibile'));
      var icon = L.divIcon({ className: '', html: '<div class="marker-selezione ' + classe + '"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
      var testoBottone = selezionato
        ? (altrove ? 'Annulla spostamento' : 'Rimuovi dalla selezione')
        : (altrove ? 'Sposta qui' : 'Inserisci in planner');
      var popupHtml = '<div class="popup-selezione">' +
        '<strong>' + escapeHtml(i.cliente) + '</strong><br>' +
        escapeHtml(i.indirizzo || '') + '<br>' +
        (i.tipoAttivita ? 'Tipo attività: ' + escapeHtml(etichettaTipoAttivita_(i.tipoAttivita)) + '<br>' : '') +
        'Priorità: ' + escapeHtml(i.priorita || '') + ' · ' + (i.durataMinuti || '') + ' min<br>' +
        ((i.finestraInizio || i.finestraFine) ? 'Finestra: ' + (i.finestraInizio || '') + '-' + (i.finestraFine || '') + '<br>' : '') +
        (altrove ? '<span class="popup-altrove">📍 Attualmente pianificato per ' + escapeHtml(i.squadraNomeAttuale) + ' il ' + escapeHtml(i.dataPianificata) + '</span><br>' : '') +
        (incompatibile
          ? '<span class="popup-warn">⚠ Tipo Attività non compatibile con questa squadra</span>'
          : '<button type="button" class="btn small' + (selezionato ? ' secondary' : '') + '" data-toggle-id="' + i.id + '">' + testoBottone + '</button>') +
        '</div>';
      var marker = L.marker([i.lat, i.lng], { icon: icon }).addTo(mappaSelezioneInstance).bindPopup(popupHtml);
      mappaSelezioneMarkers.push(marker);
    });

    var bounds = puntiValidi.map(function (i) { return [i.lat, i.lng]; });
    mappaSelezioneInstance.fitBounds(bounds, { padding: [30, 30] });
  }

  function totaleTappeIntervallo(risultato) {
    return risultato.giorni.reduce(function (sum, g) {
      return sum + g.squadre.reduce(function (s2, sq) { return s2 + sq.tappe.length; }, 0);
    }, 0);
  }

  function renderIntervalloResult(risultato) {
    var totaleTappe = totaleTappeIntervallo(risultato);
    var summary = document.getElementById('pian-intervallo-summary');
    summary.style.display = 'flex';
    summary.innerHTML =
      '<div class="summary-card ok"><div class="num">' + totaleTappe + '</div><div class="lbl">Tappe pianificate</div></div>' +
      '<div class="summary-card"><div class="num">' + risultato.giorni.length + '</div><div class="lbl">Giorni con almeno un percorso</div></div>' +
      '<div class="summary-card warn"><div class="num">' + risultato.nonIncluse.length + '</div><div class="lbl">Non incluse</div></div>';

    var nonInclEl = document.getElementById('pian-intervallo-nonincluse');
    nonInclEl.innerHTML = risultato.nonIncluse.length ? risultato.nonIncluse.map(function (n) {
      return '<div class="np-item"><div><strong>' + escapeHtml(n.cliente) + '</strong><div class="motivo">' + escapeHtml(n.motivo) + '</div></div></div>';
    }).join('') : '';

    var boardEl = document.getElementById('pian-intervallo-board');
    if (!risultato.giorni.length) {
      boardEl.innerHTML = '<div class="empty-hint">Nessun percorso generato nell\'intervallo selezionato.</div>';
      return;
    }
    boardEl.innerHTML = risultato.giorni.map(function (g) {
      var teamsHtml = g.squadre.map(function (sq) {
        // Una squadra senza tappe in questo giorno viene mostrata esplicitamente come "libera"
        // invece di sparire semplicemente dal riepilogo (non tutte le squadre devono per forza
        // essere impegnate ogni giorno: se gli interventi disponibili bastano per una sola
        // squadra, l'altra resta libera e va indicato chiaramente, non lasciato ambiguo).
        var stopsHtml = sq.libera || !sq.tappe.length
          ? '<div class="stop libera"><em>Giornata libera — ' + escapeHtml(sq.motivoLibera || 'nessun intervento compatibile da assegnare') + '.</em></div>'
          : sq.tappe.map(function (t) {
            return '<div class="stop"><span class="ora">' + t.oraInizio + '-' + t.oraFine + '</span> <span class="cliente">' + escapeHtml(t.cliente) + '</span>' +
              '<div class="meta">' + escapeHtml(t.indirizzo || '') + ' · ' + t.durataMinuti + ' min</div></div>';
          }).join('');
        return '<div class="board-team"><div class="team-head"><span class="team-dot" style="background:' + (sq.colore || '#999') + '"></span>' + escapeHtml(sq.squadraNome) + '</div>' +
          formattaProduzioneClient(sq.produzioneTotale, sq.produzioneTarget) + stopsHtml + '</div>';
      }).join('');
      return '<div class="board-day"><div class="day-title">' + g.giorno + '</div><div class="board-teams">' + teamsHtml + '</div></div>';
    }).join('');
  }

  function pianificaIntervalloClick() {
    var squadraIds = idsSquadreIntervalloSelezionate();
    if (!squadraIds.length) { toast('Seleziona almeno una squadra.', 'error'); return; }
    var dal = document.getElementById('pian-intervallo-dal').value;
    var al = document.getElementById('pian-intervallo-al').value;
    if (!dal || !al) { toast('Seleziona l\'intervallo di date.', 'error'); return; }
    var nomiSquadre = squadraIds.map(function (id) {
      var s = state.squadre.filter(function (x) { return x.id === id; })[0];
      return s ? s.nome : id;
    }).join(', ');
    if (!window.confirm('Pianificare automaticamente tutti gli interventi disponibili per: ' + nomiSquadre +
      ', tra il ' + fromInputDate(dal) + ' e il ' + fromInputDate(al) + '? Verranno scritti subito sul foglio.')) return;
    var btn = document.getElementById('btn-pianifica-intervallo');
    btn.disabled = true; btn.textContent = 'Calcolo in corso…';
    mostraCaricamento('pian-intervallo-board');
    callServer('pianificaIntervallo', squadraIds, fromInputDate(dal), fromInputDate(al)).then(function (risultato) {
      renderIntervalloResult(risultato);
      var totaleTappe = totaleTappeIntervallo(risultato);
      toast('Intervallo pianificato: ' + totaleTappe + ' tappe su ' + risultato.giorni.length + ' giorni.', 'success');
      caricaDashboard();
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () {
      btn.disabled = false; btn.textContent = '📅 Pianifica intervallo';
      nascondiCaricamento('pian-intervallo-board');
    });
  }

  // ---------- dialog: seleziona da elenco (selezione manuale + ottimizzazione, una squadra/giorno) ----------
  function caricaContesto() {
    var squadraId = document.getElementById('pian-squadra').value;
    var giornoInput = document.getElementById('pian-giorno').value;
    if (!squadraId) { toast('Seleziona una squadra.', 'error'); return; }
    if (!giornoInput) { toast('Seleziona un giorno.', 'error'); return; }
    var giornoStr = fromInputDate(giornoInput);
    pianState.squadraId = squadraId;
    pianState.giorno = giornoStr;
    mostraCaricamento('pian-selezione-corpo');
    return callServer('getContestoPianificazione', squadraId, giornoStr).then(function (ctx) {
      pianState.disponibili = ctx.disponibili;
      pianState.pianificati = ctx.pianificati;
      pianState.pianificatiAltrove = ctx.pianificatiAltrove || [];
      renderSelezioneInterventi();
      if (ctx.pianificati.length > 0) {
        pianState.ordineCorrente = ctx.pianificati.map(function (i) { return i.id; });
        return ricalcolaConOrdineCorrente();
      } else {
        pianState.ordineCorrente = [];
        pianState.anteprima = null;
        document.getElementById('pian-anteprima-card').style.display = 'none';
      }
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () {
      nascondiCaricamento('pian-selezione-corpo');
    });
  }

  /**
   * Chiama anteprimaPercorso e, se il risultato esclude qualche tappa perché supera il tempo di
   * viaggio massimo impostato in Regole, chiede all'utente se pianificarla comunque (ignorando il
   * limite per questo percorso) o annullare (rispettando il limite, resta "Non inclusa" come al
   * solito) — invece di lasciare che la tappa sparisca in silenzio nell'elenco "Non incluse".
   * Ricorda la scelta in pianState.ignoraTettoViaggio: "Conferma e salva percorso" la userà per
   * ricalcolare allo stesso modo, così un intervento approvato in anteprima non sparisce di nuovo
   * silenziosamente al salvataggio.
   */
  function chiamaAnteprimaConAvvisoTetto_(squadraId, giornoStr, interventoIds, ordineManuale) {
    pianState.ignoraTettoViaggio = false;
    return callServer('anteprimaPercorso', squadraId, giornoStr, interventoIds, ordineManuale).then(function (anteprima) {
      var esclusiPerTetto = anteprima.nonIncluse.filter(function (n) { return n.codice === 'TETTO_VIAGGIO'; });
      if (!esclusiPerTetto.length) return anteprima;
      var nomi = esclusiPerTetto.map(function (n) { return n.cliente; }).join(', ');
      var messaggio = (esclusiPerTetto.length === 1
        ? 'L\'intervento "' + nomi + '" supera'
        : esclusiPerTetto.length + ' interventi (' + nomi + ') superano') +
        ' il tempo massimo di viaggio tra le tappe impostato in Regole.\n\n' +
        'Premi OK per pianificarlo/i ugualmente (ignorando il limite per questo percorso), oppure Annulla per rispettare il limite (resta/restano "Non incluse").';
      if (!window.confirm(messaggio)) return anteprima;
      pianState.ignoraTettoViaggio = true;
      return callServer('anteprimaPercorso', squadraId, giornoStr, interventoIds, ordineManuale, true);
    });
  }

  function ottimizzaPercorso() {
    var ids = idsSelezionatiCorrenti();
    if (!ids.length) { toast('Seleziona almeno un intervento.', 'error'); return; }
    var btn = document.getElementById('btn-ottimizza-percorso');
    btn.disabled = true; btn.textContent = 'Calcolo in corso…';
    mostraCaricamento('pian-anteprima-card');
    chiamaAnteprimaConAvvisoTetto_(pianState.squadraId, pianState.giorno, ids).then(function (anteprima) {
      pianState.anteprima = anteprima;
      pianState.ordineCorrente = anteprima.tappe.map(function (t) { return t.interventoId; });
      renderAnteprima(anteprima);
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () {
      btn.disabled = false; btn.textContent = '🧭 Ottimizza percorso';
      nascondiCaricamento('pian-anteprima-card');
    });
  }

  function ricalcolaConOrdineCorrente() {
    if (!pianState.ordineCorrente.length) {
      pianState.anteprima = null;
      document.getElementById('pian-anteprima-card').style.display = 'none';
      return Promise.resolve();
    }
    mostraCaricamento('pian-anteprima-card');
    return chiamaAnteprimaConAvvisoTetto_(pianState.squadraId, pianState.giorno, pianState.ordineCorrente, pianState.ordineCorrente).then(function (anteprima) {
      pianState.anteprima = anteprima;
      pianState.ordineCorrente = anteprima.tappe.map(function (t) { return t.interventoId; });
      renderAnteprima(anteprima);
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () {
      nascondiCaricamento('pian-anteprima-card');
    });
  }

  function renderAnteprima(anteprima) {
    document.getElementById('pian-anteprima-card').style.display = 'block';
    var summary = document.getElementById('pian-anteprima-summary');
    summary.innerHTML =
      '<div class="summary-card ok"><div class="num">' + anteprima.tappe.length + '</div><div class="lbl">Tappe pianificate</div></div>' +
      '<div class="summary-card warn"><div class="num">' + anteprima.nonIncluse.length + '</div><div class="lbl">Non incluse</div></div>' +
      '<div class="summary-card"><div class="num" style="font-size:16px;">' + (anteprima.distanzaTotaleKm || 0) + ' km</div><div class="lbl">Distanza totale</div></div>' +
      '<div class="summary-card"><div class="num" style="font-size:16px;">' + Math.round(anteprima.tempoViaggioTotaleMinuti || 0) + ' min</div><div class="lbl">Tempo di viaggio</div></div>' +
      (anteprima.produzioneTarget ? '<div class="summary-card' + ((anteprima.produzioneTotale || 0) >= anteprima.produzioneTarget ? ' ok' : '') + '"><div class="num" style="font-size:16px;">' +
        formatEuroClient(anteprima.produzioneTotale) + ' / ' + formatEuroClient(anteprima.produzioneTarget) + '</div><div class="lbl">Produzione / Target</div></div>' : '');

    var nonInclEl = document.getElementById('pian-anteprima-nonincluse');
    nonInclEl.innerHTML = anteprima.nonIncluse.length ? anteprima.nonIncluse.map(function (n) {
      return '<div class="np-item"><div><strong>' + escapeHtml(n.cliente) + '</strong><div class="motivo">' + escapeHtml(n.motivo) + '</div></div></div>';
    }).join('') : '';

    var tappeEl = document.getElementById('pian-anteprima-tappe');
    var html = '';
    if (anteprima.partenzaStimata) {
      html += '<div class="route-endpoint">🚗 Partenza stimata: <strong>' + anteprima.partenzaStimata.orario + '</strong> (' +
        Math.round(anteprima.partenzaStimata.viaggioMinuti) + ' min' + (anteprima.partenzaStimata.stimato ? ' stimati' : '') + ' per arrivare in tempo alla prima tappa)</div>';
    }
    anteprima.tappe.forEach(function (t, idx) {
      html += '<div class="route-stop" data-id="' + t.interventoId + '">' +
        '<div class="route-stop-order">' + (idx + 1) + '</div>' +
        '<div class="route-stop-body">' +
          '<div class="route-stop-time">' + t.oraInizio + ' - ' + t.oraFine + '</div>' +
          '<div class="route-stop-client">' + escapeHtml(t.cliente) + ' <span class="badge ' + t.priorita + '">' + t.priorita + '</span></div>' +
          '<div class="route-stop-meta">' + escapeHtml(t.indirizzo || '') + ' · ' + t.durataMinuti + ' min' +
            (idx > 0 ? ' · viaggio ' + Math.round(t.viaggioMinuti) + ' min (' + t.distanzaKm + ' km)' + (t.stimato ? ' stimato' : '') : '') +
          '</div>' +
        '</div>' +
        '<div class="route-stop-actions">' +
          '<button data-action="su" ' + (idx === 0 ? 'disabled' : '') + ' title="Sposta su">▲</button>' +
          '<button data-action="giu" ' + (idx === anteprima.tappe.length - 1 ? 'disabled' : '') + ' title="Sposta giù">▼</button>' +
          '<button data-action="rimuovi" title="Rimuovi dal percorso">✕</button>' +
        '</div>' +
      '</div>';
    });
    if (anteprima.rientroStimato) {
      html += '<div class="route-endpoint">🏠 Rientro stimato: <strong>' + anteprima.rientroStimato.orario + '</strong> (' +
        Math.round(anteprima.rientroStimato.viaggioMinuti) + ' min' + (anteprima.rientroStimato.stimato ? ' stimati' : '') + ', ' + anteprima.rientroStimato.distanzaKm + ' km)</div>';
    }
    tappeEl.innerHTML = html || '<div class="empty-hint">Nessuna tappa pianificabile con la selezione corrente.</div>';
  }

  function confermaPercorsoClick() {
    if (!pianState.ordineCorrente.length) { toast('Nessuna tappa da confermare.', 'error'); return; }
    var btn = document.getElementById('btn-conferma-percorso');
    btn.disabled = true;
    mostraCaricamento('pian-anteprima-card');
    callServer('confermaPercorso', pianState.squadraId, pianState.giorno, pianState.ordineCorrente, pianState.ignoraTettoViaggio).then(function (anteprima) {
      toast('Percorso confermato: ' + anteprima.tappe.length + ' tappe salvate.', 'success');
      pianState.anteprima = anteprima;
      pianState.ordineCorrente = anteprima.tappe.map(function (t) { return t.interventoId; });
      renderAnteprima(anteprima);
      caricaDashboard();
      caricaContesto();
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () {
      btn.disabled = false;
      nascondiCaricamento('pian-anteprima-card');
    });
  }

  /** Apre il dialog "Seleziona da elenco" per una squadra/giorno specifici, richiamato dalla Dashboard. Il giorno resta modificabile nel dialog stesso (campo "Giorno" in alto). */
  function apriSelezioneDaElenco(squadraId, giornoStr) {
    var squadra = state.squadre.filter(function (s) { return s.id === squadraId; })[0];
    var selSquadra = document.getElementById('pian-squadra');
    selSquadra.value = squadraId;
    var giornoDate = parseDateStrClient(giornoStr);
    document.getElementById('pian-giorno').value = giornoDate ? toInputDate(giornoDate) : '';
    document.getElementById('dlg-selezione-titolo').textContent = 'Seleziona da elenco — ' + (squadra ? squadra.nome : squadraId);
    // riparte sempre con la lista visibile, indipendentemente da come era stata lasciata l'ultima volta
    document.getElementById('pian-selezione-corpo').classList.remove('hidden');
    document.getElementById('btn-toggle-lista-selezione').textContent = '▲ Nascondi lista';
    document.getElementById('dlg-selezione').classList.remove('hidden');
    caricaContesto();
  }

  function toggleListaSelezione() {
    var corpo = document.getElementById('pian-selezione-corpo');
    var btn = document.getElementById('btn-toggle-lista-selezione');
    var nascosta = corpo.classList.toggle('hidden');
    btn.textContent = nascosta ? '▼ Mostra lista' : '▲ Nascondi lista';
  }

  function setupDialogIntervalloESelezione() {
    on('btn-ottimizza-percorso', 'click', ottimizzaPercorso);
    on('btn-conferma-percorso', 'click', confermaPercorsoClick);
    on('btn-pianifica-intervallo', 'click', pianificaIntervalloClick);
    var elDal = document.getElementById('pian-intervallo-dal');
    var elAl = document.getElementById('pian-intervallo-al');
    var oggi = new Date();
    var fra6 = new Date(oggi.getTime() + 6 * 24 * 3600 * 1000);
    if (elDal) elDal.value = toInputDate(oggi);
    if (elAl) elAl.value = toInputDate(fra6);

    // Cambiare il giorno dentro il dialog "Seleziona da elenco" ricarica subito il contesto
    // (interventi disponibili/pianificati) per la squadra corrente su quella nuova data.
    on('pian-giorno', 'change', function () {
      if (!document.getElementById('dlg-selezione').classList.contains('hidden')) caricaContesto();
    });

    var tbodySelezione = document.querySelector('#tabella-selezione-interventi tbody');
    if (tbodySelezione) {
      tbodySelezione.addEventListener('change', function (e) {
        if (e.target.matches('input[type=checkbox]')) {
          aggiornaContatoreSelezione();
          aggiornaMarkerMappaSelezione_();
        }
      });
    }
    on('btn-toggle-mappa-selezione', 'click', toggleMappaSelezione);
    on('btn-toggle-lista-selezione', 'click', toggleListaSelezione);

    on('pian-anteprima-tappe', 'click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var stopEl = btn.closest('.route-stop');

    if (motivi.every(function (m) { return m === 'ferie'; })) return '🏖️ La squadra è in ferie/assente per l\'intero periodo selezionato.';
    if (motivi.every(function (m) { return m === 'riposo'; })) return '📅 La squadra non lavora in nessuno dei giorni del periodo selezionato (riposo settimanale).';
    return '🏖️ La squadra non è disponibile per l\'intero periodo selezionato (ferie e/o giorni di riposo settimanale).';
  }

  function aggregatoSquadraDash_(squadra, giorniRange) {
    var giorniConDati = [], produzione = 0, km = 0, interventi = 0;
    giorniRange.forEach(function (gInput) {
      var tappe = datiSquadraGiorno_(squadra.id, gInput);
      if (tappe.length) {
        giorniConDati.push(gInput);
        tappe.forEach(function (t) { produzione += (t.ricavo || 0); interventi++; });
        km += kmGiornoSquadra_(squadra, tappe);
      }
    });
    // Target e rapporto "giorni programmati/giorni totali": contano solo i giorni effettivamente
    // lavorabili per QUESTA squadra (esclusi giorni non lavorativi da Regole, riposo settimanale
    // della squadra, ferie/assenza) — vedi squadraLavorabileGiornoClient_. Produzione/km/interventi
    // restano invece calcolati su TUTTI i giorni con dati reali (anche un intervento forzato a
    // mano in un giorno nominalmente non lavorabile deve comunque contare per intero).
    var giorniLavorabili = giorniRange.filter(function (g) { return squadraLavorabileGiornoClient_(squadra, g); });
    var giorniConDatiLavorabili = giorniConDati.filter(function (g) { return giorniLavorabili.indexOf(g) !== -1; });
    return {
      giorniRange: giorniRange, giorniConDati: giorniConDati,
      giorniLavorabili: giorniLavorabili, giorniConDatiLavorabili: giorniConDatiLavorabili,
      produzione: produzione,
      produzioneTarget: (squadra.produzioneTarget || 0) * giorniLavorabili.length,
      km: Math.round(km), interventi: interventi, multiGiorno: giorniRange.length > 1
    };
  }

  function caricaDashboard() {
    // Cliente e Squadra non vedono la Dashboard (né le funzioni di pianificazione sottostanti,
    // bloccate anche lato server): niente da ricaricare qui, i chiamanti esistenti proseguono
    // comunque la loro catena .then()/.catch() invariati.
    if (state.ruolo === 'Cliente' || state.ruolo === 'Squadra') return Promise.resolve();
    var dal = getDashDal(), al = getDashAl();
    if (!dal || !al) {
      // Difensivo: se le date non sono ancora valorizzate (es. setupDashboardTab non è ancora
      // passato di qui) non deve restare acceso lo spinner mostrato da chi ha chiamato questa
      // funzione aspettandosi che si spenga da sé.
      nascondiCaricamento('dash-team-list', 'dash-detail');
      return Promise.resolve();
    }
    if (al < dal) { document.getElementById('dash-al').value = dal; al = dal; }
    var giorniRange = dateRangeArrayClient(dal, al);
    var hint = document.getElementById('dash-range-hint');
    if (hint) hint.textContent = giorniRange.length === 1 ? 'Un solo giorno selezionato' : giorniRange.length + ' giorni selezionati';
    mostraCaricamento('dash-team-list', 'dash-detail');
    __dbg('caricaDashboard: start', 'dal=' + dal, 'al=' + al);
    __dbgSnapshot('caricaDashboard: pre-fetch');
    return callServer('getProgrammazione', fromInputDate(dal), fromInputDate(al)).then(function (righe) {
      __dbg('caricaDashboard: getProgrammazione risolto', righe.length + ' righe');
      dashState.dal = dal; dashState.al = al; dashState.righe = righe;
      if (!dashState.selezionata || !state.squadre.some(function (s) { return s.id === dashState.selezionata && s.attiva; })) {
        var primaAttiva = state.squadre.filter(function (s) { return s.attiva; })[0];
        dashState.selezionata = primaAttiva ? primaAttiva.id : null;
      }
      try { renderDashTeamList(); __dbg('renderDashTeamList OK'); } catch (e) { __dbg('renderDashTeamList ERRORE', e.message, e.stack); throw e; }
      __dbgSnapshot('dopo renderDashTeamList');
      try { renderDashDetail(); __dbg('renderDashDetail OK'); } catch (e) { __dbg('renderDashDetail ERRORE', e.message, e.stack); throw e; }
      __dbgSnapshot('dopo renderDashDetail');
      // In vista "Per stato"/"Per tipologia" la mappa mostra tutti gli interventi indipendentemente
      // dal Dal/Al: la ricarica qui tiene quella vista aggiornata dopo un'azione (conferma
      // percorso, riempi buchi, ecc.) senza dover disattivarla e riattivarla a mano.
      return (dashState.mapMode === 'stato' || dashState.mapMode === 'tipologia') ? loadInterventi().then(renderDashMap) : renderDashMap();
    }).catch(function (err) {
      __dbg('caricaDashboard ERRORE', err && (err.message || err), err && err.stack);
      toast('Errore nel caricamento della dashboard: ' + (err.message || err), 'error');
    }).finally(function () {
      nascondiCaricamento('dash-team-list', 'dash-detail');
      __dbgSnapshot('caricaDashboard: finally');
    });
  }

  function renderDashTeamList() {
    var el = document.getElementById('dash-team-list');

      var okTarget = agg.produzione >= agg.produzioneTarget;
      var etichettaVuota = agg.multiGiorno ? 'Nessun intervento pianificato nel periodo' : 'Nessun intervento pianificato oggi';
      return '<div class="dash-team-card' + (sq.id === dashState.selezionata ? ' selected' : '') + '" data-squadra="' + sq.id + '">' +

        (pianificato ? (
          (agg.produzioneTarget ? '<div class="dash-team-produzione-row"><span>Produzione</span><strong>' + formatEuroClient(agg.produzione) + ' / ' + formatEuroClient(agg.produzioneTarget) + '</strong></div>' +
            '<div class="dash-progress-track"><div class="dash-progress-fill ' + (okTarget ? 'good' : '') + '" style="width:' + pct + '%"></div></div>' : '') +
          '<div class="dash-team-meta-row"><span>📍 ' + agg.km + ' km</span><span>' + agg.interventi + ' interventi' + (agg.multiGiorno && agg.giorniLavorabili.length ? (' · ' + agg.giorniConDatiLavorabili.length + '/' + agg.giorniLavorabili.length + ' giorni') : '') + '</span></div>'
        ) : '<div class="dash-team-meta-row" style="margin-top:2px;">' + etichettaVuota + '</div>')
        + '</div>';
    }).join('');

  /** Un intervento sospeso o annullato non compare in NESSUNA vista mappa "tutti gli interventi": non è più un lavoro attivo da mostrare sul territorio. */
  function interventoVisibileInMappa_(i) {

  function renderDashMap() {
    __dbg('renderDashMap: chiamata', 'dashMapInstance esistente=' + !!dashMapInstance);
    return caricaLeaflet_().then(function () {
      __dbg('renderDashMap: leaflet pronto'); __dbgSnapshot('renderDashMap: pre-creazione mappa');
      if (!dashMapInstance) {
        dashMapInstance = L.map('dash-map').setView([45.46, 9.19], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        }).addTo(dashMapInstance);

      setTimeout(function () {
        if (dashMapInstance) dashMapInstance.invalidateSize();

  /** Vista "Percorsi": i percorsi già pianificati nell'intervallo Dal/Al selezionato, squadra per squadra. */
  function renderDashMapPercorsi_() {
    var giorniRange = dateRangeArrayClient(dashState.dal, dashState.al);
    var multiGiorno = giorniRange.length > 1;
    var tuttiPunti = [];
    state.squadre.filter(function (s) { return s.attiva; }).forEach(function (sq) {
      if (!isNumClient(sq.latPartenza) || !isNumClient(sq.lngPartenza)) return;
      var attenuata = sq.id !== dashState.selezionata;
      giorniRange.forEach(function (gInput) {
        var tappe = datiSquadraGiorno_(sq.id, gInput).filter(function (t) { return isNumClient(t.lat) && isNumClient(t.lng); });
        if (!tappe.length) return;
        var partenza = [sq.latPartenza, sq.lngPartenza];
        var rientro = isNumClient(sq.latRientro) ? [sq.latRientro, sq.lngRientro] : partenza;
        var punti = [partenza].concat(tappe.map(function (t) { return [t.lat, t.lng]; })).concat([rientro]);
        L.polyline(punti, { color: sq.colore || '#999', weight: attenuata ? 2 : 4, opacity: attenuata ? .3 : .9 }).addTo(dashLayerGroup);
        tappe.forEach(function (t, idx) {
          var icon = L.divIcon({
            className: '',
            html: '<div style="background:' + (sq.colore || '#999') + ';opacity:' + (attenuata ? 0.35 : 1) + ';color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.35);">' + (idx + 1) + '</div>',
            iconSize: [22, 22], iconAnchor: [11, 11]
          });
          L.marker([t.lat, t.lng], { icon: icon }).addTo(dashLayerGroup)
            .bindPopup('<b>' + escapeHtml(t.cliente) + '</b><br>' + escapeHtml(t.indirizzo || '') + (multiGiorno ? '<br><small>' + giornoLabelBreveClient(gInput) + '</small>' : ''));
          tuttiPunti.push([t.lat, t.lng]);
        });
      });
    });
    if (tuttiPunti.length) dashMapInstance.fitBounds(tuttiPunti, { padding: [30, 30] });
  }

  /** Vista "Per stato": ogni intervento geocodificato ATTIVO (indipendentemente dal Dal/Al scelto), colorato per stato — sospesi e annullati non sono lavoro attivo sul territorio, non compaiono. */
  function renderDashMapStato_() {
    var tuttiPunti = [];
    (state.interventi || []).forEach(function (i) {
      if (!isNumClient(i.lat) || !isNumClient(i.lng) || !interventoVisibileInMappa_(i)) return;
      var colore = COLORE_STATO_MAPPA_[i.stato] || '#999';

        (squadra ? '<br>Squadra: ' + escapeHtml(squadra.nome) + (i.dataPianificata ? ' — ' + escapeHtml(i.dataPianificata) + (i.oraPianificata ? ' ' + escapeHtml(i.oraPianificata) : '') : '') : '');
      L.marker([i.lat, i.lng], { icon: icon }).addTo(dashLayerGroup).bindPopup(popup);

  /** Vista "Per tipologia": stessi interventi attivi di renderDashMapStato_, colorati per Tipo Attività invece che per stato. */
  function renderDashMapTipologia_() {
