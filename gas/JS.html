<script>
(function () {
  'use strict';

  var state = { schema: {}, squadre: [], utente: '' };
  var modalState = { schemaKey: null, editObj: null };
  var pianState = { squadraId: null, giorno: null, disponibili: [], pianificati: [], pianificatiAltrove: [], ordineCorrente: [], anteprima: null, ignoraTettoViaggio: false };

  var SAVE_FN = { SQUADRE: 'salvaSquadra', INTERVENTI: 'salvaIntervento' };
  var DELETE_FN = { SQUADRE: 'eliminaSquadra', INTERVENTI: 'eliminaIntervento' };

  // ---------- utilità ----------
  /** Collega un listener solo se l'elemento esiste: un ID mancante (file HTML disallineato) non blocca il resto. */
  function on(id, event, handler) {
    var el = document.getElementById(id);
    if (el) { el.addEventListener(event, handler); return true; }
    console.warn('Elemento mancante nel DOM: #' + id + ' (controlla che Index.html sia aggiornato)');
    return false;
  }

  /** Come on(), ma per selettori CSS generici (es. 'tbody' dentro una tabella). */
  function onQuery(selector, event, handler) {
    var el = document.querySelector(selector);
    if (el) { el.addEventListener(event, handler); return true; }
    console.warn('Elemento mancante nel DOM: ' + selector + ' (controlla che Index.html sia aggiornato)');
    return false;
  }

  function escapeHtml(str) {
    return String(str === null || str === undefined ? '' : str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function splitListClient(str) {
    return String(str || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function isNumClient(v) {
    return typeof v === 'number' && !isNaN(v);
  }

  function formatEuroClient(v) {
    return (Math.round((v || 0) * 100) / 100).toLocaleString('it-IT') + '€';
  }

  /** Riepilogo "Produzione: X€ / target Y€" — omesso del tutto se la squadra non ha un target impostato. */
  function formattaProduzioneClient(totale, target) {
    if (!target) return '';
    var raggiunto = (totale || 0) >= target;
    return '<div class="produzione-indicatore' + (raggiunto ? ' ok' : '') + '">Produzione: ' +
      formatEuroClient(totale) + ' / ' + formatEuroClient(target) + '</div>';
  }

  // ---------- anteprima mappa (verifica visiva della geocodifica di un indirizzo) ----------
  function mapEmbedUrlPerQuery(query) {
    return 'https://www.google.com/maps?q=' + encodeURIComponent(query) + '&output=embed';
  }
  function mapEmbedUrlPerCoord(lat, lng) {
    return 'https://www.google.com/maps?q=' + lat + ',' + lng + '&output=embed';
  }

  /** Aggiunge, sotto un campo indirizzo del form, un toggle "Mostra mappa" con anteprima espandibile
   *  (ridimensionabile trascinando l'angolo in basso a destra). Se il record ha già coordinate salvate
   *  le mostra come posizione precisa; altrimenti avvisa che l'indirizzo non è ancora geocodificato e
   *  mostra comunque un'anteprima di ricerca basata sul testo digitato, utile per individuare refusi. */
  function aggiungiAnteprimaMappa(wrap, field, input, existingObj) {
    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'map-preview-toggle';
    toggle.textContent = '🗺️ Mostra mappa';

    var status = document.createElement('div');
    status.className = 'map-preview-status hidden';

    var mapWrap = document.createElement('div');
    mapWrap.className = 'map-preview-wrap hidden';
    var iframe = document.createElement('iframe');
    iframe.setAttribute('loading', 'lazy');
    iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    mapWrap.appendChild(iframe);

    var coordFields = field.mapCoordFields || [];
    var latSalvata = existingObj && coordFields[0] ? existingObj[coordFields[0]] : null;
    var lngSalvata = existingObj && coordFields[1] ? existingObj[coordFields[1]] : null;
    var haCoordSalvate = isNumClient(latSalvata) && isNumClient(lngSalvata);

    function aggiorna(usaCoordSalvate) {
      if (usaCoordSalvate) {
        status.className = 'map-preview-status ok';
        status.textContent = '📍 Posizione salvata: ' + latSalvata.toFixed(5) + ', ' + lngSalvata.toFixed(5) + ' — verrà ricalcolata se modifichi l\'indirizzo e salvi di nuovo.';
        iframe.src = mapEmbedUrlPerCoord(latSalvata, lngSalvata);
      } else if (input.value) {
        status.className = 'map-preview-status warn';
        status.textContent = '⚠ Nessuna coordinata salvata per questo indirizzo: questa è solo un\'anteprima di ricerca. Salva per geocodificarlo davvero.';
        iframe.src = mapEmbedUrlPerQuery(input.value);
      } else {
        status.className = 'map-preview-status warn';
        status.textContent = '⚠ Inserisci un indirizzo per vedere l\'anteprima.';
        iframe.removeAttribute('src');
      }
    }

    toggle.addEventListener('click', function () {
      var isHidden = mapWrap.classList.contains('hidden');
      if (isHidden) {
        mapWrap.classList.remove('hidden');
        status.classList.remove('hidden');
        toggle.textContent = '🗺️ Nascondi mappa';
        aggiorna(haCoordSalvate);
      } else {
        mapWrap.classList.add('hidden');
        status.classList.add('hidden');
        toggle.textContent = '🗺️ Mostra mappa';
      }
    });

    var mapDebounce;
    input.addEventListener('input', function () {
      if (mapWrap.classList.contains('hidden')) return;
      clearTimeout(mapDebounce);
      mapDebounce = setTimeout(function () { aggiorna(false); }, 700);
    });

    wrap.appendChild(toggle);
    wrap.appendChild(status);
    wrap.appendChild(mapWrap);
  }

  function callServer(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); });
      runner[fnName].apply(runner, args);
    });
  }

  function toast(msg, type) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = type || '';
    el.classList.remove('hidden');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 3800);
  }

  function toInputDate(date) {
    var y = date.getFullYear(), m = ('0' + (date.getMonth() + 1)).slice(-2), d = ('0' + date.getDate()).slice(-2);
    return y + '-' + m + '-' + d;
  }
  function fromInputDate(str) {
    var p = str.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function parseDateStrClient(str) {
    if (!str) return null;
    var p = String(str).split(/[\/\-]/);
    if (p.length !== 3) return null;
    if (p[0].length === 4) return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    return new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
  }
  function timeToMinutesClient(hhmm) {
    var p = String(hhmm || '0:0').split(':');
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
  }
  function minutesToTimeClient(mins) {
    var total = ((Math.round(mins) % 1440) + 1440) % 1440;
    var h = Math.floor(total / 60), m = total % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  // ---------- tabs ----------
  function mostraTab(view) {
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.view === view); });
    document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + view); });
    onShowView(view);
  }

  function setupTabs() {
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { mostraTab(btn.dataset.view); });
    });
  }

  function onShowView(view) {
    if (view === 'interventi') loadInterventi();
    if (view === 'squadre') loadSquadre();
    if (view === 'impostazioni') { loadRegole(); loadLog(); }
    if (view === 'pianificazione' && pianState.giorno) aggiornaBoardGiorno();
    if (view === 'programmazione') caricaProgrammazione();
  }

  // ---------- modale generico basato su schema ----------
  function getOptionsForField(field) {
    if (field.options) return field.options.map(function (o) { return { value: o, label: o }; });
    if (field.optionsFrom === 'SQUADRE') return state.squadre.map(function (s) { return { value: s.id, label: s.nome }; });
    return [];
  }

  function openModal(schemaKey, existingObj) {
    modalState.schemaKey = schemaKey;
    modalState.editObj = existingObj || null;
    var def = state.schema[schemaKey];
    document.getElementById('modal-title').textContent = (existingObj ? 'Modifica' : 'Nuovo/a') + ' — ' + def.label;
    var form = document.getElementById('modal-form');
    form.innerHTML = '';
    def.fields.forEach(function (field) {
      if (field.readonly) return;
      var wrap = document.createElement('div');
      wrap.className = 'field';
      var label = document.createElement('label');
      label.textContent = field.label + (field.required ? ' *' : '');
      wrap.appendChild(label);

      if (field.type === 'giorni') {
        var selezionatiGiorni = splitListClient(existingObj && existingObj[field.key] !== undefined ? existingObj[field.key] : (field.default || ''));
        var giorniDiv = document.createElement('div');
        giorniDiv.className = 'checklist-squadre';
        giorniDiv.dataset.keyGiorni = field.key;
        GIORNI_ORDINE.forEach(function (g) {
          var lbl = document.createElement('label');
          var cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = g;
          cb.checked = selezionatiGiorni.indexOf(g) !== -1;
          lbl.appendChild(cb); lbl.appendChild(document.createTextNode(g));
          giorniDiv.appendChild(lbl);
        });
        wrap.appendChild(giorniDiv);
        if (field.help) {
          var helpGiorni = document.createElement('div');
          helpGiorni.className = 'field-help';
          helpGiorni.textContent = field.help;
          wrap.appendChild(helpGiorni);
        }
        form.appendChild(wrap);
        return;
      }

      if (field.type === 'ferie') {
        var periodiDiv = document.createElement('div');
        periodiDiv.className = 'ferie-list';
        periodiDiv.dataset.keyFerie = field.key;
        var periodiEsistenti = [];
        try { periodiEsistenti = JSON.parse((existingObj && existingObj[field.key]) || '[]'); } catch (e) { periodiEsistenti = []; }
        if (!Array.isArray(periodiEsistenti)) periodiEsistenti = [];

        function aggiungiRigaFerie(dal, al) {
          var riga = document.createElement('div');
          riga.className = 'ferie-riga';
          var inputDal = document.createElement('input');
          inputDal.type = 'date'; inputDal.className = 'ferie-dal';
          if (dal) { var dDal = parseDateStrClient(dal); if (dDal) inputDal.value = toInputDate(dDal); }
          var inputAl = document.createElement('input');
          inputAl.type = 'date'; inputAl.className = 'ferie-al';
          if (al) { var dAl = parseDateStrClient(al); if (dAl) inputAl.value = toInputDate(dAl); }
          var btnRimuovi = document.createElement('button');
          btnRimuovi.type = 'button'; btnRimuovi.className = 'ferie-rimuovi'; btnRimuovi.textContent = '✕';
          btnRimuovi.addEventListener('click', function () { riga.remove(); });
          riga.appendChild(inputDal);
          riga.appendChild(document.createTextNode(' → '));
          riga.appendChild(inputAl);
          riga.appendChild(btnRimuovi);
          periodiDiv.appendChild(riga);
        }
        periodiEsistenti.forEach(function (p) { aggiungiRigaFerie(p.dal, p.al); });

        var btnAggiungiFerie = document.createElement('button');
        btnAggiungiFerie.type = 'button';
        btnAggiungiFerie.className = 'btn secondary small';
        btnAggiungiFerie.textContent = '+ Aggiungi periodo';
        btnAggiungiFerie.addEventListener('click', function () { aggiungiRigaFerie(); });

        wrap.appendChild(periodiDiv);
        wrap.appendChild(btnAggiungiFerie);
        if (field.help) {
          var helpFerie = document.createElement('div');
          helpFerie.className = 'field-help';
          helpFerie.textContent = field.help;
          wrap.appendChild(helpFerie);
        }
        form.appendChild(wrap);
        return;
      }

      var input;
      if (field.type === 'select') {
        input = document.createElement('select');
        getOptionsForField(field).forEach(function (o) {
          var opt = document.createElement('option');
          opt.value = o.value; opt.textContent = o.label;
          input.appendChild(opt);
        });
      } else if (field.type === 'checkbox') {
        input = document.createElement('input'); input.type = 'checkbox';
      } else if (field.type === 'date') {
        input = document.createElement('input'); input.type = 'text'; input.placeholder = 'gg/mm/aaaa';
      } else if (field.type === 'color') {
        input = document.createElement('input'); input.type = 'color';
      } else if (field.type === 'number') {
        input = document.createElement('input'); input.type = 'number';
      } else {
        input = document.createElement('input'); input.type = 'text';
      }
      input.dataset.key = field.key;
      var value = existingObj && existingObj[field.key] !== undefined && existingObj[field.key] !== null
        ? existingObj[field.key]
        : (field.default !== undefined ? field.default : '');
      if (field.type === 'checkbox') input.checked = !!value; else input.value = value;
      wrap.appendChild(input);
      if (field.help) {
        var help = document.createElement('div');
        help.className = 'field-help';
        help.textContent = field.help;
        wrap.appendChild(help);
      }
      if (field.mapPreview) {
        aggiungiAnteprimaMappa(wrap, field, input, existingObj);
      }
      form.appendChild(wrap);
    });
    document.getElementById('modal-overlay').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  function setupModal() {
    on('modal-cancel', 'click', closeModal);
    on('modal-save', 'click', function () {
      var def = state.schema[modalState.schemaKey];
      var obj = modalState.editObj ? Object.assign({}, modalState.editObj) : {};
      var form = document.getElementById('modal-form');
      var mancante = null;
      form.querySelectorAll('[data-key]').forEach(function (input) {
        var key = input.dataset.key;
        var fieldDef = def.fields.filter(function (f) { return f.key === key; })[0];
        if (input.type === 'checkbox') obj[key] = input.checked;
        else if (input.type === 'number') obj[key] = input.value === '' ? null : parseFloat(input.value);
        else obj[key] = input.value;
        if (fieldDef && fieldDef.required && !obj[key]) mancante = fieldDef.label;
      });
      form.querySelectorAll('[data-key-giorni]').forEach(function (container) {
        var key = container.dataset.keyGiorni;
        obj[key] = Array.prototype.slice.call(container.querySelectorAll('input:checked')).map(function (cb) { return cb.value; }).join(',');
      });
      form.querySelectorAll('[data-key-ferie]').forEach(function (container) {
        var key = container.dataset.keyFerie;
        var periodi = Array.prototype.slice.call(container.querySelectorAll('.ferie-riga')).map(function (riga) {
          var dal = riga.querySelector('.ferie-dal').value, al = riga.querySelector('.ferie-al').value;
          if (!dal || !al) return null;
          return { dal: fromInputDate(dal), al: fromInputDate(al) };
        }).filter(Boolean);
        obj[key] = JSON.stringify(periodi);
      });
      if (mancante) { toast('Campo obbligatorio mancante: ' + mancante, 'error'); return; }
      var fnName = SAVE_FN[modalState.schemaKey];
      var saveBtn = document.getElementById('modal-save');
      saveBtn.disabled = true;
      callServer(fnName, obj).then(function () {
        toast('Salvato con successo.', 'success');
        closeModal();
        reloadAfterSave(modalState.schemaKey);
      }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () { saveBtn.disabled = false; });
    });
  }

  function reloadAfterSave(schemaKey) {
    if (schemaKey === 'SQUADRE') loadSquadre().then(populaSelectSquadra);
    if (schemaKey === 'INTERVENTI') loadInterventi();
  }

  // ---------- Squadre ----------
  function loadSquadre() {
    return callServer('listaSquadre').then(function (list) {
      state.squadre = list;
      renderSquadre(list);
      return list;
    });
  }

  function renderSquadre(list) {
    var tbody = document.querySelector('#tabella-squadre tbody');
    if (!list.length) { tbody.innerHTML = '<tr><td colspan="9"><div class="empty-hint">Nessuna squadra. Aggiungine una.</div></td></tr>'; return; }
    tbody.innerHTML = list.map(function (s) {
      var rientro = s.indirizzoRientro ? escapeHtml(s.indirizzoRientro) : '<span style="color:#999;">= partenza</span>';
      var pausa = (s.pausaPranzoInizio && s.pausaPranzoFine) ? (s.pausaPranzoInizio + ' - ' + s.pausaPranzoFine) : '<span style="color:#999;">nessuna</span>';
      var giorniOff = splitListClient(s.giorniIndisponibili);
      var periodiFerie = [];
      try { periodiFerie = JSON.parse(s.feriePeriodi || '[]'); } catch (e) { periodiFerie = []; }
      if (!Array.isArray(periodiFerie)) periodiFerie = [];
      var disponibilitaParti = [];
      if (giorniOff.length) disponibilitaParti.push('Riposo: ' + giorniOff.join(', '));
      if (periodiFerie.length) disponibilitaParti.push(periodiFerie.length + ' periodo/i di ferie');
      var disponibilita = disponibilitaParti.length
        ? '<span style="font-size:11.5px;">' + escapeHtml(disponibilitaParti.join(' · ')) + '</span>'
        : '<span style="color:#999;">standard</span>';
      return '<tr>' +
        '<td><span class="team-dot" style="background:' + (s.colore || '#999') + '"></span></td>' +
        '<td>' + escapeHtml(s.nome) + '</td>' +
        '<td>' + escapeHtml(s.indirizzoPartenza || '') + '</td>' +
        '<td>' + rientro + '</td>' +
        '<td>' + (s.oraInizio || '') + ' - ' + (s.oraFine || '') + '</td>' +
        '<td>' + pausa + '</td>' +
        '<td>' + (s.attiva ? '✅' : '❌') + '</td>' +
        '<td>' + disponibilita + '</td>' +
        '<td><div class="actions-cell">' +
          '<button class="btn small secondary" data-action="modifica" data-row="' + s._row + '">Modifica</button>' +
          '<button class="btn small danger" data-action="elimina" data-row="' + s._row + '">Elimina</button>' +
        '</div></td></tr>';
    }).join('');
  }

  function setupSquadreTab() {
    on('btn-nuova-squadra', 'click', function () { openModal('SQUADRE', null); });
    onQuery('#tabella-squadre tbody', 'click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      // Identifica la riga per numero di riga fisica (sempre univoco), non per id:
      // una squadra inserita a mano direttamente sul foglio potrebbe non avere ancora un ID.
      var row = parseInt(btn.dataset.row, 10);
      var obj = state.squadre.filter(function (s) { return s._row === row; })[0];
      if (!obj) return;
      if (btn.dataset.action === 'modifica') openModal('SQUADRE', obj);
      if (btn.dataset.action === 'elimina') {
        if (!window.confirm('Eliminare definitivamente la squadra "' + obj.nome + '"?')) return;
        callServer('eliminaSquadra', obj.id, obj._row).then(function () { toast('Squadra eliminata.', 'success'); loadSquadre().then(populaSelectSquadra); })
          .catch(function (err) { toast(err.message || String(err), 'error'); });
      }
    });
  }

  // ---------- Interventi ----------
  function popolaSelectFiltri() {
    var selStato = document.getElementById('filtro-stato');
    ['Da pianificare', 'Pianificato', 'Completato', 'Annullato'].forEach(function (s) {
      var opt = document.createElement('option'); opt.value = s; opt.textContent = s; selStato.appendChild(opt);
    });
    var selSquadra = document.getElementById('filtro-squadra');
    state.squadre.forEach(function (s) {
      var opt = document.createElement('option'); opt.value = s.id; opt.textContent = s.nome; selSquadra.appendChild(opt);
    });
  }

  function loadInterventi() {
    var filtri = {
      stato: document.getElementById('filtro-stato').value,
      squadraId: document.getElementById('filtro-squadra').value
    };
    return callServer('listaInterventi', filtri).then(function (list) {
      state.interventi = list;
      renderInterventi(list);
    });
  }

  function renderInterventi(list) {
    var tbody = document.querySelector('#tabella-interventi tbody');
    if (!list.length) { tbody.innerHTML = '<tr><td colspan="9"><div class="empty-hint">Nessun intervento trovato.</div></td></tr>'; return; }
    tbody.innerHTML = list.map(function (i) {
      var squadra = state.squadre.filter(function (s) { return s.id === i.squadraId; })[0];
      var statoClass = 'stato-' + String(i.stato || '').replace(/\s+/g, '-');
      var azioni = '<button class="btn small secondary" data-action="modifica" data-row="' + i._row + '">Modifica</button>';
      if (i.stato === 'Pianificato') {
        azioni += '<button class="btn small secondary" data-action="completa" data-row="' + i._row + '">Completa</button>' +
          '<button class="btn small secondary" data-action="sblocca" data-row="' + i._row + '">Sblocca</button>';
      }
      if (i.stato !== 'Annullato' && i.stato !== 'Completato') {
        azioni += '<button class="btn small secondary" data-action="annulla" data-row="' + i._row + '">Annulla</button>';
      }
      azioni += '<button class="btn small danger" data-action="elimina" data-row="' + i._row + '">Elimina</button>';
      return '<tr>' +
        '<td>' + escapeHtml(i.cliente) + '<div style="color:#888;font-size:11px;">' + escapeHtml(i.indirizzo || '') + '</div></td>' +
        '<td>' + escapeHtml(i.competenza || '-') + '</td>' +
        '<td><span class="badge ' + i.priorita + '">' + i.priorita + '</span></td>' +
        '<td>' + (i.durataMinuti || '') + ' min</td>' +
        '<td>' + (i.finestraInizio || '') + ' - ' + (i.finestraFine || '') + '</td>' +
        '<td><span class="badge ' + statoClass + '">' + i.stato + '</span>' +
          (i.motivoNonPianificato ? '<div style="color:#c5221f;font-size:11px;margin-top:3px;">' + escapeHtml(i.motivoNonPianificato) + '</div>' : '') + '</td>' +
        '<td>' + (squadra ? escapeHtml(squadra.nome) : '-') + '</td>' +
        '<td>' + (i.dataPianificata ? i.dataPianificata + ' ' + (i.oraPianificata || '') : '-') + '</td>' +
        '<td><div class="actions-cell">' + azioni + '</div></td>' +
      '</tr>';
    }).join('');
  }

  function renderRisultatoImportEsterno_(r) {
    var righe = [
      r.creati + ' creati',
      r.aggiornati + ' aggiornati',
      r.giaImportati + ' già importati in precedenza (senza Ods, invariati)',
      r.annullatiRimossi + ' annullati (Ods non più presente nel tracking esterno)',
      r.saltati + ' saltati (dati obbligatori mancanti)',
      r.falliti + ' falliti (es. indirizzo non geocodificabile)'
    ];
    var html = '<div class="summary-cards"><div class="summary-card">' + righe.join(' · ') + '</div></div>';
    if (r.tempoScaduto) {
      html += '<div class="non-pianificabili-list" style="margin-top:8px;"><div>Tempo di elaborazione esaurito prima di finire tutte le righe: le righe già lette restano importate, premi di nuovo "Importa" per completare il resto.</div></div>';
    }
    var dettagli = (r.dettagliSaltati || []).concat(r.dettagliFalliti || []);
    if (dettagli.length) {
      html += '<div class="non-pianificabili-list" style="margin-top:8px;">' +
        dettagli.map(function (d) { return '<div>' + escapeHtml(d) + '</div>'; }).join('') +
        '</div>';
    }
    document.getElementById('import-esterno-risultato').innerHTML = html;
  }

  function setupInterventiTab() {
    on('btn-nuovo-intervento', 'click', function () { openModal('INTERVENTI', null); });
    on('btn-filtra-interventi', 'click', loadInterventi);
    on('btn-importa-esterno', 'click', function (e) {
      var btn = e.target;
      btn.disabled = true;
      callServer('importaInterventiEsterni').then(function (r) {
        renderRisultatoImportEsterno_(r);
        var haProblemi = r.saltati > 0 || r.falliti > 0;
        var totale = r.creati + r.aggiornati;
        toast(totale > 0 ? 'Import completato: ' + r.creati + ' creati, ' + r.aggiornati + ' aggiornati.' : 'Nessuna riga da creare o aggiornare (' + r.giaImportati + ' già importate senza Ods).',
          haProblemi ? 'error' : 'success');
        return loadInterventi();
      }).catch(function (err) {
        toast(err.message || String(err), 'error');
      }).then(function () { btn.disabled = false; });
    });
    onQuery('#tabella-interventi tbody', 'click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      // Identifica la riga per numero di riga fisica (sempre univoco), non per id:
      // un intervento inserito a mano direttamente sul foglio potrebbe non avere ancora un ID.
      var row = parseInt(btn.dataset.row, 10);
      var obj = state.interventi.filter(function (i) { return i._row === row; })[0];
      if (!obj) return;
      var action = btn.dataset.action;
      if (action === 'modifica') { openModal('INTERVENTI', obj); return; }
      if (action === 'elimina') {
        if (!window.confirm('Eliminare definitivamente l\'intervento per "' + obj.cliente + '"?')) return;
        callServer('eliminaIntervento', obj.id, obj._row).then(function () { toast('Intervento eliminato.', 'success'); loadInterventi(); })
          .catch(function (err) { toast(err.message || String(err), 'error'); });
        return;
      }
      if (action === 'completa') {
        callServer('segnaCompletato', obj.id, obj._row).then(function () { toast('Intervento completato.', 'success'); loadInterventi(); })
          .catch(function (err) { toast(err.message || String(err), 'error'); });
        return;
      }
      if (action === 'sblocca') {
        callServer('ripianificaIntervento', obj.id, obj._row).then(function () { toast('Intervento riportato a "Da pianificare".', 'success'); loadInterventi(); })
          .catch(function (err) { toast(err.message || String(err), 'error'); });
        return;
      }
      if (action === 'annulla') {
        if (!window.confirm('Annullare l\'intervento per "' + obj.cliente + '"?')) return;
        callServer('annullaIntervento', obj.id, obj._row).then(function () { toast('Intervento annullato.', 'success'); loadInterventi(); })
          .catch(function (err) { toast(err.message || String(err), 'error'); });
      }
    });
  }

  // ---------- Regole ----------
  function loadRegole() {
    return callServer('listaRegole').then(renderRegole);
  }

  var GIORNI_ORDINE = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];

  function renderRegole(list) {
    var tbody = document.querySelector('#tabella-regole tbody');
    tbody.innerHTML = list.map(function (r) {
      var controllo;
      if (r.tipo === 'giorni') {
        var selezionati = splitListClient(r.valore);
        controllo = '<div class="checklist-squadre" data-chiave-giorni="' + escapeHtml(r.chiave) + '">' +
          GIORNI_ORDINE.map(function (g) {
            var checked = selezionati.indexOf(g) !== -1 ? 'checked' : '';
            return '<label><input type="checkbox" value="' + g + '" ' + checked + '>' + g + '</label>';
          }).join('') +
        '</div>';
      } else if (r.tipo === 'percentuale') {
        controllo = '<input type="number" step="1" min="0" max="100" data-chiave="' + escapeHtml(r.chiave) + '" value="' + escapeHtml(r.valore) + '" style="width:70px"> <span style="color:#666;">%</span>';
      } else if (r.tipo === 'testo') {
        controllo = '<input type="text" data-chiave="' + escapeHtml(r.chiave) + '" value="' + escapeHtml(r.valore) + '" style="width:280px">';
      } else {
        controllo = '<input type="number" step="any" data-chiave="' + escapeHtml(r.chiave) + '" value="' + escapeHtml(r.valore) + '" style="width:100px">';
      }
      return '<tr>' +
        '<td>' + escapeHtml(r.chiave) + '</td>' +
        '<td>' + controllo + '</td>' +
        '<td style="max-width:420px;color:#666;font-size:12.5px;">' + escapeHtml(r.descrizione || '') + '</td>' +
        '<td><button class="btn small secondary" data-action="salva-regola" data-chiave="' + escapeHtml(r.chiave) + '" data-tipo="' + r.tipo + '">Salva</button></td>' +
      '</tr>';
    }).join('');
  }

  function setupRegoleTab() {
    onQuery('#tabella-regole tbody', 'click', function (e) {
      var btn = e.target.closest('button[data-action="salva-regola"]');
      if (!btn) return;
      var chiave = btn.dataset.chiave;
      var valore;
      if (btn.dataset.tipo === 'giorni') {
        var container = document.querySelector('[data-chiave-giorni="' + CSS.escape(chiave) + '"]');
        valore = Array.prototype.slice.call(container.querySelectorAll('input:checked')).map(function (cb) { return cb.value; }).join(',');
      } else {
        var input = document.querySelector('#tabella-regole input[data-chiave="' + CSS.escape(chiave) + '"]');
        valore = input.value;
      }
      callServer('salvaRegola', { chiave: chiave, valore: valore }).then(function () {
        toast('Regola aggiornata.', 'success');
      }).catch(function (err) { toast(err.message || String(err), 'error'); });
    });
  }

  function loadLog() {
    return callServer('getLogPianificazioni').then(function (list) {
      var tbody = document.querySelector('#tabella-log tbody');
      if (!list.length) { tbody.innerHTML = '<tr><td colspan="5"><div class="empty-hint">Nessun percorso confermato registrato.</div></td></tr>'; return; }
      tbody.innerHTML = list.map(function (l) {
        return '<tr><td>' + escapeHtml(l.timestamp) + '</td><td>' + escapeHtml(l.utente) + '</td><td>' + escapeHtml(l.squadra) + '</td><td>' + escapeHtml(l.giorno) + '</td><td>' + l.tappe + '</td></tr>';
      }).join('');
    });
  }

  // ---------- Pianificazione ----------
  function populaSelectSquadra() {
    var sel = document.getElementById('pian-squadra');
    var valorePrecedente = sel.value;
    sel.innerHTML = '';
    state.squadre.filter(function (s) { return s.attiva; }).forEach(function (s) {
      var opt = document.createElement('option'); opt.value = s.id; opt.textContent = s.nome; sel.appendChild(opt);
    });
    if (valorePrecedente && state.squadre.some(function (s) { return s.id === valorePrecedente; })) sel.value = valorePrecedente;

    var checklist = document.getElementById('pian-intervallo-squadre');
    if (checklist) {
      var checkedPrima = idsSquadreIntervalloSelezionate();
      checklist.innerHTML = '';
      state.squadre.filter(function (s) { return s.attiva; }).forEach(function (s) {
        var label = document.createElement('label');
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = s.id;
        cb.checked = checkedPrima.length ? checkedPrima.indexOf(s.id) !== -1 : true;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(s.nome));
        checklist.appendChild(label);
      });
    }
  }

  function idsSquadreIntervalloSelezionate() {
    return Array.prototype.slice.call(document.querySelectorAll('#pian-intervallo-squadre input:checked')).map(function (cb) { return cb.value; });
  }

  function idsSelezionatiCorrenti() {
    return Array.prototype.slice.call(document.querySelectorAll('#tabella-selezione-interventi input[type=checkbox]:checked'))
      .map(function (cb) { return cb.dataset.id; });
  }

  function aggiornaContatoreSelezione() {
    document.getElementById('pian-selezione-count').textContent = idsSelezionatiCorrenti().length + ' intervento/i selezionato/i';
  }

  function renderSelezioneInterventi() {
    var tbody = document.querySelector('#tabella-selezione-interventi tbody');
    var tutti = pianState.disponibili.concat(pianState.pianificati).concat(pianState.pianificatiAltrove || []);
    if (!tutti.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-hint">Nessun intervento "Da pianificare" disponibile.</div></td></tr>';
      document.getElementById('pian-selezione-count').textContent = '';
      return;
    }
    var squadra = state.squadre.filter(function (s) { return s.id === pianState.squadraId; })[0];
    var competenzeSquadra = squadra ? splitListClient(squadra.competenze).map(function (c) { return c.toLowerCase(); }) : [];
    var pianificatiIds = pianState.pianificati.map(function (i) { return i.id; });
    tbody.innerHTML = tutti.map(function (i) {
      var giaPianificato = pianificatiIds.indexOf(i.id) !== -1;
      var checked = giaPianificato ? 'checked' : '';
      var competenzaIntervento = String(i.competenza || '').trim().toLowerCase();
      var incompatibile = !!(competenzaIntervento && competenzeSquadra.length && competenzeSquadra.indexOf(competenzaIntervento) === -1);
      // Una competenza incompatibile blocca la nuova selezione (rispecchia il vincolo rigido
      // lato server), ma se l'intervento è già pianificato per questa squadra (es. competenze
      // cambiate dopo l'assegnazione) resta comunque deselezionabile.
      var disabled = (incompatibile && !giaPianificato) ? 'disabled' : '';
      var warn = incompatibile
        ? ' <span class="warn-icon" title="Competenza non tra quelle della squadra">⚠</span>' : '';
      // Selezionare un intervento già pianificato per un'altra squadra/giorno equivale a
      // spostarlo qui: la conferma successiva sovrascrive la sua assegnazione precedente.
      var altrove = i.squadraNomeAttuale
        ? '<span class="badge-altrove" title="Attualmente pianificato altrove">' + escapeHtml(i.squadraNomeAttuale) + ' · ' + escapeHtml(i.dataPianificata) + '</span>'
        : '';
      return '<tr' + (disabled ? ' class="row-disabled"' : '') + '>' +
        '<td><input type="checkbox" data-id="' + i.id + '" ' + checked + ' ' + disabled + '></td>' +
        '<td>' + escapeHtml(i.cliente) + '</td>' +
        '<td>' + escapeHtml(i.indirizzo || '') + '</td>' +
        '<td>' + escapeHtml(i.competenza || '-') + warn + '</td>' +
        '<td><span class="badge ' + i.priorita + '">' + i.priorita + '</span></td>' +
        '<td>' + (i.durataMinuti || '') + ' min</td>' +
        '<td>' + (i.finestraInizio || '') + ' - ' + (i.finestraFine || '') + '</td>' +
        '<td>' + altrove + '</td>' +
      '</tr>';
    }).join('');
    aggiornaContatoreSelezione();
    aggiornaMarkerMappaSelezione_();
  }

  // ---------- mappa di selezione interventi (Pianificazione, giorno singolo) ----------
  var mappaSelezioneInstance = null;
  var mappaSelezioneMarkers = [];

  function toggleMappaSelezione() {
    var wrap = document.getElementById('pian-selezione-mappa-wrap');
    var btn = document.getElementById('btn-toggle-mappa-selezione');
    var apri = wrap.classList.contains('hidden');
    if (!apri) {
      wrap.classList.add('hidden');
      btn.textContent = '🗺️ Mostra mappa';
      return;
    }
    caricaLeaflet_().then(function () {
      wrap.classList.remove('hidden');
      btn.textContent = '🗺️ Nascondi mappa';
      if (!mappaSelezioneInstance) {
        mappaSelezioneInstance = L.map('pian-selezione-mappa');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(mappaSelezioneInstance);
        // Il contenuto del popup viene rigenerato ad ogni ridisegno dei marker: l'handler del
        // bottone "Inserisci/Rimuovi" si aggancia una volta sola qui, all'apertura del popup,
        // invece che sul marker (che viene ricreato ad ogni sincronizzazione).
        mappaSelezioneInstance.on('popupopen', function (e) {
          var el = e.popup.getElement();
          var btnToggle = el && el.querySelector('[data-toggle-id]');
          if (!btnToggle) return;
          btnToggle.addEventListener('click', function () {
            var id = btnToggle.dataset.toggleId;
            var cb = document.querySelector('#tabella-selezione-interventi input[data-id="' + CSS.escape(id) + '"]');
            if (!cb || cb.disabled) { toast('Questo intervento non è selezionabile per questa squadra.', 'error'); return; }
            cb.checked = !cb.checked;
            cb.dispatchEvent(new Event('change', { bubbles: true }));
            mappaSelezioneInstance.closePopup();
          });
        });
      }
      aggiornaMarkerMappaSelezione_();
      setTimeout(function () { if (mappaSelezioneInstance) mappaSelezioneInstance.invalidateSize(); }, 60);
    }).catch(function () {
      toast('Impossibile caricare la mappa (verifica la connessione a internet o la rete/proxy in uso).', 'error');
    });
  }

  /** Ridisegna i marker della mappa di selezione in base allo stato corrente (selezionato/disponibile/incompatibile/pianificato altrove): chiamata ogni volta che la selezione o l'elenco cambiano, così mappa e tabella restano sempre sincronizzate. Non fa nulla se la mappa non è ancora stata aperta. */
  function aggiornaMarkerMappaSelezione_() {
    if (!mappaSelezioneInstance) return;
    mappaSelezioneMarkers.forEach(function (m) { mappaSelezioneInstance.removeLayer(m); });
    mappaSelezioneMarkers = [];

    // Include anche gli interventi già pianificati per un'altra squadra/giorno: selezionarli
    // dalla mappa equivale a spostarli qui (la conferma successiva sovrascrive l'assegnazione
    // precedente), utile per rimediare a testa a testa/errori di pianificazione manualmente.
    var tutti = pianState.disponibili.concat(pianState.pianificati).concat(pianState.pianificatiAltrove || []);
    var puntiValidi = tutti.filter(function (i) { return isNumClient(i.lat) && isNumClient(i.lng); });
    if (!puntiValidi.length) return;

    var squadra = state.squadre.filter(function (s) { return s.id === pianState.squadraId; })[0];
    var competenzeSquadra = squadra ? splitListClient(squadra.competenze).map(function (c) { return c.toLowerCase(); }) : [];
    var selezionatiIds = idsSelezionatiCorrenti();

    puntiValidi.forEach(function (i) {
      var competenzaIntervento = String(i.competenza || '').trim().toLowerCase();
      var incompatibile = !!(competenzaIntervento && competenzeSquadra.length && competenzeSquadra.indexOf(competenzaIntervento) === -1);
      var selezionato = selezionatiIds.indexOf(i.id) !== -1;
      var altrove = !!i.squadraNomeAttuale;
      var classe = incompatibile ? 'incompatibile' : (selezionato ? 'selezionato' : (altrove ? 'altrove' : 'disponibile'));
      var icon = L.divIcon({ className: '', html: '<div class="marker-selezione ' + classe + '"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
      var testoBottone = selezionato
        ? (altrove ? 'Annulla spostamento' : 'Rimuovi dalla selezione')
        : (altrove ? 'Sposta qui' : 'Inserisci in planner');
      var popupHtml = '<div class="popup-selezione">' +
        '<strong>' + escapeHtml(i.cliente) + '</strong><br>' +
        escapeHtml(i.indirizzo || '') + '<br>' +
        (i.competenza ? 'Competenza: ' + escapeHtml(i.competenza) + '<br>' : '') +
        'Priorità: ' + escapeHtml(i.priorita || '') + ' · ' + (i.durataMinuti || '') + ' min<br>' +
        ((i.finestraInizio || i.finestraFine) ? 'Finestra: ' + (i.finestraInizio || '') + '-' + (i.finestraFine || '') + '<br>' : '') +
        (altrove ? '<span class="popup-altrove">📍 Attualmente pianificato per ' + escapeHtml(i.squadraNomeAttuale) + ' il ' + escapeHtml(i.dataPianificata) + '</span><br>' : '') +
        (incompatibile
          ? '<span class="popup-warn">⚠ Competenza non compatibile con questa squadra</span>'
          : '<button type="button" class="btn small' + (selezionato ? ' secondary' : '') + '" data-toggle-id="' + i.id + '">' + testoBottone + '</button>') +
        '</div>';
      var marker = L.marker([i.lat, i.lng], { icon: icon }).addTo(mappaSelezioneInstance).bindPopup(popupHtml);
      mappaSelezioneMarkers.push(marker);
    });

    var bounds = puntiValidi.map(function (i) { return [i.lat, i.lng]; });
    mappaSelezioneInstance.fitBounds(bounds, { padding: [30, 30] });
  }

  function totaleTappeIntervallo(risultato) {
    return risultato.giorni.reduce(function (sum, g) {
      return sum + g.squadre.reduce(function (s2, sq) { return s2 + sq.tappe.length; }, 0);
    }, 0);
  }

  function renderIntervalloResult(risultato) {
    var totaleTappe = totaleTappeIntervallo(risultato);
    var summary = document.getElementById('pian-intervallo-summary');
    summary.style.display = 'flex';
    summary.innerHTML =
      '<div class="summary-card ok"><div class="num">' + totaleTappe + '</div><div class="lbl">Tappe pianificate</div></div>' +
      '<div class="summary-card"><div class="num">' + risultato.giorni.length + '</div><div class="lbl">Giorni con almeno un percorso</div></div>' +
      '<div class="summary-card warn"><div class="num">' + risultato.nonIncluse.length + '</div><div class="lbl">Non incluse</div></div>';

    var nonInclEl = document.getElementById('pian-intervallo-nonincluse');
    nonInclEl.innerHTML = risultato.nonIncluse.length ? risultato.nonIncluse.map(function (n) {
      return '<div class="np-item"><div><strong>' + escapeHtml(n.cliente) + '</strong><div class="motivo">' + escapeHtml(n.motivo) + '</div></div></div>';
    }).join('') : '';

    var boardEl = document.getElementById('pian-intervallo-board');
    if (!risultato.giorni.length) {
      boardEl.innerHTML = '<div class="empty-hint">Nessun percorso generato nell\'intervallo selezionato.</div>';
      return;
    }
    boardEl.innerHTML = risultato.giorni.map(function (g) {
      var teamsHtml = g.squadre.map(function (sq) {
        // Una squadra senza tappe in questo giorno viene mostrata esplicitamente come "libera"
        // invece di sparire semplicemente dal riepilogo (non tutte le squadre devono per forza
        // essere impegnate ogni giorno: se gli interventi disponibili bastano per una sola
        // squadra, l'altra resta libera e va indicato chiaramente, non lasciato ambiguo).
        var stopsHtml = sq.libera || !sq.tappe.length
          ? '<div class="stop libera"><em>Giornata libera — ' + escapeHtml(sq.motivoLibera || 'nessun intervento compatibile da assegnare') + '.</em></div>'
          : sq.tappe.map(function (t) {
            return '<div class="stop"><span class="ora">' + t.oraInizio + '-' + t.oraFine + '</span> <span class="cliente">' + escapeHtml(t.cliente) + '</span>' +
              '<div class="meta">' + escapeHtml(t.indirizzo || '') + ' · ' + t.durataMinuti + ' min</div></div>';
          }).join('');
        return '<div class="board-team"><div class="team-head"><span class="team-dot" style="background:' + (sq.colore || '#999') + '"></span>' + escapeHtml(sq.squadraNome) + '</div>' +
          formattaProduzioneClient(sq.produzioneTotale, sq.produzioneTarget) + stopsHtml + '</div>';
      }).join('');
      return '<div class="board-day"><div class="day-title">' + g.giorno + '</div><div class="board-teams">' + teamsHtml + '</div></div>';
    }).join('');
  }

  function pianificaIntervalloClick() {
    var squadraIds = idsSquadreIntervalloSelezionate();
    if (!squadraIds.length) { toast('Seleziona almeno una squadra.', 'error'); return; }
    var dal = document.getElementById('pian-intervallo-dal').value;
    var al = document.getElementById('pian-intervallo-al').value;
    if (!dal || !al) { toast('Seleziona l\'intervallo di date.', 'error'); return; }
    var nomiSquadre = squadraIds.map(function (id) {
      var s = state.squadre.filter(function (x) { return x.id === id; })[0];
      return s ? s.nome : id;
    }).join(', ');
    if (!window.confirm('Pianificare automaticamente tutti gli interventi disponibili per: ' + nomiSquadre +
      ', tra il ' + fromInputDate(dal) + ' e il ' + fromInputDate(al) + '? Verranno scritti subito sul foglio.')) return;
    var btn = document.getElementById('btn-pianifica-intervallo');
    btn.disabled = true; btn.textContent = 'Calcolo in corso…';
    callServer('pianificaIntervallo', squadraIds, fromInputDate(dal), fromInputDate(al)).then(function (risultato) {
      renderIntervalloResult(risultato);
      var totaleTappe = totaleTappeIntervallo(risultato);
      toast('Intervallo pianificato: ' + totaleTappe + ' tappe su ' + risultato.giorni.length + ' giorni.', 'success');
      aggiornaBoardGiorno();
      if (pianState.giorno) caricaContesto();
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () {
      btn.disabled = false; btn.textContent = '📅 Pianifica intervallo';
    });
  }

  function caricaContesto() {
    var squadraId = document.getElementById('pian-squadra').value;
    var giornoInput = document.getElementById('pian-giorno').value;
    if (!squadraId) { toast('Seleziona una squadra.', 'error'); return; }
    if (!giornoInput) { toast('Seleziona un giorno.', 'error'); return; }
    var giornoStr = fromInputDate(giornoInput);
    pianState.squadraId = squadraId;
    pianState.giorno = giornoStr;
    callServer('getContestoPianificazione', squadraId, giornoStr).then(function (ctx) {
      pianState.disponibili = ctx.disponibili;
      pianState.pianificati = ctx.pianificati;
      pianState.pianificatiAltrove = ctx.pianificatiAltrove || [];
      renderSelezioneInterventi();
      document.getElementById('pian-selezione-card').style.display = 'block';
      if (ctx.pianificati.length > 0) {
        pianState.ordineCorrente = ctx.pianificati.map(function (i) { return i.id; });
        ricalcolaConOrdineCorrente();
      } else {
        pianState.ordineCorrente = [];
        pianState.anteprima = null;
        document.getElementById('pian-anteprima-card').style.display = 'none';
      }
      aggiornaBoardGiorno();
    }).catch(function (err) { toast(err.message || String(err), 'error'); });
  }

  /**
   * Chiama anteprimaPercorso e, se il risultato esclude qualche tappa perché supera il tempo di
   * viaggio massimo impostato in Regole, chiede all'utente se pianificarla comunque (ignorando il
   * limite per questo percorso) o annullare (rispettando il limite, resta "Non inclusa" come al
   * solito) — invece di lasciare che la tappa sparisca in silenzio nell'elenco "Non incluse".
   * Ricorda la scelta in pianState.ignoraTettoViaggio: "Conferma e salva percorso" la userà per
   * ricalcolare allo stesso modo, così un intervento approvato in anteprima non sparisce di nuovo
   * silenziosamente al salvataggio.
   */
  function chiamaAnteprimaConAvvisoTetto_(squadraId, giornoStr, interventoIds, ordineManuale) {
    pianState.ignoraTettoViaggio = false;
    return callServer('anteprimaPercorso', squadraId, giornoStr, interventoIds, ordineManuale).then(function (anteprima) {
      var esclusiPerTetto = anteprima.nonIncluse.filter(function (n) { return n.codice === 'TETTO_VIAGGIO'; });
      if (!esclusiPerTetto.length) return anteprima;
      var nomi = esclusiPerTetto.map(function (n) { return n.cliente; }).join(', ');
      var messaggio = (esclusiPerTetto.length === 1
        ? 'L\'intervento "' + nomi + '" supera'
        : esclusiPerTetto.length + ' interventi (' + nomi + ') superano') +
        ' il tempo massimo di viaggio tra le tappe impostato in Regole.\n\n' +
        'Premi OK per pianificarlo/i ugualmente (ignorando il limite per questo percorso), oppure Annulla per rispettare il limite (resta/restano "Non incluse").';
      if (!window.confirm(messaggio)) return anteprima;
      pianState.ignoraTettoViaggio = true;
      return callServer('anteprimaPercorso', squadraId, giornoStr, interventoIds, ordineManuale, true);
    });
  }

  function ottimizzaPercorso() {
    var ids = idsSelezionatiCorrenti();
    if (!ids.length) { toast('Seleziona almeno un intervento.', 'error'); return; }
    var btn = document.getElementById('btn-ottimizza-percorso');
    btn.disabled = true; btn.textContent = 'Calcolo in corso…';
    chiamaAnteprimaConAvvisoTetto_(pianState.squadraId, pianState.giorno, ids).then(function (anteprima) {
      pianState.anteprima = anteprima;
      pianState.ordineCorrente = anteprima.tappe.map(function (t) { return t.interventoId; });
      renderAnteprima(anteprima);
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () {
      btn.disabled = false; btn.textContent = '🧭 Ottimizza percorso';
    });
  }

  function ricalcolaConOrdineCorrente() {
    if (!pianState.ordineCorrente.length) {
      pianState.anteprima = null;
      document.getElementById('pian-anteprima-card').style.display = 'none';
      return Promise.resolve();
    }
    return chiamaAnteprimaConAvvisoTetto_(pianState.squadraId, pianState.giorno, pianState.ordineCorrente, pianState.ordineCorrente).then(function (anteprima) {
      pianState.anteprima = anteprima;
      pianState.ordineCorrente = anteprima.tappe.map(function (t) { return t.interventoId; });
      renderAnteprima(anteprima);
    }).catch(function (err) { toast(err.message || String(err), 'error'); });
  }

  function renderAnteprima(anteprima) {
    document.getElementById('pian-anteprima-card').style.display = 'block';
    var summary = document.getElementById('pian-anteprima-summary');
    summary.innerHTML =
      '<div class="summary-card ok"><div class="num">' + anteprima.tappe.length + '</div><div class="lbl">Tappe pianificate</div></div>' +
      '<div class="summary-card warn"><div class="num">' + anteprima.nonIncluse.length + '</div><div class="lbl">Non incluse</div></div>' +
      '<div class="summary-card"><div class="num" style="font-size:16px;">' + (anteprima.distanzaTotaleKm || 0) + ' km</div><div class="lbl">Distanza totale</div></div>' +
      '<div class="summary-card"><div class="num" style="font-size:16px;">' + Math.round(anteprima.tempoViaggioTotaleMinuti || 0) + ' min</div><div class="lbl">Tempo di viaggio</div></div>' +
      (anteprima.produzioneTarget ? '<div class="summary-card' + ((anteprima.produzioneTotale || 0) >= anteprima.produzioneTarget ? ' ok' : '') + '"><div class="num" style="font-size:16px;">' +
        formatEuroClient(anteprima.produzioneTotale) + ' / ' + formatEuroClient(anteprima.produzioneTarget) + '</div><div class="lbl">Produzione / Target</div></div>' : '');

    var nonInclEl = document.getElementById('pian-anteprima-nonincluse');
    nonInclEl.innerHTML = anteprima.nonIncluse.length ? anteprima.nonIncluse.map(function (n) {
      return '<div class="np-item"><div><strong>' + escapeHtml(n.cliente) + '</strong><div class="motivo">' + escapeHtml(n.motivo) + '</div></div></div>';
    }).join('') : '';

    var tappeEl = document.getElementById('pian-anteprima-tappe');
    var html = '';
    if (anteprima.partenzaStimata) {
      html += '<div class="route-endpoint">🚗 Partenza stimata: <strong>' + anteprima.partenzaStimata.orario + '</strong> (' +
        Math.round(anteprima.partenzaStimata.viaggioMinuti) + ' min' + (anteprima.partenzaStimata.stimato ? ' stimati' : '') + ' per arrivare in tempo alla prima tappa)</div>';
    }
    anteprima.tappe.forEach(function (t, idx) {
      html += '<div class="route-stop" data-id="' + t.interventoId + '">' +
        '<div class="route-stop-order">' + (idx + 1) + '</div>' +
        '<div class="route-stop-body">' +
          '<div class="route-stop-time">' + t.oraInizio + ' - ' + t.oraFine + '</div>' +
          '<div class="route-stop-client">' + escapeHtml(t.cliente) + ' <span class="badge ' + t.priorita + '">' + t.priorita + '</span></div>' +
          '<div class="route-stop-meta">' + escapeHtml(t.indirizzo || '') + ' · ' + t.durataMinuti + ' min' +
            (idx > 0 ? ' · viaggio ' + Math.round(t.viaggioMinuti) + ' min (' + t.distanzaKm + ' km)' + (t.stimato ? ' stimato' : '') : '') +
          '</div>' +
        '</div>' +
        '<div class="route-stop-actions">' +
          '<button data-action="su" ' + (idx === 0 ? 'disabled' : '') + ' title="Sposta su">▲</button>' +
          '<button data-action="giu" ' + (idx === anteprima.tappe.length - 1 ? 'disabled' : '') + ' title="Sposta giù">▼</button>' +
          '<button data-action="rimuovi" title="Rimuovi dal percorso">✕</button>' +
        '</div>' +
      '</div>';
    });
    if (anteprima.rientroStimato) {
      html += '<div class="route-endpoint">🏠 Rientro stimato: <strong>' + anteprima.rientroStimato.orario + '</strong> (' +
        Math.round(anteprima.rientroStimato.viaggioMinuti) + ' min' + (anteprima.rientroStimato.stimato ? ' stimati' : '') + ', ' + anteprima.rientroStimato.distanzaKm + ' km)</div>';
    }
    tappeEl.innerHTML = html || '<div class="empty-hint">Nessuna tappa pianificabile con la selezione corrente.</div>';
  }

  function confermaPercorsoClick() {
    if (!pianState.ordineCorrente.length) { toast('Nessuna tappa da confermare.', 'error'); return; }
    var btn = document.getElementById('btn-conferma-percorso');
    btn.disabled = true;
    callServer('confermaPercorso', pianState.squadraId, pianState.giorno, pianState.ordineCorrente, pianState.ignoraTettoViaggio).then(function (anteprima) {
      toast('Percorso confermato: ' + anteprima.tappe.length + ' tappe salvate.', 'success');
      pianState.anteprima = anteprima;
      pianState.ordineCorrente = anteprima.tappe.map(function (t) { return t.interventoId; });
      renderAnteprima(anteprima);
      aggiornaBoardGiorno();
      caricaContesto();

  function aggiornaBoardGiorno() {
    if (!pianState.giorno) return;
    callServer('getPercorsiGiorno', pianState.giorno).then(renderBoardPercorsi);
  }

  function renderBoardPercorsi(gruppi) {
    var boardEl = document.getElementById('pian-board');

    var teamsHtml = gruppi.map(function (g) {
      var stopsHtml = g.tappe.map(function (i) {
        var fine = minutesToTimeClient(timeToMinutesClient(i.oraPianificata) + (i.durataMinuti || 0));
        return '<div class="stop"><span class="ora">' + i.oraPianificata + '-' + fine + '</span> <span class="cliente">' + escapeHtml(i.cliente) + '</span>' +

      }).join('');

  }

  function setupPianificazioneTab() {
    var oggi = new Date();
    var fra6 = new Date(oggi.getTime() + 6 * 24 * 3600 * 1000);
    var elGiorno = document.getElementById('pian-giorno');
    if (elGiorno) elGiorno.value = toInputDate(oggi);

    on('btn-carica-contesto', 'click', caricaContesto);
    on('btn-ottimizza-percorso', 'click', ottimizzaPercorso);
    on('btn-conferma-percorso', 'click', confermaPercorsoClick);
    on('btn-pianifica-intervallo', 'click', pianificaIntervalloClick);

    var tbodySelezione = document.querySelector('#tabella-selezione-interventi tbody');
    if (tbodySelezione) {
      tbodySelezione.addEventListener('change', function (e) {
        if (e.target.matches('input[type=checkbox]')) {
          aggiornaContatoreSelezione();
          aggiornaMarkerMappaSelezione_();
        }
      });
    }
    on('btn-toggle-mappa-selezione', 'click', toggleMappaSelezione);

    on('pian-anteprima-tappe', 'click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var stopEl = btn.closest('.route-stop');
      var id = stopEl.dataset.id;
      var idx = pianState.ordineCorrente.indexOf(id);
      var action = btn.dataset.action;
      if (action === 'su' && idx > 0) {
        var tmp = pianState.ordineCorrente[idx - 1];
        pianState.ordineCorrente[idx - 1] = pianState.ordineCorrente[idx];
        pianState.ordineCorrente[idx] = tmp;
        ricalcolaConOrdineCorrente();
      } else if (action === 'giu' && idx < pianState.ordineCorrente.length - 1) {
        var tmp2 = pianState.ordineCorrente[idx + 1];
        pianState.ordineCorrente[idx + 1] = pianState.ordineCorrente[idx];
        pianState.ordineCorrente[idx] = tmp2;
        ricalcolaConOrdineCorrente();
      } else if (action === 'rimuovi') {
        pianState.ordineCorrente.splice(idx, 1);
        var cb = document.querySelector('#tabella-selezione-interventi input[data-id="' + CSS.escape(id) + '"]');
        if (cb) { cb.checked = false; aggiornaContatoreSelezione(); }
        ricalcolaConOrdineCorrente();
      }
    });
  }

  // ---------- vista Programmazione (elenco confermato + deseleziona + riempi buco) ----------
  var progState = { righe: [] };

  function raggruppaProgrammazione(righe) {
    var giorniMap = {};
    righe.forEach(function (r) {
      if (!giorniMap[r.dataPianificata]) giorniMap[r.dataPianificata] = {};
      var squadre = giorniMap[r.dataPianificata];
      if (!squadre[r.squadraId]) {
        squadre[r.squadraId] = { squadraId: r.squadraId, squadraNome: r.squadraNome, colore: r.colore, righe: [] };
      }
      squadre[r.squadraId].righe.push(r);
    });
    return Object.keys(giorniMap).sort(function (a, b) {
      var pa = a.split('/'), pb = b.split('/');
      return new Date(pa[2], pa[1] - 1, pa[0]) - new Date(pb[2], pb[1] - 1, pb[0]);
    }).map(function (giorno) {
      var squadre = Object.keys(giorniMap[giorno]).map(function (k) { return giorniMap[giorno][k]; });
      squadre.forEach(function (sq) {
        sq.produzioneTotale = sq.righe.reduce(function (sum, r) { return sum + (r.ricavo || 0); }, 0);
        sq.produzioneTarget = sq.righe[0].produzioneTarget || 0;
      });
      squadre.sort(function (a, b) { return a.squadraNome < b.squadraNome ? -1 : 1; });
      return { giorno: giorno, squadre: squadre };
    });
  }

  function renderProgrammazione() {
    var el = document.getElementById('prog-risultato');
    if (!progState.righe.length) {
      el.innerHTML = '<div class="empty-hint">Nessun intervento pianificato nell\'intervallo selezionato.</div>';
      return;
    }
    var giorni = raggruppaProgrammazione(progState.righe);
    el.innerHTML = '<div class="board">' + giorni.map(function (g) {
      var teamsHtml = g.squadre.map(function (sq) {
        var righeHtml = sq.righe.map(function (r) {
          return '<tr>' +
            '<td>' + (r.oraPianificata || '') + '</td>' +
            '<td>' + escapeHtml(r.cliente) + '</td>' +
            '<td>' + escapeHtml(r.indirizzo || '') + '</td>' +
            '<td>' + (r.durataMinuti || 0) + ' min</td>' +
            '<td>' + escapeHtml(r.telefono || '-') + '</td>' +
            '<td><button type="button" class="btn secondary" data-action="rimuovi" data-id="' + r.id + '" data-row="' + r._row + '" data-squadra="' + sq.squadraId + '" data-giorno="' + g.giorno + '">Rimuovi</button></td>' +
          '</tr>';
        }).join('');
        return '<div class="prog-team">' +
          '<div class="team-head"><span class="team-dot" style="background:' + (sq.colore || '#999') + '"></span>' + escapeHtml(sq.squadraNome) +
          '<button type="button" class="btn secondary" data-action="vedi-mappa" data-squadra="' + sq.squadraId + '" data-giorno="' + g.giorno + '" style="margin-left:auto;">🗺️ Vedi mappa</button>' +
          '<button type="button" class="btn secondary" data-action="pianifica-qui" data-squadra="' + sq.squadraId + '" data-giorno="' + g.giorno + '">Seleziona manualmente</button>' +
          '<button type="button" class="btn secondary btn-riempi-buco" data-action="riempi-buco" data-squadra="' + sq.squadraId + '" data-giorno="' + g.giorno + '">Riempi buco</button></div>' +
          formattaProduzioneClient(sq.produzioneTotale, sq.produzioneTarget) +
          '<table class="prog-table"><thead><tr><th>Ora</th><th>Cliente</th><th>Indirizzo</th><th>Durata</th><th>Telefono</th><th></th></tr></thead><tbody>' + righeHtml + '</tbody></table>' +
        '</div>';
      }).join('');
      return '<div class="board-day"><div class="day-title">' + g.giorno + '</div>' + teamsHtml + '</div>';
    }).join('') + '</div>';
  }

  function caricaProgrammazione() {
    var dal = document.getElementById('prog-dal').value;
    var al = document.getElementById('prog-al').value;
    if (!dal || !al) { toast('Seleziona l\'intervallo di date.', 'error'); return; }
    return callServer('getProgrammazione', fromInputDate(dal), fromInputDate(al)).then(function (righe) {
      progState.righe = righe;
      renderProgrammazione();
    }).catch(function (err) { toast('Errore nel caricamento: ' + (err.message || err), 'error'); });
  }

  /** Ripianifica squadra/giorno usando i pianificati rimasti + il pool disponibile, per riempire il buco lasciato da una deselezione (o semplicemente per massimizzare l'utilizzo del turno). */
  function riempiBucoGiornoClick(squadraId, giornoStr) {

      var msg = anteprima.tappe.length
        ? 'Buco riempito: ' + anteprima.tappe.length + ' tappe pianificate per ' + anteprima.squadraNome + ' il ' + giornoStr + '.'
        : 'Nessun intervento disponibile da inserire per ' + anteprima.squadraNome + ' il ' + giornoStr + '.';
      toast(msg, 'success');
      return caricaProgrammazione();
    }).catch(function (err) { toast('Errore nel riempimento: ' + (err.message || err), 'error'); });

  function rimuoviProgrammatoClick(id, row, squadraId, giornoStr) {
    if (!window.confirm('Rimuovere questo intervento dal percorso? Tornerà "Da pianificare" e il buco lasciato aperto verrà subito ricoperto, se possibile, con altri interventi disponibili.')) return;
    callServer('ripianificaIntervento', id, row).then(function () {
      return riempiBucoGiornoClick(squadraId, giornoStr);
    }).catch(function (err) { toast('Errore nella rimozione: ' + (err.message || err), 'error'); });

  // ---------- mappa del percorso (Leaflet/OpenStreetMap, nessuna chiave API) ----------
  //
  // Leaflet viene caricato da CDN in modo pigro (solo al primo utilizzo della mappa, non
  // all'avvio dell'app): un <script> esterno messo in testa alla pagina bloccherebbe l'intero
  // rendering finché non risponde, e se quella rete non riesce a raggiungere il CDN (proxy
  // aziendale, filtro di rete) l'intera web app resterebbe con una schermata bianca. Caricandolo
  // così, un eventuale problema di rete limita l'errore alla sola funzione mappa.
  var mappaPercorsoInstance = null;
  var leafletCaricamento = null;

  function caricaLeaflet_() {
    if (typeof L !== 'undefined') return Promise.resolve();
    if (leafletCaricamento) return leafletCaricamento;
    leafletCaricamento = new Promise(function (resolve, reject) {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(link);

      var script = document.createElement('script');
      script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      var timeout = setTimeout(function () { reject(new Error('timeout')); }, 10000);
      script.onload = function () { clearTimeout(timeout); resolve(); };
      script.onerror = function () { clearTimeout(timeout); reject(new Error('load error')); };
      document.head.appendChild(script);
    }).catch(function (err) {
      leafletCaricamento = null; // permette di ritentare a un click successivo
      throw err;
    });
    return leafletCaricamento;
  }

  function apriMappaPercorso(squadraId, giornoStr) {
    var righeSquadra = progState.righe.filter(function (r) { return r.squadraId === squadraId && r.dataPianificata === giornoStr; });
    righeSquadra.sort(function (a, b) { return (a.ordineTappa || 0) - (b.ordineTappa || 0); });
    var punti = righeSquadra.filter(function (r) { return isNumClient(r.lat) && isNumClient(r.lng); });
    if (!punti.length) { toast('Nessuna coordinata disponibile per disegnare la mappa di questo percorso.', 'error'); return; }

    caricaLeaflet_().then(function () {
      disegnaMappaPercorso_(righeSquadra, punti, squadraId, giornoStr);
    }).catch(function () {
      toast('Impossibile caricare la mappa (verifica la connessione a internet o la rete/proxy in uso).', 'error');
    });
  }

  function disegnaMappaPercorso_(righeSquadra, punti, squadraId, giornoStr) {
    var squadraNome = righeSquadra[0].squadraNome || squadraId;
    document.getElementById('mappa-percorso-titolo').textContent = 'Percorso — ' + squadraNome + ' — ' + giornoStr;
    document.getElementById('mappa-percorso-overlay').classList.remove('hidden');

    if (mappaPercorsoInstance) { mappaPercorsoInstance.remove(); mappaPercorsoInstance = null; }
    mappaPercorsoInstance = L.map('mappa-percorso-map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(mappaPercorsoInstance);

    var latlngs = punti.map(function (p) { return [p.lat, p.lng]; });
    // Collega le tappe nell'ordine di visita con segmenti diritti (non un percorso stradale
    // reale): è pensata come indicazione visiva rapida della sequenza/geografia del giro, non
    // come navigazione turn-by-turn.
    L.polyline(latlngs, { color: '#4285F4', weight: 3, opacity: .8 }).addTo(mappaPercorsoInstance);
    punti.forEach(function (p, idx) {
      var icon = L.divIcon({ className: '', html: '<div class="marker-tappa">' + (idx + 1) + '</div>', iconSize: [26, 26], iconAnchor: [13, 13] });
      L.marker([p.lat, p.lng], { icon: icon }).addTo(mappaPercorsoInstance)
        .bindPopup('<strong>' + (idx + 1) + '. ' + escapeHtml(p.cliente) + '</strong><br>' + escapeHtml(p.indirizzo || '') +
          (p.oraPianificata ? '<br>Ore ' + escapeHtml(p.oraPianificata) : ''));
    });
    mappaPercorsoInstance.fitBounds(latlngs, { padding: [30, 30] });

    // Il contenitore passa da hidden a visibile proprio ora: Leaflet calcola le dimensioni al
    // momento della creazione, quando potrebbero non essere ancora quelle reali, quindi si forza
    // un ricalcolo subito dopo che il browser ha applicato il nuovo layout.
    setTimeout(function () { if (mappaPercorsoInstance) mappaPercorsoInstance.invalidateSize(); }, 60);
  }

  function chiudiMappaPercorso() {
    document.getElementById('mappa-percorso-overlay').classList.add('hidden');
    if (mappaPercorsoInstance) { mappaPercorsoInstance.remove(); mappaPercorsoInstance = null; }
  }

  /** Passa al tab Pianificazione precompilato con squadra/giorno, per selezionare manualmente (anche dalla mappa) come per un giorno singolo qualsiasi. */

    mostraTab('pianificazione');
    caricaContesto();
  }

  function setupProgrammazioneTab() {
    var oggi = new Date();
    var fra6 = new Date(oggi.getTime() + 6 * 24 * 3600 * 1000);
    var elDal = document.getElementById('prog-dal');
    if (elDal) elDal.value = toInputDate(oggi);
    var elAl = document.getElementById('prog-al');
    if (elAl) elAl.value = toInputDate(fra6);
    on('btn-carica-programmazione', 'click', caricaProgrammazione);
    onQuery('#prog-risultato', 'click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var squadraId = btn.dataset.squadra, giornoStr = btn.dataset.giorno;
      if (btn.dataset.action === 'rimuovi') {
        rimuoviProgrammatoClick(btn.dataset.id, btn.dataset.row, squadraId, giornoStr);
      } else if (btn.dataset.action === 'riempi-buco') {
        if (!window.confirm('Ripianificare "' + squadraId + '" per il ' + giornoStr + ' includendo eventuali interventi disponibili per riempire le ore libere?')) return;
        riempiBucoGiornoClick(squadraId, giornoStr);
      } else if (btn.dataset.action === 'vedi-mappa') {
        apriMappaPercorso(squadraId, giornoStr);
      } else if (btn.dataset.action === 'pianifica-qui') {
        pianificaQuiClick(squadraId, giornoStr);
      }
    });
    on('mappa-percorso-close', 'click', chiudiMappaPercorso);
    on('mappa-percorso-overlay', 'click', function (e) {
      if (e.target.id === 'mappa-percorso-overlay') chiudiMappaPercorso();
    });
  }

  // ---------- bootstrap ----------
  // Ogni setup viene isolato: se una parte fallisce (es. un elemento mancante perché
  // un file HTML non è stato aggiornato/copiato insieme agli altri) non deve impedire
  // alle altre schede di funzionare — altrimenti un solo errore blocca tutti i pulsanti.
  function safeRun_(nome, fn) {
    try {
      fn();
    } catch (e) {
      console.error('Errore inizializzazione "' + nome + '":', e);
      toast('Errore di inizializzazione (' + nome + '). Apri la console del browser (F12) per i dettagli; verifica che tutti i file gas/ siano aggiornati e ripubblicati.', 'error');
    }
  }

  function init() {
    safeRun_('tabs', setupTabs);
    safeRun_('modal', setupModal);
    safeRun_('pianificazione', setupPianificazioneTab);
    safeRun_('interventi', setupInterventiTab);
    safeRun_('programmazione', setupProgrammazioneTab);
    safeRun_('squadre', setupSquadreTab);
    safeRun_('regole', setupRegoleTab);

    callServer('getBootstrapData').then(function (data) {
      state.schema = data.schema;
      state.squadre = data.squadre;
      state.utente = data.utente;
      document.getElementById('utente-corrente').textContent = data.utente;
      popolaSelectFiltri();
      populaSelectSquadra();
      renderSquadre(state.squadre);
    }).catch(function (err) { toast('Errore di inizializzazione: ' + (err.message || err), 'error'); });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
