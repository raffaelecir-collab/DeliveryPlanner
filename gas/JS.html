    var giorniRange = dateRangeArrayClient(dashState.dal, dashState.al);
    var agg = aggregatoSquadraDash_(sq, giorniRange);
    var giornoUnico = giorniRange[0];

    if (!agg.giorniConDati.length) {
      el.innerHTML = '<div class="dash-empty-detail">' +
        '<div><span class="team-dot" style="background:' + (sq.colore || '#999') + ';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;"></span><strong>' + escapeHtml(sq.nome) + '</strong></div>' +
        '<p style="margin:10px 0 0;">' + (agg.multiGiorno ? 'Nessun intervento pianificato nel periodo selezionato.' : 'Nessun intervento pianificato per questo giorno.') + '</p>' +

        '<div class="dash-detail-head-left"><span class="team-dot" style="background:' + (sq.colore || '#999') + '"></span><h3>' + escapeHtml(sq.nome) + '</h3></div>' +
        '<div class="dash-detail-summary">' +
          (agg.produzioneTarget ? '<span>Produzione <strong>' + formatEuroClient(agg.produzione) + ' / ' + formatEuroClient(agg.produzioneTarget) + '</strong></span>' : '') +
          '<span>Percorso <strong>' + agg.km + ' km</strong></span>' +
        '</div>' +
        '<div class="dash-detail-actions">' +
          (agg.multiGiorno ? '' : '<button class="btn-secondary" data-action="riempi-buchi" data-giorno="' + giornoUnico + '">🧩 Riempi buchi</button>') +

          '<button class="btn-secondary" data-action="aggiungi-intervento" data-giorno="' + giornoUnico + '">+ Aggiungi intervento</button>' +
        '</div>' +

  }

  function dashRimuoviTappa_(id, row) {
    if (!window.confirm('Rimuovere questo intervento dal percorso? Tornerà "Da pianificare" e non sarà più riproposto automaticamente per questa data (resta comunque selezionabile a mano).')) return;
    callServer('ripianificaIntervento', id, row).then(function () {
      toast('Intervento rimosso: torna "Da pianificare".', 'success');
      caricaDashboard();
    }).catch(function (err) { toast('Errore nella rimozione: ' + (err.message || err), 'error'); });
  }

  /**
   * Ripianifica squadra/giorno usando i pianificati rimasti + il pool disponibile, per riempire il
   * buco lasciato da una deselezione (o semplicemente per massimizzare l'utilizzo del turno).
   * Prima chiede in anteprima (senza scrivere nulla) se il riempimento sposterebbe l'orario di
   * qualche intervento già pianificato: se sì, chiede all'utente se accettare lo spostamento o
   * mantenere gli orari già fissati (riempiendo di conseguenza, magari con meno tappe aggiunte).
   */
  function riempiBucoGiornoClick(squadraId, giornoStr) {
    mostraCaricamento('dash-detail');
    return callServer('anteprimaRiempiBucoGiorno', squadraId, giornoStr).then(function (esito) {
      var consentiSpostamento = true;
      if (esito.spostamenti.length) {
        var elenco = esito.spostamenti.map(function (s) {
          return '- ' + s.cliente + ': ' + s.oraOriginale + ' → ' + s.oraNuova;
        }).join('\n');
        var messaggio = 'Riempiendo il buco, l\'orario di ' + (esito.spostamenti.length === 1 ? 'un intervento già pianificato cambierebbe' : esito.spostamenti.length + ' interventi già pianificati cambierebbe') + ':\n\n' + elenco +
          '\n\nPremi OK per accettare lo spostamento, oppure Annulla per mantenere gli orari già fissati (il riempimento si limiterà ad aggiungere tappe dopo l\'ultima già pianificata).';
        consentiSpostamento = window.confirm(messaggio);
      }
      return callServer('riempiBucoGiorno', squadraId, giornoStr, consentiSpostamento);
    }).then(function (anteprima) {
      var msg = anteprima.tappe.length
        ? 'Buco riempito: ' + anteprima.tappe.length + ' tappe pianificate per ' + anteprima.squadraNome + ' il ' + giornoStr + '.'
        : 'Nessun intervento disponibile da inserire per ' + anteprima.squadraNome + ' il ' + giornoStr + '.';
      toast(msg, 'success');
      return caricaDashboard();
    }).catch(function (err) { toast('Errore nel riempimento: ' + (err.message || err), 'error'); }).finally(function () {
      nascondiCaricamento('dash-detail');
    });
  }

  // ---------- dialog: aggiungi intervento con orario fisso ----------
  var aggiungiState = { squadraId: null, giorno: null };

  function apriAggiungiIntervento(squadraId, giornoStr) {
    var squadra = state.squadre.filter(function (s) { return s.id === squadraId; })[0];
    aggiungiState.squadraId = squadraId;
    aggiungiState.giorno = giornoStr;
    document.getElementById('dlg-aggiungi-titolo').textContent = 'Aggiungi intervento — ' + (squadra ? squadra.nome : squadraId) + ' — ' + giornoStr;
    document.getElementById('form-aggiungi-intervento').reset();
    document.getElementById('agg-priorita').value = 'Normale';
    document.getElementById('agg-durata').value = 60;
    document.getElementById('agg-ricavo').value = 0;
    document.getElementById('dlg-aggiungi').classList.remove('hidden');
  }

  function salvaAggiungiIntervento() {
    var cliente = document.getElementById('agg-cliente').value.trim();
    var indirizzo = document.getElementById('agg-indirizzo').value.trim();
    var ora = document.getElementById('agg-ora').value;
    if (!cliente || !indirizzo) { toast('Cliente e indirizzo sono obbligatori.', 'error'); return; }
    if (!ora) { toast('Indica l\'ora.', 'error'); return; }
    var intervento = {
      cliente: cliente,
      indirizzo: indirizzo,
      competenza: document.getElementById('agg-competenza').value.trim(),
      priorita: document.getElementById('agg-priorita').value,
      durataMinuti: parseFloat(document.getElementById('agg-durata').value) || 60,
      telefono: document.getElementById('agg-telefono').value.trim(),
      ricavo: parseFloat(document.getElementById('agg-ricavo').value) || 0
    };
    var btn = document.getElementById('btn-salva-aggiungi-intervento');
    btn.disabled = true; btn.textContent = 'Salvataggio…';
    callServer('creaEPianificaIntervento', intervento, aggiungiState.squadraId, aggiungiState.giorno, ora).then(function () {
      toast('Intervento creato e pianificato.', 'success');
      document.getElementById('dlg-aggiungi').classList.add('hidden');
      caricaDashboard();
    }).catch(function (err) { toast(err.message || String(err), 'error'); }).finally(function () {
      btn.disabled = false; btn.textContent = 'Salva e pianifica';
    });
  }

  function setupDashboardTab() {
    var oggi = new Date();
    var elDal = document.getElementById('dash-dal');
    var elAl = document.getElementById('dash-al');
    if (elDal) elDal.value = toInputDate(oggi);
    if (elAl) elAl.value = toInputDate(oggi);
    on('dash-dal', 'change', caricaDashboard);
    on('dash-al', 'change', caricaDashboard);

    document.querySelectorAll('.map-mode-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { setMapMode(btn.dataset.mapMode); });
    });

    onQuery('#dash-team-list', 'click', function (e) {
      var card = e.target.closest('[data-squadra]');
      if (!card) return;
      dashState.selezionata = card.dataset.squadra;
      renderDashTeamList();
      renderDashMap();
      renderDashDetail();
    });

    onQuery('#dash-detail', 'click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var giornoInput = btn.dataset.giorno;
      var giornoStr = giornoInput ? fromInputDate(giornoInput) : null;
      var action = btn.dataset.action;
      var squadra = state.squadre.filter(function (s) { return s.id === dashState.selezionata; })[0];
      if (action === 'rimuovi-tappa') {
        dashRimuoviTappa_(btn.dataset.id, btn.dataset.row);
      } else if (action === 'riempi-buchi') {
        if (!window.confirm('Ripianificare "' + (squadra ? squadra.nome : dashState.selezionata) + '" per il ' + giornoStr + ' includendo eventuali interventi disponibili per riempire le ore libere?')) return;
        riempiBucoGiornoClick(dashState.selezionata, giornoStr);
      } else if (action === 'seleziona-elenco') {
        apriSelezioneDaElenco(dashState.selezionata, giornoStr);
      } else if (action === 'aggiungi-intervento') {
        apriAggiungiIntervento(dashState.selezionata, giornoStr);
      }
    });

    on('btn-apri-pianifica-intervallo', 'click', function () { document.getElementById('dlg-intervallo').classList.remove('hidden'); });
    on('btn-salva-aggiungi-intervento', 'click', salvaAggiungiIntervento);
    document.querySelectorAll('[data-close-dlg]').forEach(function (btn) {
      btn.addEventListener('click', function () { document.getElementById(btn.dataset.closeDlg).classList.add('hidden'); });
    });

    setupDialogIntervalloESelezione();
  }

  // ---------- bootstrap ----------
  // Ogni setup viene isolato: se una parte fallisce (es. un elemento mancante perché
  // un file HTML non è stato aggiornato/copiato insieme agli altri) non deve impedire
  // alle altre schede di funzionare — altrimenti un solo errore blocca tutti i pulsanti.
  function safeRun_(nome, fn) {
    try {
      fn();
    } catch (e) {
      console.error('Errore inizializzazione "' + nome + '":', e);
      toast('Errore di inizializzazione (' + nome + '). Apri la console del browser (F12) per i dettagli; verifica che tutti i file gas/ siano aggiornati e ripubblicati.', 'error');
    }
  }

  function init() {
    safeRun_('tabs', setupTabs);
    safeRun_('modal', setupModal);
    safeRun_('dashboard', setupDashboardTab);
    safeRun_('interventi', setupInterventiTab);
    safeRun_('squadre', setupSquadreTab);
    safeRun_('regole', setupRegoleTab);

    mostraCaricamento('dash-team-list', 'dash-detail');
    callServer('getBootstrapData').then(function (data) {
      state.schema = data.schema;
      state.squadre = data.squadre;
      state.utente = data.utente;
      document.getElementById('utente-corrente').textContent = data.utente;
      popolaSelectFiltri();
      populaSelectSquadra();
      renderSquadre();
      caricaDashboard();
    }).catch(function (err) {
      toast('Errore di inizializzazione: ' + (err.message || err), 'error');
      nascondiCaricamento('dash-team-list', 'dash-detail');
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
