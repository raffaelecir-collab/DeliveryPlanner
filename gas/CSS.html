<style>
  :root {
    --blu: #4285F4;
    --blu-scuro: #1a56c4;
    --verde: #34A853;
    --rosso: #EA4335;
    --arancio: #FBBC05;
    --grigio-100: #f5f6f8;
    --grigio-200: #e8eaed;
    --grigio-400: #b0b3b8;
    --grigio-600: #6b7075;
    --grigio-900: #202124;
    --radius: 8px;
    --ombra: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--grigio-100); color: var(--grigio-900); font-family: 'Google Sans', Roboto, Arial, sans-serif; font-size: 14px; }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  header.topbar { background: #fff; border-bottom: 1px solid var(--grigio-200); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 20; }
  header.topbar h1 { font-size: 18px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
  header.topbar h1 .logo { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, var(--blu), var(--verde)); display: inline-block; }
  header.topbar .utente { color: var(--grigio-600); font-size: 12px; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }

  .notifiche-wrap { position: relative; }
  .btn-notifiche {
    position: relative; border: none; background: none; cursor: pointer; font-size: 19px;
    line-height: 1; padding: 6px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  }
  .btn-notifiche:hover { background: var(--grigio-100); }
  .notifiche-badge {
    position: absolute; top: 0; right: 0; min-width: 16px; height: 16px; padding: 0 3px;
    border-radius: 999px; background: var(--rosso); color: #fff; font-size: 10px; font-weight: 700;
    line-height: 16px; text-align: center;
  }
  .notifiche-badge.hidden { display: none; }
  .notifiche-pannello {
    position: absolute; top: calc(100% + 8px); right: 0; width: 340px; max-width: calc(100vw - 32px);
    background: #fff; border: 1px solid var(--grigio-200); border-radius: var(--radius); box-shadow: var(--ombra);
    z-index: 30; overflow: hidden;
  }
  .notifiche-pannello.hidden { display: none; }
  .notifiche-pannello-head { padding: 10px 14px; font-size: 13px; font-weight: 650; border-bottom: 1px solid var(--grigio-200); }
  .notifiche-lista { max-height: 360px; overflow-y: auto; }
  .notifiche-vuoto { padding: 22px 14px; text-align: center; color: var(--grigio-600); font-size: 12.5px; }
  .notifica-riga {
    display: block; width: 100%; text-align: left; border: none; background: none; cursor: pointer;
    padding: 10px 14px; border-bottom: 1px solid var(--grigio-100); font-family: inherit;
  }
  .notifica-riga:hover { background: var(--grigio-100); }
  .notifica-riga.non-letta { background: #eef4ff; }
  .notifica-riga.non-letta:hover { background: #e4edff; }
  .notifica-riga-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 650; color: var(--grigio-900); }
  .notifica-riga-ods { color: var(--grigio-600); font-weight: 500; }
  .notifica-riga-evento { font-size: 12.5px; margin-top: 3px; color: var(--grigio-900); }
  .notifica-riga-ora { font-size: 10.5px; color: var(--grigio-600); margin-top: 4px; }

  nav.tabs { display: flex; gap: 4px; background: #fff; border-bottom: 1px solid var(--grigio-200); padding: 0 20px; position: sticky; top: 60px; z-index: 19; overflow-x: auto; }
  nav.tabs button { border: none; background: none; padding: 14px 16px; font-size: 14px; font-weight: 500; color: var(--grigio-600); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav.tabs button:hover { color: var(--grigio-900); }
  nav.tabs button.active { color: var(--blu-scuro); border-bottom-color: var(--blu); }

  main { flex: 1; padding: 20px 24px 60px; max-width: 1400px; width: 100%; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  .card { background: #fff; border-radius: var(--radius); box-shadow: var(--ombra); padding: 18px 20px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  .card .sub { color: var(--grigio-600); font-size: 12.5px; margin: -8px 0 14px; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--grigio-600); font-weight: 500; }
  input, select, textarea { font-family: inherit; font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--grigio-400); border-radius: 6px; background: #fff; color: var(--grigio-900); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--blu); outline-offset: -1px; border-color: var(--blu); }
  input[type=checkbox] { width: 16px; height: 16px; }
  input[type=color] { padding: 2px; width: 46px; height: 34px; }

  button.btn { background: var(--blu); color: #fff; border: none; padding: 9px 16px; border-radius: 6px; font-size: 13.5px; font-weight: 500; cursor: pointer; }
  button.btn:hover { background: var(--blu-scuro); }
  button.btn.secondary { background: #fff; color: var(--grigio-900); border: 1px solid var(--grigio-400); }
  button.btn.secondary:hover { background: var(--grigio-100); }
  button.btn.danger { background: #fff; color: var(--rosso); border: 1px solid #f3c2bd; }
  button.btn.danger:hover { background: #fdecea; }
  button.btn.small { padding: 5px 10px; font-size: 12px; }
  button.btn:disabled { opacity: .5; cursor: default; }

  table { width: 100%; border-collapse: collapse; }
  table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--grigio-600); padding: 8px 10px; border-bottom: 2px solid var(--grigio-200); white-space: nowrap; }
  table td { padding: 9px 10px; border-bottom: 1px solid var(--grigio-200); font-size: 13px; vertical-align: middle; }
  table tr:hover td { background: #fafbfc; }
  .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11.5px; font-weight: 600; }
  .badge.Urgente { background: #fce8e6; color: #c5221f; }
  .badge.Alta { background: #fef7e0; color: #b06000; }
  .badge.Normale { background: #e8f0fe; color: #1a56c4; }
  .badge.Bassa { background: var(--grigio-200); color: var(--grigio-600); }
  .badge.stato-Pianificato { background: #e6f4ea; color: #137333; }
  .badge.stato-Da-pianificare { background: #e8eaed; color: var(--grigio-600); }
  .badge.stato-Completato { background: #d2e3fc; color: #174ea6; }
  .badge.stato-Annullato { background: #f1f3f4; color: #9aa0a6; text-decoration: line-through; }
  .badge.stato-Non-pianificabile { background: #fce8e6; color: #c5221f; }

  .empty-hint { color: var(--grigio-600); font-size: 13px; padding: 20px 0; text-align: center; }

  .summary-cards { display: flex; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .summary-card { flex: 1; min-width: 160px; background: #fff; border-radius: var(--radius); box-shadow: var(--ombra); padding: 16px; }
  .summary-card .num { font-size: 26px; font-weight: 700; }
  .summary-card .lbl { font-size: 12px; color: var(--grigio-600); margin-top: 2px; }
  .summary-card.ok .num { color: var(--verde); }
  .summary-card.warn .num { color: var(--rosso); }

  .board { display: flex; flex-direction: column; gap: 16px; }
  .board-day { background: #fff; border-radius: var(--radius); box-shadow: var(--ombra); overflow: hidden; }
  .board-day > .day-title { background: var(--grigio-900); color: #fff; padding: 10px 16px; font-weight: 600; font-size: 13px; }
  .board-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0; }
  .board-team { padding: 12px 14px; border-right: 1px solid var(--grigio-200); border-top: 1px solid var(--grigio-200); }
  .board-team .team-head { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .team-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .stop { border-left: 3px solid var(--blu); background: var(--grigio-100); border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; font-size: 12.5px; }
  .stop .ora { font-weight: 700; }
  .stop .cliente { font-weight: 600; }
  .stop.libera { border-left-color: var(--grigio-400); color: var(--grigio-600); }
  .produzione-indicatore { font-size: 11.5px; color: var(--grigio-600); margin-bottom: 6px; }
  .produzione-indicatore.ok { color: var(--verde); font-weight: 600; }

  .stop .meta { color: var(--grigio-600); font-size: 11.5px; }

  .non-pianificabili-list { display: flex; flex-direction: column; gap: 8px; }
  .np-item { display: flex; justify-content: space-between; align-items: center; background: #fce8e6; border-radius: 6px; padding: 8px 12px; font-size: 13px; }
  .np-item .motivo { color: #c5221f; font-size: 12px; }

  .route-endpoint { background: #eef3fc; border-radius: 6px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 8px; color: #1a56c4; }
  .route-stop { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--grigio-200); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .route-stop-order { width: 26px; height: 26px; border-radius: 50%; background: var(--blu); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .route-stop-body { flex: 1; min-width: 0; }
  .route-stop-time { font-weight: 700; font-size: 13px; }
  .route-stop-client { font-weight: 600; }
  .route-stop-meta { font-size: 11.5px; color: var(--grigio-600); }
  .route-stop-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .route-stop-actions button { border: 1px solid var(--grigio-400); background: #fff; border-radius: 5px; width: 26px; height: 26px; cursor: pointer; font-size: 12px; }
  .route-stop-actions button:hover { background: var(--grigio-100); }
  .route-stop-actions button:disabled { opacity: .35; cursor: default; }
  .checklist-row { display: flex; align-items: center; gap: 4px; }
  .warn-icon { color: #b06000; font-size: 12px; cursor: help; }
  tr.row-disabled { opacity: .5; }
  tr.row-disabled input[type=checkbox] { cursor: not-allowed; }

  .checklist-squadre { display: flex; flex-wrap: wrap; gap: 8px; }
  .checklist-squadre label { display: flex; align-items: center; gap: 6px; background: var(--grigio-100); border: 1px solid var(--grigio-200); border-radius: 20px; padding: 6px 12px 6px 8px; font-size: 12.5px; cursor: pointer; }
  .checklist-squadre input[type=checkbox] { margin: 0; }

  .ferie-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .ferie-riga { display: flex; align-items: center; gap: 6px; }
  .ferie-riga input[type=date] { flex: 1; min-width: 0; }
  .ferie-rimuovi { border: 1px solid var(--grigio-400); background: #fff; border-radius: 5px; width: 26px; height: 26px; cursor: pointer; font-size: 12px; flex-shrink: 0; }
  .ferie-rimuovi:hover { background: var(--grigio-100); }

  #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  #modal-overlay.hidden { display: none; }
  #modal-box { background: #fff; border-radius: var(--radius); width: min(560px, 92vw); max-height: 88vh; overflow-y: auto; padding: 22px; }
  #modal-box h3 { margin: 0 0 16px; }
  #modal-form { display: flex; flex-direction: column; gap: 12px; }
  #modal-form .field { width: 100%; }
  #modal-form input, #modal-form select { width: 100%; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .field-help { font-size: 11px; color: var(--grigio-600); }

  #pian-selezione-mappa-wrap { margin-bottom: 14px; }
  #pian-selezione-mappa-wrap.hidden { display: none; }
  #pian-selezione-mappa { width: 100%; height: 420px; border-radius: var(--radius); overflow: hidden; }
  .mappa-legenda { display: flex; gap: 16px; font-size: 12px; color: var(--grigio-600); margin-top: 8px; flex-wrap: wrap; }
  .mappa-legenda .legenda-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .legenda-dot.disponibile, .marker-selezione.disponibile { background: var(--arancio); }
  .legenda-dot.selezionato, .marker-selezione.selezionato { background: var(--verde); }
  .legenda-dot.incompatibile, .marker-selezione.incompatibile { background: var(--grigio-400); }
  .legenda-dot.altrove, .marker-selezione.altrove { background: var(--blu-scuro); }
  .marker-selezione { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .popup-selezione { font-size: 12.5px; line-height: 1.5; max-width: 220px; }
  .popup-selezione .popup-warn { color: #b06000; font-size: 11.5px; }
  .popup-selezione .popup-altrove { color: var(--blu-scuro); font-size: 11.5px; }
  .popup-selezione button { margin-top: 6px; }
  .badge-altrove { display: inline-block; background: var(--grigio-100); color: var(--blu-scuro); border-radius: 10px; padding: 2px 8px; font-size: 11px; white-space: nowrap; }

  .map-preview-toggle { align-self: flex-start; border: none; background: none; color: var(--blu-scuro); font-size: 12px; font-weight: 600; cursor: pointer; padding: 2px 0; }
  .map-preview-toggle:hover { text-decoration: underline; }
  .map-preview-status { font-size: 11.5px; margin-bottom: 4px; }
  .map-preview-status.ok { color: #137333; }
  .map-preview-status.warn { color: #c5221f; font-weight: 600; }
  .map-preview-wrap { margin-top: 4px; border: 1px solid var(--grigio-400); border-radius: 6px; overflow: hidden; resize: vertical; height: 160px; min-height: 120px; max-height: 480px; }
  .map-preview-wrap.hidden { display: none; }
  .map-preview-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

  #toast { position: fixed; bottom: 20px; right: 20px; background: var(--grigio-900); color: #fff; padding: 12px 18px; border-radius: 6px; font-size: 13px; z-index: 200; box-shadow: var(--ombra); transition: opacity .2s; }
  #toast.hidden { opacity: 0; pointer-events: none; }
  #toast.error { background: var(--rosso); }
  #toast.success { background: var(--verde); }

  .hidden { display: none !important; }
  body.role-cliente .admin-only, body.role-squadra .admin-only { display: none !important; }
  body.role-squadra .hide-squadra { display: none !important; }
  .squadra-only { display: none !important; }
  body.role-squadra .squadra-only { display: inline-block !important; }
  .filters { margin-bottom: 14px; }
  .table-wrap { overflow-x: auto; }

  @media (prefers-color-scheme: dark) {
    html, body { background: #17181a; color: #e8eaed; }
    header.topbar, nav.tabs, .card, .summary-card, .board-day, #modal-box, .notifiche-pannello { background: #232427; }
    header.topbar, nav.tabs, .notifiche-pannello { border-color: #35363a; }
    .btn-notifiche:hover { background: #2c2d30; }
    .notifiche-pannello-head { border-color: #35363a; }
    .notifica-riga { border-color: #2c2d30; }
    .notifica-riga:hover { background: #2a2b2e; }
    .notifica-riga.non-letta { background: #1b2a44; }
    .notifica-riga.non-letta:hover { background: #203354; }
    .notifica-riga-head { color: #e8eaed; }
    .notifica-riga-evento { color: #e8eaed; }
    table th { border-color: #35363a; color: #9aa0a6; }
    table td { border-color: #2c2d30; }
    table tr:hover td { background: #2a2b2e; }
    input, select, textarea { background: #1b1c1e; color: #e8eaed; border-color: #46474b; }
    .stop { background: #1b1c1e; }
    .board-team { border-color: #35363a; }
    .route-stop { background: #232427; border-color: #35363a; }
    .route-endpoint { background: #1b2a44; color: #8ab4f8; }
    .route-stop-actions button { background: #1b1c1e; border-color: #46474b; color: #e8eaed; }
    .checklist-squadre label { background: #1b1c1e; border-color: #35363a; }
  }

  /* =========================================================================
     REDESIGN — nuovo sistema di token, introdotto schermata per schermata.
     Le viste non ancora ridisegnate continuano a usare i token/stili sopra;
     questo blocco convive con essi senza modificarli, per non alterare le
     tab non ancora aggiornate durante la migrazione incrementale.
     ========================================================================= */
  :root {
    --dp-ink: #152225;
    --dp-ink-soft: #46595c;
    --dp-ink-faint: #7c8e90;
    --dp-surface: #F4F7F7;
    --dp-surface-card: #ffffff;
    --dp-line: #dde5e5;
    --dp-line-soft: #e9eff0;
    --dp-accent: #1B6B7C;
    --dp-accent-strong: #124F5C;
    --dp-accent-wash: #e7f1f3;
    --dp-good: #2E7D5B;
    --dp-good-wash: #e5f2ec;
    --dp-warn: #B4740E;
    --dp-warn-wash: #fbf1e0;
    --dp-danger: #B23A2E;
    --dp-danger-wash: #fbeae8;
    --dp-sospeso: #6B3FA0;
    --dp-sospeso-wash: #efe3fb;
    --dp-radius: 10px;
    --dp-radius-sm: 7px;
    --dp-shadow: 0 1px 2px rgba(21,34,37,.06), 0 4px 14px rgba(21,34,37,.05);
    --dp-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --dp-ink: #E9EFEE;
      --dp-ink-soft: #aebcbd;
      --dp-ink-faint: #7c8e90;
      --dp-surface: #10181a;
      --dp-surface-card: #182224;
      --dp-line: #263335;
      --dp-line-soft: #1e2a2c;
      --dp-accent: #3FA6BA;
      --dp-accent-strong: #6fc1d1;
      --dp-accent-wash: #16333a;
      --dp-good: #56b98c;
      --dp-good-wash: #133226;
      --dp-warn: #d99a3f;
      --dp-warn-wash: #382a12;
      --dp-danger: #e2685a;
      --dp-danger-wash: #3a1d1a;
      --dp-sospeso: #b78ee0;
      --dp-sospeso-wash: #2e2140;
      --dp-shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }

  .screen-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .screen-toolbar h2 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.015em; color: var(--dp-ink); }
  .screen-toolbar .toolbar-actions { display: flex; align-items: center; gap: 10px; }

  .search-field { position: relative; }
  .search-field svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--dp-ink-faint); pointer-events: none; }
  .search-field input {
    font-family: inherit; font-size: 13.5px; padding: 9px 12px 9px 33px;
    border: 1px solid var(--dp-line); border-radius: var(--dp-radius-sm);
    background: var(--dp-surface-card); color: var(--dp-ink); width: 240px;
  }
  .search-field input:focus { outline: none; border-color: var(--dp-accent); box-shadow: 0 0 0 3px var(--dp-accent-wash); }

  .btn-primary {
    font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 9px 16px;
    border-radius: var(--dp-radius-sm); border: 1px solid transparent; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    background: var(--dp-accent); color: #fff;
  }
  .btn-primary:hover { background: var(--dp-accent-strong); }
  .btn-secondary {
    font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 9px 16px;
    border-radius: var(--dp-radius-sm); border: 1px solid var(--dp-line); cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    background: var(--dp-surface-card); color: var(--dp-ink);
  }
  .btn-secondary:hover { background: var(--dp-line-soft); }
  .btn-secondary:disabled { opacity: .55; cursor: default; }
  .btn-icon {
    width: 32px; height: 32px; padding: 0; border-radius: var(--dp-radius-sm);
    border: 1px solid var(--dp-line); background: var(--dp-surface-card); color: var(--dp-ink-soft);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .btn-icon:hover { background: var(--dp-line-soft); color: var(--dp-ink); }
  .btn-icon.danger:hover { background: var(--dp-danger-wash); color: var(--dp-danger); border-color: var(--dp-danger); }

  .team-list { background: var(--dp-surface-card); border: 1px solid var(--dp-line); border-radius: var(--dp-radius); box-shadow: var(--dp-shadow); overflow: hidden; }
  .team-list-head, .team-row {
    display: grid;
    grid-template-columns: 22px 1.5fr 1.6fr 108px 108px 74px 1fr 74px;
    gap: 14px; align-items: center;
  }
  .team-list-head {
    padding: 10px 18px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--dp-ink-faint); border-bottom: 1px solid var(--dp-line);
  }
  .team-row { padding: 14px 18px; border-bottom: 1px solid var(--dp-line-soft); }
  .team-row:last-child { border-bottom: none; }
  .team-row:hover { background: var(--dp-line-soft); }
  .team-row.is-inactive { opacity: .58; }

  .team-dot { width: 12px; height: 12px; border-radius: 50%; }
  .team-name { font-weight: 620; color: var(--dp-ink); }
  .team-competenze { font-size: 11.5px; color: var(--dp-ink-faint); margin-top: 1px; }

  .team-address { font-size: 12.5px; color: var(--dp-ink-soft); display: flex; flex-direction: column; gap: 2px; }
  .team-address .addr-line { display: flex; align-items: baseline; gap: 5px; }
  .team-address .addr-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--dp-ink-faint); width: 54px; flex-shrink: 0; }
  .team-address svg { flex-shrink: 0; color: var(--dp-ink-faint); }

  .team-hours, .team-lunch { font-family: var(--dp-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--dp-ink); }
  .team-lunch.none { font-family: inherit; color: var(--dp-ink-faint); font-style: italic; font-size: 12px; }

  .toggle { position: relative; display: inline-block; width: 38px; height: 22px; }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle .track { position: absolute; inset: 0; background: var(--dp-line); border-radius: 999px; cursor: pointer; transition: background .15s ease; }
  .toggle .track::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s ease; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .toggle input:checked + .track { background: var(--dp-good); }
  .toggle input:checked + .track::before { transform: translateX(16px); }
  .toggle input:disabled + .track { opacity: .6; cursor: default; }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 620; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .chip-neutral { background: var(--dp-line-soft); color: var(--dp-ink-soft); }
  .chip-warn { background: var(--dp-warn-wash); color: var(--dp-warn); }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }

  .check-inline { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--dp-ink-soft); margin: 2px 0; }
  .check-inline input { width: 15px; height: 15px; accent-color: var(--dp-accent); }

  .color-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatches .swatch { width: 28px; height: 28px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; display: grid; place-items: center; color: #fff; }
  .color-swatches .swatch.selected { border-color: var(--dp-ink); }

  /* Il modale generico (SQUADRE/INTERVENTI) adotta i nuovi token: qualunque schermata lo usi
     eredita già lo stile aggiornato, senza bisogno di ridefinirlo per ciascuna. */
  #modal-box { background: var(--dp-surface-card); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  #modal-box h3 { color: var(--dp-ink); font-weight: 650; }
  #modal-form .field label { color: var(--dp-ink-soft); font-weight: 620; font-size: 12px; }
  #modal-form input, #modal-form select, #modal-form textarea {
    border-color: var(--dp-line); background: var(--dp-surface); color: var(--dp-ink); border-radius: var(--dp-radius-sm);
  }
  #modal-form input:focus, #modal-form select:focus { outline: none; border-color: var(--dp-accent); box-shadow: 0 0 0 3px var(--dp-accent-wash); }
  #modal-form .field-help { color: var(--dp-ink-faint); }
  .modal-actions { border-top: 1px solid var(--dp-line-soft); padding-top: 16px; }
  .checklist-squadre label { background: var(--dp-surface); border-color: var(--dp-line); color: var(--dp-ink-soft); }
  .ferie-riga input { border-color: var(--dp-line); }
  #modal-form button.btn.secondary.small, .ferie-rimuovi { border-color: var(--dp-line); color: var(--dp-ink-soft); background: var(--dp-surface-card); }

  @media (prefers-color-scheme: dark) {
    .checklist-squadre label { background: var(--dp-surface); border-color: var(--dp-line); }
  }

  /* ---- Interventi (Screen E) ---- */
  .import-banner {
    display: flex; align-items: center; gap: 14px;
    background: var(--dp-surface-card); border: 1px solid var(--dp-line-soft); border-radius: var(--dp-radius-sm);
    padding: 12px 16px; margin-bottom: 20px;
  }
  .import-banner .import-icon {
    width: 34px; height: 34px; border-radius: 8px; background: var(--dp-accent-wash); color: var(--dp-accent-strong);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .import-banner .import-copy { flex: 1; min-width: 0; }
  .import-banner .import-copy p { margin: 0; font-size: 12.5px; color: var(--dp-ink-soft); }
  .import-banner .import-copy details { margin-top: 2px; }
  .import-banner .import-copy summary { font-size: 11.5px; color: var(--dp-accent-strong); cursor: pointer; font-weight: 600; list-style: none; display: inline-block; }
  .import-banner .import-copy summary::-webkit-details-marker { display: none; }
  .import-banner .import-copy summary:hover { text-decoration: underline; }
  .import-banner .import-copy .tecnico { font-size: 11.5px; color: var(--dp-ink-faint); margin-top: 6px; max-width: 62ch; }
  .import-result { font-size: 11.5px; color: var(--dp-good); margin-top: 6px; display: none; }
  .import-result.show { display: block; }
  .import-result.warn { color: var(--dp-warn); }
  .btn-secondary-sm {
    font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 7px 13px;
    border-radius: var(--dp-radius-sm); border: 1px solid var(--dp-line); background: var(--dp-surface); color: var(--dp-ink);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0;
  }
  .btn-secondary-sm:hover { background: var(--dp-line-soft); }
  .btn-secondary-sm:disabled { opacity: .55; cursor: default; }

  .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-bar select {
    font-family: inherit; font-size: 13px; padding: 8px 30px 8px 11px; border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius-sm); background-color: var(--dp-surface-card);
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%237c8e90" stroke-width="2.3" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>');
    background-repeat: no-repeat; background-position: right 9px center;
    color: var(--dp-ink); appearance: none; cursor: pointer;
  }
  .filter-bar select:focus { outline: none; border-color: var(--dp-accent); box-shadow: 0 0 0 3px var(--dp-accent-wash); }

  .result-count { font-size: 12.5px; color: var(--dp-ink-faint); margin-bottom: 10px; }
  .result-count strong { color: var(--dp-ink); font-variant-numeric: tabular-nums; }

  .filtro-singolo-chip {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600;
    padding: 6px 8px 6px 12px; margin-bottom: 10px; border-radius: 999px;
    background: var(--dp-accent-wash); color: var(--dp-accent);
  }
  .filtro-singolo-chip.hidden { display: none; }
  .filtro-singolo-chip button {
    border: none; background: rgba(0,0,0,.08); color: inherit; width: 18px; height: 18px; border-radius: 50%;
    cursor: pointer; font-size: 11px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
  }
  .filtro-singolo-chip button:hover { background: rgba(0,0,0,.16); }

  .int-list { background: var(--dp-surface-card); border: 1px solid var(--dp-line); border-radius: var(--dp-radius); box-shadow: var(--dp-shadow); overflow: visible; }
  .int-list-head, .int-row {
    display: grid;
    grid-template-columns: 1.9fr 108px 92px 66px 118px 150px 132px 118px 110px;
    gap: 12px; align-items: center;
  }
  .int-list-head { padding: 10px 18px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--dp-ink-faint); border-bottom: 1px solid var(--dp-line); }
  .int-row { padding: 13px 18px; border-bottom: 1px solid var(--dp-line-soft); position: relative; }
  .int-row:last-child { border-bottom: none; }
  .int-row:hover { background: var(--dp-line-soft); }
  .int-row.is-annullato { opacity: .55; }

  .int-cliente { font-weight: 620; color: var(--dp-ink); }
  .int-indirizzo { font-size: 12px; color: var(--dp-ink-faint); margin-top: 1px; }
  .int-competenza { font-size: 12.5px; color: var(--dp-ink-soft); }
  .int-competenza.any { color: var(--dp-ink-faint); font-style: italic; }

  .badge-urgente { background: var(--dp-danger-wash); color: var(--dp-danger); }
  .badge-alta { background: var(--dp-warn-wash); color: var(--dp-warn); }
  .badge-normale { background: var(--dp-accent-wash); color: var(--dp-accent-strong); }
  .badge-bassa { background: var(--dp-line-soft); color: var(--dp-ink-soft); }

  .int-durata, .int-finestra, .int-dataora { font-family: var(--dp-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--dp-ink); }
  .int-finestra.tutto-giorno { font-family: inherit; color: var(--dp-ink-faint); font-style: italic; font-size: 12px; }
  .int-dataora.none { font-family: inherit; color: var(--dp-ink-faint); }

  .stato-cell { display: flex; align-items: center; gap: 6px; }
  .badge-stato-dapianificare { background: var(--dp-warn-wash); color: var(--dp-warn); }
  .badge-stato-pianificato { background: var(--dp-good-wash); color: var(--dp-good); }
  .badge-stato-completato { background: var(--dp-accent-wash); color: var(--dp-accent-strong); }
  .badge-stato-annullato { background: var(--dp-line-soft); color: var(--dp-ink-faint); text-decoration: line-through; }
  .badge-stato-sospeso { background: var(--dp-sospeso-wash); color: var(--dp-sospeso); }

  .info-icon { position: relative; display: inline-flex; color: var(--dp-ink-faint); cursor: help; }
  .info-icon .tooltip {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: var(--dp-ink); color: var(--dp-surface); font-size: 11.5px; font-weight: 400;
    padding: 8px 11px; border-radius: 7px; width: 220px; line-height: 1.4;
    opacity: 0; pointer-events: none; transition: opacity .12s ease; z-index: 10;
    box-shadow: var(--dp-shadow);
  }
  .info-icon .tooltip::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--dp-ink);
  }
  .info-icon:hover .tooltip, .info-icon:focus-visible .tooltip { opacity: 1; }

  .int-squadra { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dp-ink); }
  .int-squadra .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .int-squadra.none { color: var(--dp-ink-faint); }

  .row-actions { display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap; }
  .btn-icon.good:hover { background: var(--dp-good-wash); color: var(--dp-good); border-color: var(--dp-good); }

  /* ---- Dashboard (Screen A) ---- */
  .dash-topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .dash-topbar h2 { margin: 0 0 8px; font-size: 20px; font-weight: 650; letter-spacing: -.015em; color: var(--dp-ink); }

  .date-range { display: flex; align-items: center; gap: 6px; border: 1px solid var(--dp-line); border-radius: var(--dp-radius-sm); padding: 4px 6px; background: var(--dp-surface-card); width: fit-content; }
  .date-range span.sep { font-size: 12px; color: var(--dp-ink-faint); }
  .date-range input[type=date] {
    padding: 6px 8px; border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: var(--dp-ink); font-size: 13px; font-family: var(--dp-mono);
  }
  .date-range input[type=date]:focus { outline: none; background: var(--dp-accent-wash); }
  .date-range-hint { font-size: 11px; color: var(--dp-ink-faint); margin-top: 4px; }

  .dash-body { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; margin-bottom: 16px; }
  .dash-teams { display: flex; flex-direction: column; gap: 10px; max-height: 600px; overflow-y: auto; }
  .dash-team-card { background: var(--dp-surface-card); border: 1px solid var(--dp-line); border-radius: var(--dp-radius); padding: 13px 14px; cursor: pointer; box-shadow: var(--dp-shadow); }
  .dash-team-card.selected { border-color: var(--dp-accent); box-shadow: 0 0 0 2px var(--dp-accent-wash); }
  .dash-team-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dash-team-card-name { font-weight: 640; color: var(--dp-ink); flex: 1; }
  .dash-team-produzione-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--dp-ink-soft); margin-bottom: 4px; }
  .dash-progress-track { height: 5px; border-radius: 3px; background: var(--dp-line-soft); overflow: hidden; margin-bottom: 6px; }
  .dash-progress-fill { height: 100%; border-radius: 3px; background: var(--dp-warn); }
  .dash-progress-fill.good { background: var(--dp-good); }
  .dash-team-meta-row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dp-ink-faint); }

  .dash-map-wrap { border: 1px solid var(--dp-line); border-radius: var(--dp-radius); overflow: hidden; box-shadow: var(--dp-shadow); }
  #dash-map { width: 100%; height: 600px; }

  .dash-map-toolbar { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--dp-line); background: var(--dp-surface-card); }
  .map-mode-btn {
    font-family: inherit; font-size: 12.5px; font-weight: 620; padding: 6px 13px; border-radius: 999px;
    border: 1px solid var(--dp-line); background: var(--dp-surface); color: var(--dp-ink-soft); cursor: pointer;
  }
  .map-mode-btn:hover { background: var(--dp-line-soft); }
  .map-mode-btn.active { background: var(--dp-accent); color: #fff; border-color: var(--dp-accent); }

  #dash-map-legenda { padding: 9px 16px; border-top: 1px solid var(--dp-line); background: var(--dp-surface-card); margin: 0; }
  #dash-map-legenda.hidden { display: none; }

  .dash-detail { background: var(--dp-surface-card); border: 1px solid var(--dp-line); border-radius: var(--dp-radius); box-shadow: var(--dp-shadow); padding: 18px 20px; }
  .dash-detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 14px; }
  .dash-detail-head-left { display: flex; align-items: center; gap: 8px; }
  .dash-detail-head-left h3 { margin: 0; font-size: 16px; font-weight: 650; color: var(--dp-ink); }
  .dash-detail-summary { display: flex; gap: 18px; font-size: 12.5px; color: var(--dp-ink-soft); }
  .dash-detail-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

  .dash-day-group { margin-top: 14px; }
  .dash-day-group-head {
    display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 650;
    color: var(--dp-ink-soft); padding: 6px 10px; background: var(--dp-line-soft); border-radius: 6px; margin-bottom: 2px;
  }

  .dash-stop-list { border-top: 1px solid var(--dp-line); margin-top: 4px; }
  .dash-stop-row {
    display: grid; grid-template-columns: 60px 1.5fr 1.8fr 80px 110px 130px;
    gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--dp-line-soft); font-size: 12.5px;
  }
  .dash-stop-row-head { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--dp-ink-faint); }
  .dash-stop-ora, .dash-stop-durata, .dash-stop-telefono { font-family: var(--dp-mono); color: var(--dp-ink); }
  .dash-stop-cliente { font-weight: 620; color: var(--dp-ink); }
  .dash-stop-indirizzo { color: var(--dp-ink-faint); }
  .dash-empty-detail { text-align: center; padding: 30px 0; color: var(--dp-ink-soft); }
  .dash-empty-detail .btn-primary { margin: 12px auto 0; }

  @media (max-width: 960px) {
    .dash-body { grid-template-columns: 1fr; }
    .dash-teams { max-height: none; }
  }

  /* dialog overlays generici (riusati da: pianifica intervallo / seleziona da elenco / aggiungi intervento) */
  .dlg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100000; padding: 20px; }
  .dlg-overlay.hidden { display: none; }
  .dlg-box { background: var(--dp-surface-card); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); width: min(760px, 96vw); max-height: 90vh; overflow-y: auto; padding: 22px; }
  .dlg-box.wide { width: min(1000px, 96vw); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .dlg-head h3 { margin: 0; font-size: 16px; font-weight: 650; color: var(--dp-ink); }
  .dlg-close { border: none; background: none; font-size: 18px; cursor: pointer; color: var(--dp-ink-faint); padding: 4px 8px; flex-shrink: 0; }
  .dlg-close:hover { color: var(--dp-ink); }

  .dlg-selezione-giorno-field { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .dlg-selezione-giorno-field label { font-size: 11.5px; font-weight: 620; color: var(--dp-ink-soft); }
  .dlg-selezione-giorno-field input[type=date] {
    padding: 6px 8px; border: 1px solid var(--dp-line); border-radius: var(--dp-radius-sm);
    background: var(--dp-surface-card); color: var(--dp-ink); font-size: 13px; font-family: var(--dp-mono);
  }
  .dlg-selezione-giorno-field input[type=date]:focus { outline: none; border-color: var(--dp-accent); box-shadow: 0 0 0 3px var(--dp-accent-wash); }

  @media (prefers-color-scheme: dark) {
    .dlg-box { box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  }

  /* popup elenco note (icona storia nel tab Interventi): righe data/autore/stato + testo nota */
  .lista-note { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; }
  .nota-voce { border-left: 3px solid var(--dp-line); padding: 4px 0 4px 10px; }
  .nota-voce-meta { font-size: 11.5px; font-weight: 620; color: var(--dp-ink-faint); }
  .nota-voce-testo { font-size: 13px; color: var(--dp-ink); margin-top: 2px; }

  /* popup documenti allegati (icona graffetta nel tab Interventi / Squadra) */
  .lista-documenti { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; margin-bottom: 14px; }
  .doc-riga { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--dp-line-soft); font-size: 13px; }
  .doc-riga:last-child { border-bottom: none; }
  .doc-riga a { flex: 1; display: flex; align-items: center; gap: 6px; color: var(--dp-accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-riga a:hover { text-decoration: underline; }
  .doc-meta { font-size: 11px; color: var(--dp-ink-faint); white-space: nowrap; }
  .documenti-upload { display: flex; gap: 8px; align-items: center; padding-top: 10px; border-top: 1px solid var(--dp-line); }
  .documenti-upload input[type=file] { flex: 1; font-size: 12.5px; color: var(--dp-ink-soft); }

  /* Indicatore di caricamento generico: applicato a un container mentre attende una risposta dal
     server (che su Apps Script/Sheets può richiedere qualche secondo) — attenua il contenuto e
     mostra uno spinner sopra, così l'utente capisce che qualcosa sta succedendo invece di pensare
     che l'interfaccia sia bloccata. */
  .is-loading { position: relative; pointer-events: none; opacity: .5; min-height: 60px; transition: opacity .1s ease; }
  .is-loading::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
    margin: -15px 0 0 -15px; border: 3px solid var(--dp-line); border-top-color: var(--dp-accent);
    border-radius: 50%; animation: dp-spin .7s linear infinite; z-index: 5;
  }
  @keyframes dp-spin { to { transform: rotate(360deg); } }

  /* ---------- tab Analysis ---------- */
  .an-toolbar {
    display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
    background: var(--dp-surface-card); border: 1px solid var(--dp-line); border-radius: var(--dp-radius); padding: 14px 16px;
  }
  .an-filtro-campo { display: flex; flex-direction: column; gap: 4px; }
  .an-filtro-campo label { font-size: 11px; font-weight: 620; color: var(--dp-ink-soft); text-transform: uppercase; letter-spacing: .03em; }
  .an-filtro-campo input[type=date] {
    padding: 6px 8px; border: 1px solid var(--dp-line); border-radius: var(--dp-radius-sm);
    background: var(--dp-surface-card); color: var(--dp-ink); font-size: 13px; font-family: var(--dp-mono);
  }
  .an-filtro-campo select { padding: 6px 8px; border: 1px solid var(--dp-line); border-radius: var(--dp-radius-sm); background: var(--dp-surface-card); color: var(--dp-ink); font-size: 13px; }
  .an-preset { flex-direction: row; gap: 6px; }
  .an-check-inline { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dp-ink-soft); }

  .an-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
  .an-card {
    background: var(--dp-surface-card); border: 1px solid var(--dp-line); border-radius: var(--dp-radius);
    padding: 16px 18px; grid-column: span 1;
